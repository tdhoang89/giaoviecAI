<script type="text/markdown" id="md-7" data-file="07-thuc-chien-soan-thao.md">
# Chương 7 — Thực chiến: soạn thảo văn bản và báo cáo

*Trong chương này, bạn sẽ xem cùng một cái email khó viết được giao theo ba cách khác nhau — và nhận về ba sản phẩm khác nhau đến bất ngờ. Từ đó, ta bàn chuyện khó nói nhất trong nghề soạn thảo: làm sao chuyển giao được "taste" — cái giọng, cái chất riêng của bạn — cho một model chưa từng đọc thứ gì bạn viết.*

## Thí nghiệm mở màn: cái email không ai muốn viết

Tình huống thật, và tôi tin nhiều bạn từng gặp: công ty bạn quyết định không gia hạn hợp đồng với một đối tác đã làm cùng năm năm. Không phải vì họ tệ — chỉ là chiến lược đổi hướng. Bạn được giao viết email báo tin. Quan hệ này còn dùng lại được trong tương lai, người bên kia lại là chỗ quen biết của sếp bạn. Viết ngắn quá thì phũ, dài quá thì như thanh minh. Đây là loại email mà bạn mở màn hình ra, gõ được hai dòng, rồi ngồi nhìn con trỏ nhấp nháy.

Giờ thử giao cho AI theo ba cách.

Cách thứ nhất, một câu trần trụi:

```text
Viết giúp tôi email từ chối gia hạn hợp đồng với công ty X.
```

Cách thứ hai, kèm bối cảnh và ranh giới:

```text
Tôi cần viết email báo cho công ty X rằng bên tôi không gia hạn hợp đồng
dịch vụ năm sau. Bối cảnh: họ là đối tác 5 năm, làm việc tử tế, lý do
dừng là bên tôi đổi hướng chiến lược chứ không phải do chất lượng của họ.
Điều tôi muốn giữ: quan hệ — rất có thể 1-2 năm nữa quay lại làm cùng.
Điều tuyệt đối tránh: mọi câu chữ có thể đọc thành chê trách họ, và đừng
hứa hẹn cụ thể chuyện hợp tác lại (chỉ để ngỏ). Giọng: trọng thị nhưng
ấm, kiểu người quen lâu năm nói chuyện thẳng với nhau. Độ dài: đọc trong
một phút.
```

Cách thứ ba, brief tương tự cách hai, nhưng kèm theo hai email cũ do chính bạn viết — một email cảm ơn đối tác, một email thương lượng — và thêm một dòng:

```text
Đính kèm 2 email tôi từng viết cho đối tác. Hãy viết đúng giọng của tôi
trong đó — cách xưng hô, độ dài câu, cách tôi mở đầu và kết thúc.
```

Trước khi đọc tiếp, bạn thử đoán: ba output này sẽ khác nhau thế nào?

Cách một sẽ cho bạn một email đúng mực và vô hồn. Đủ lễ, đủ ý, không sai chỗ nào — và không có chỗ nào là *bạn* cả. Nó giống thư mẫu trong sách "1001 mẫu thư thương mại". Nhưng khoan chê nó: nếu việc không nhạy cảm — từ chối một báo giá của bên chưa từng hợp tác, chẳng hạn — thì email đúng-mực-vô-hồn chính là thứ bạn cần, và cách một là cách nhanh nhất để có nó. Không phải email nào cũng đáng để bạn đầu tư linh hồn.

Cách hai cho bạn một bản gần gửi được. Model biết cần giữ gì, tránh gì, nên nó sẽ tự xử lý được những chỗ tinh tế: nói lý do dừng mà không đổ lỗi, để ngỏ tương lai mà không hứa. Bạn sẽ chỉ phải sửa vài chữ cho hợp miệng mình.

Cách ba cho bạn thứ mà cách hai không thể: một email *nghe như bạn viết*. Cách bạn hay mở đầu bằng một câu hỏi thăm cụ thể thay vì "Dear anh/chị", cách bạn xuống dòng ngắn, cách bạn kết thư — những thứ đó bạn không tự tả nổi, nhưng nằm sờ sờ trong hai email mẫu. Người nhận là chỗ quen biết lâu năm; họ sẽ nhận ra ngay nếu email đổi giọng đột ngột. Với đúng tình huống này, cách ba đáng từng giây bỏ thêm.

Ba cách — ba sản phẩm — ba nhu cầu. Nghệ thuật không nằm ở chỗ thuộc "cách chuẩn", mà ở chỗ nhìn ra việc trước mặt thuộc loại nào.

## Taste: thứ khó tả nhất, nhưng dễ đưa mẫu nhất

Soạn thảo là vương quốc của taste. Research có thể chấm bằng độ đúng, review chấm bằng độ sắc — nhưng một email, một báo cáo thì "được" hay "chưa được" phần lớn nằm ở những thứ rất khó gọi tên: giọng trang trọng đến đâu, câu dài hay ngắn, mở bài vào thẳng hay vòng một nhịp.

Và đây là chỗ nhiều người mắc kẹt: họ cố *mô tả* taste bằng lời. "Giọng chuyên nghiệp nhưng thân thiện, trang trọng nhưng không cứng nhắc, ngắn gọn nhưng đầy đủ." Bạn đọc lại xem — mấy chữ đó gần như không chứa thông tin gì, vì email nào chẳng muốn thế. Model nhận cái brief đó cũng như nhân viên mới nhận nó: gật đầu, rồi viết theo cách hiểu "chuyên nghiệp thân thiện" của riêng nó.

May là taste có một cửa thoát: nó khó mô tả nhưng cực dễ *đưa mẫu*. Một file mẫu đáng giá hơn mười dòng mô tả giọng văn. Hai ba email cũ của bạn, một bản báo cáo từng được sếp khen, một đoạn bạn tâm đắc — đưa kèm và nói "viết theo giọng này" là cách chuyển giao taste rẻ nhất mà tôi biết. Đây chính là tinh thần "nhân viên mới" của cả guide: người mới vào công ty học giọng công ty bằng cách đọc văn bản cũ, chứ không phải bằng cách nghe tả.

Một mẹo nhỏ đi kèm: đừng chỉ đưa mẫu, hãy nói *vì sao* việc này cần. Tài liệu hướng dẫn của Anthropic (tính đến 08/2026) đưa hẳn một khung câu: "I'm working on [the larger task] for [who it's for]. They need [what the output enables]. With that in mind: [request]" — đại ý: tôi đang làm [việc lớn hơn] cho [ai]; họ cần [output này để làm gì]; với bối cảnh đó, hãy [yêu cầu]. Kèm nhận xét rằng model "tends to perform better when it understands the intent behind a request" — làm tốt hơn khi hiểu ý định đằng sau yêu cầu. Một email từ chối viết cho "đối tác 5 năm mà sếp tôi quen" và viết cho "một vendor gửi báo giá lạc" là hai bài toán khác hẳn nhau — và model chỉ biết điều đó nếu bạn kể.

## Báo cáo dài: duyệt dàn ý trước, đừng duyệt cả tòa nhà sau

Email là chuyện vài trăm chữ. Nhưng đến báo cáo quý, kế hoạch năm, tài liệu đào tạo — những thứ vài nghìn chữ — thì có một sai lầm kinh điển: giao một cục, nhận về một cục, rồi phát hiện cục đó xây sai móng.

Tưởng tượng bạn thuê thiết kế xây nhà. Không ai để kiến trúc sư xây xong toàn bộ rồi mới xem bản vẽ. Bạn duyệt bản vẽ trước, vì sửa trên giấy rẻ hơn sửa trên tường gấp trăm lần. Văn bản dài y hệt: hãy yêu cầu dàn ý trước, duyệt dàn ý, rồi mới cho viết.

```text
Tôi cần bản báo cáo tổng kết quý cho ban giám đốc, khoảng 3 trang.
Trước khi viết, hãy đề xuất dàn ý: các phần, mỗi phần định nói gì,
phần nào cần số liệu từ tôi. Tôi duyệt dàn ý xong ta mới viết từng phần.
```

Lượt duyệt dàn ý là lượt rẻ nhất trong cả quá trình: mười giây đọc của bạn đổi được cả giờ viết đúng hướng. Và khi giao văn bản dài, ba thông tin gần như luôn đáng khai báo: độ dài mong muốn, người đọc là ai, và — thứ ít người nghĩ tới — *người đọc đó sẽ soi chỗ nào*. "Sếp tôi luôn lật thẳng xuống phần chi phí và hỏi con số này ở đâu ra" — một câu đó thay đổi cách model viết cả phần chi phí: nó sẽ chú thích nguồn số liệu thay vì nêu số trơn. Còn cách chẻ việc dài thành chuỗi có điểm duyệt một cách bài bản — dàn ý, duyệt, viết phần một, duyệt tiếp — là chuyện của Chương 8, ta sẽ nói kỹ ở đó.

## Đồng-soạn-thảo: sửa từng đoạn, và chê cho ra chê

Bản nháp đầu tiên hiếm khi là bản cuối. Vấn đề là nhiều người chỉnh nháp theo kiểu tốn kém nhất: thấy chưa ưng, gõ "chưa hay lắm, viết lại đi". Model — vốn không đọc được bụng bạn — đành viết lại *toàn bộ*, kể cả ba đoạn bạn đang ưng. Thế là được đoạn này mất đoạn kia, như trò đập chuột.

Cả hai hãng đều thiết kế chỗ cho kiểu làm việc đó. Phía ChatGPT (tính đến 08/2026), phần viết và code được hỗ trợ ngay trong chat qua các khối soạn thảo — writing blocks và code blocks — nơi văn bản đứng thành một khối riêng để sửa qua các lượt. (Nếu bạn từng quen cửa sổ Canvas: OpenAI đã gỡ nó khỏi các model hiện hành từ 28/05/2026 và chuyển chức năng vào thẳng trong chat — một ví dụ sống về chuyện tên tính năng đổi nhanh hơn tư duy.) Claude có Artifacts — vùng riêng nơi sản phẩm được tạo và chỉnh sửa qua các lượt, tách khỏi dòng hội thoại. Chi tiết từng bề mặt xin hẹn ở Chương 10; điều đáng nhớ ở đây là tư duy chúng đại diện: văn bản là *vật đang được hai bên cùng đẽo gọt*, không phải loạt câu trả lời dùng một lần.

Còn khi chê, hãy chê như một biên tập viên chứ đừng chê như một khách hàng khó ở. "Chưa hay lắm" không phải là feedback — đó là một tiếng thở dài. Feedback là: "Đoạn 2 dài quá, cắt còn một nửa. Giọng đoạn kết đang cứng — người nhận là chỗ thân tình, kết ấm hơn. Bỏ chữ 'kính thưa quý đối tác', tôi không bao giờ viết thế." Hướng dẫn của Anthropic có một nguyên tắc gọn: "Tell Claude what to do instead of what not to do" — nói điều bạn muốn thay vì chỉ nói điều bạn không muốn. "Đừng viết sáo rỗng" khiến model đoán mò; "kết bằng một lời hẹn gặp cụ thể" cho nó một cái đích. Mỗi lời chê cụ thể còn có giá trị kép: nó vừa sửa bản này, vừa dạy model thêm một mảnh taste của bạn cho những đoạn sau.

## Đường ranh cuối: đừng gửi thứ bạn không giải thích được

Một cảnh báo để đóng chương, và tôi nói điều này với tư cách người từng suýt vấp.

Model viết nhanh và trơn đến mức có một cám dỗ rất thật: nó viết ra một đoạn nghe rất kêu — một lập luận, một con số, một thuật ngữ — bạn thấy xuôi tai, bấm gửi. Rồi trong cuộc họp, sếp hỏi ngược: "Ý em ở đoạn này cụ thể là sao?" Và bạn đứng hình, vì đó chưa bao giờ là ý của bạn.

Nguyên tắc của tôi từ đó: mọi thứ ký tên mình thì mình phải giải thích ngược lại được từng ý. AI soạn giúp bạn — nhưng người trả lời chất vấn, người chịu trách nhiệm trước chữ ký, vẫn là bạn (cùng tinh thần với chuyện kiểm chứng số liệu ở Chương 5). Chỗ nào model viết mà bạn đọc thấy "kêu nhưng mình chưa chắc hiểu", đừng xóa vội — hỏi lại nó: "giải thích đoạn này cho tôi, kèm ví dụ". Hiểu rồi hãy giữ. Đó cũng là ranh giới giữa người dùng AI để viết nhanh hơn và người bị AI viết thay cả phần hiểu — chuyện đó, Chương 9 sẽ nói tiếp.

## Điều cốt lõi

- Không phải văn bản nào cũng đáng đầu tư như nhau: việc không nhạy cảm thì brief một câu là đủ; việc nhạy cảm thì bối cảnh, điều-muốn-giữ và điều-tuyệt-đối-tránh quyết định bản nháp có gửi được không.
- Taste khó mô tả nhưng dễ đưa mẫu — vài văn bản cũ của chính bạn dạy giọng văn tốt hơn mọi tính từ.
- Văn bản dài: duyệt dàn ý trước khi cho viết, và luôn khai báo độ dài, người đọc, chỗ người đọc sẽ soi.
- Chỉnh nháp bằng cách chê cụ thể từng đoạn và nói điều bạn muốn thay cho điều bạn không muốn — "chưa hay lắm, viết lại" là cách đắt nhất để sửa một văn bản.
- Đừng gửi thứ bạn không giải thích ngược lại được: AI soạn thảo, còn chữ ký và câu trả lời khi bị hỏi ngược vẫn là của bạn.

# Chương 8 — Đừng chỉ ra một lệnh: làm việc theo vòng, theo quy trình

*Trong chương này, bạn sẽ chuyển từ tư duy "gõ một lệnh — nhận một kết quả" sang tư duy làm việc nhiều vòng: chẻ việc thành chuỗi có điểm duyệt, chê sao cho ra bản tốt hơn, và biết lúc nào một việc lặp lại đủ nhiều để đóng gói thành quy trình chạy tự động. Đây là chương nối giữa "giao một việc cho khéo" và "làm việc lâu dài với một đồng nghiệp AI".*

## Máy bán hàng tự động hay đồng nghiệp?

Người mới dùng AI thường đối xử với nó như máy bán hàng tự động: bỏ xu vào, bấm nút, nhận lon nước. Nếu lon nước không đúng ý — bực mình, đập máy, kết luận "AI cũng thường thôi". Toàn bộ kỳ vọng dồn vào một lượt gõ duy nhất: prompt phải hoàn hảo ngay từ đầu, output phải dùng được ngay lập tức.

Nhưng bạn thử nghĩ lại cách bạn làm việc với đồng nghiệp giỏi mà xem. Có bao giờ bạn giao việc bằng đúng một câu, rồi nhận về sản phẩm cuối cùng, không qua lại gì thêm? Gần như không. Việc tử tế nào cũng có brief, có bản nháp, có góp ý, có sửa, rồi mới có chốt. Nhiều vòng — đó là cách người lớn làm việc với nhau.

Với AI thế hệ mới cũng vậy. Chương 3 đã nói: nó là nhân viên xuất sắc nhưng chưa biết gì về bạn. Mà bối cảnh về bạn thì không cách nào truyền hết trong một lượt gõ — kể cả khi bạn viết brief rất kỹ. Cách truyền phần còn lại chính là những vòng qua lại: mỗi lần bạn phản hồi là một lần nó hiểu thêm về taste của bạn. Thế nên đừng đặt cược tất cả vào lệnh đầu tiên. Hãy thiết kế cả chuỗi.

## Step-by-step chủ động: chẻ việc và đặt điểm duyệt

Cách đơn giản nhất để làm việc theo vòng là đừng giao cả con voi một lúc. Việc lớn — một báo cáo quý, một kế hoạch truyền thông, một bộ tài liệu đào tạo — hãy chẻ thành chuỗi có điểm duyệt: xin dàn ý trước → bạn duyệt dàn ý → viết phần một → bạn duyệt → viết tiếp. (Chương 7 đã chạm tới mẹo giao-dàn-ý-trước cho tài liệu dài; ở đây ta nhìn nó như một nguyên tắc chung cho mọi việc lớn.)

Vì sao cách này hiệu quả đến vậy? Không phải vì model yếu nên cần bạn dắt tay — ngược lại là khác. Nó hiệu quả vì mỗi điểm duyệt là một lần bơm thêm bối cảnh với giá rẻ nhất có thể. Khi bạn nhìn dàn ý và nói "mục 3 bỏ đi, sếp tôi không quan tâm phần đó, thêm phần so sánh với quý trước", bạn vừa truyền được một mẩu bối cảnh mà không brief nào viết sẵn được — vì chính bạn cũng chỉ nhận ra điều mình muốn khi nhìn thấy điều mình không muốn. Feedback là hình thức chuyển giao bối cảnh rẻ nhất: thay vì cố mô tả trước mọi thứ, bạn để bản nháp làm câu hỏi, và chỉ trả lời đúng chỗ lệch.

Có một mẹo thực dụng đáng giá: đảo chiều giao tiếp. Kết thúc brief bằng một câu kiểu:

```text
Trước khi bắt tay làm, nếu thấy brief này còn thiếu thông tin gì
quan trọng, hãy hỏi tôi tối đa 3 câu.
```

Bình thường, bạn phải đoán xem model thiếu bối cảnh nào. Câu này mời nó tự kéo bối cảnh về phía mình — và những câu nó hỏi thường chỉ đúng chỗ bạn quên nói: cho ai đọc, deadline thế nào, số liệu lấy từ đâu. Với việc quan trọng, ba câu hỏi đó đáng giá hơn ba lần viết lại.

## Vòng lặp cải tiến: chê thế nào, và dừng lúc nào

Khi đã có bản nháp, bạn bước vào vòng lặp quen thuộc: draft → góp ý → draft mới. Chất lượng vòng lặp này nằm gần hết ở chất lượng lời chê. "Chưa hay lắm, viết lại đi" là lời chê vô dụng — nó buộc model đoán lại từ đầu, và thường đoán sai chỗ khác. Chê như bạn chê một đồng nghiệp: "đoạn hai dài quá, cắt còn một nửa; giọng đoạn kết đang trang trọng kiểu công văn, tôi cần thân mật hơn; con số ở mục ba phải ghi rõ nguồn". Chê cụ thể đến đâu, bản sau tiến bộ đến đó.

Câu hỏi khó hơn: dừng vòng lặp lúc nào? Nguyên tắc của tôi: đủ tốt cho mục đích là dừng. Email nội bộ gửi nhóm năm người không cần trau chuốt như tài liệu gửi khách hàng lớn. Hoàn hảo là cái bẫy ngọt ngào — bạn có thể ngồi tỉa một đoạn văn qua tám vòng trong khi bản ở vòng ba đã thừa sức hoàn thành nhiệm vụ của nó. Nếu bạn thấy mình đang sửa những thứ mà người nhận sẽ không bao giờ để ý, đó là dấu hiệu nên gửi đi.

Và có một dấu hiệu ngược lại, quan trọng không kém: biết lúc nào nên đập đi làm lại. Nếu qua ba, bốn vòng mà bản nháp vẫn trật hướng — bạn sửa chỗ này thì lệch chỗ kia, càng vá càng chắp — thì vấn đề thường không nằm ở bản nháp, mà nằm ở brief. Sửa mãi một bản hỏng tốn công hơn nhiều so với mở đoạn chat mới, viết lại brief tử tế với tất cả những gì bạn đã học được từ các vòng thất bại. Nghe có vẻ phí, nhưng những vòng "thất bại" đó không hề phí: chúng vừa dạy bạn chính xác điều bạn muốn. Mang bài học đó vào brief mới, thường một vòng là trúng.

## Khi việc lặp lại: đóng gói brief thành quy trình

Đến một lúc, bạn sẽ nhận ra mình đang gõ lại cùng một kiểu brief lần thứ mười: mỗi sáng thứ Hai tổng hợp tin ngành, mỗi cuối tháng làm báo cáo theo đúng một khung, mỗi lần có biên bản họp lại tóm tắt theo đúng một format. Đó là tín hiệu để chuyển từ giao-tay-từng-lần sang đóng gói quy trình. Cả hai hệ sinh thái đều có sẵn chỗ để "gửi" brief của bạn (tính đến 08/2026) — ở đây tôi chỉ điểm tên và công dụng, chi tiết từng bề mặt xin hẹn Chương 10:

Ở mức nhẹ nhất, Custom Instructions và Memory của ChatGPT cho bạn ghi sẵn những điều muốn model luôn nhớ về mình, khỏi lặp lại mỗi phiên. Lên một mức, Projects — có ở cả ChatGPT lẫn Claude — như một bàn làm việc có sẵn hồ sơ: chat, file tham chiếu và chỉ dẫn riêng gom vào một không gian theo chủ đề, vào đúng bàn là bối cảnh đã nằm sẵn đó. Phía Claude còn có Skills: bạn đóng gói một quy trình lặp lại (hướng dẫn, tài liệu mẫu kèm theo) thành thứ model tự nạp khi gặp đúng loại việc — tạo không cần biết code. Còn khi việc cần chạy theo lịch, Scheduled Tasks của ChatGPT hẹn giờ được tác vụ lặp lại; Cowork của Claude bản web/mobile có cloud tasks — việc tiếp tục chạy kể cả khi bạn gập laptop. Blog của Anthropic có một ví dụ rất đời: "Set Monday's client prep for 6 am: Claude works through the email threads, transcripts, and recent news, builds the briefing doc, and leaves the follow-up email drafted but unsent" — đặt lịch 6 giờ sáng thứ Hai, Claude tự đọc các luồng email, bản ghi họp và tin tức gần đây, dựng sẵn tài liệu chuẩn bị gặp khách, và để sẵn bản nháp email follow-up *nhưng không gửi*. Để ý cái đuôi "drafted but unsent": ranh giới "soạn nhưng không tự gửi" được cài ngay trong thiết kế — đúng thứ ta sẽ bàn ở mục dưới. Với đội nhóm dùng gói doanh nghiệp, Workspace Agents của ChatGPT cho phép cả team dựng agent dùng chung cho quy trình lặp lại.

Nhưng khoan hào hứng đóng gói mọi thứ. Nguyên tắc chọn rất đơn giản: việc lặp lại đều đặn với tiêu chí ổn định thì đáng đóng gói; việc mỗi lần mỗi khác thì giao tay từng lần vẫn nhanh hơn — vì chi phí thật của đóng gói không nằm ở lúc tạo, mà ở lúc bảo trì một quy trình đã lỗi thời so với nhu cầu của bạn. Bạn đâu viết quy trình ISO cho việc chỉ làm hai lần một năm.

## Giao việc dài cho agent: brief cần thêm ba thứ

Có một chuyển biến lớn của thế hệ 2026: model không chỉ trả lời nhanh trong vài giây nữa, mà chạy được những việc kéo dài nhiều phút, nhiều giờ. Phía ChatGPT (tính đến 08/2026), bề mặt cho loại việc này là **Work** — agent cho việc dài, nhiều bước, ra sản phẩm hoàn chỉnh như tài liệu, bảng tính, slide; chạy dạng cloud trên web/mobile cho các gói trả phí đủ điều kiện, và trong app desktop có thể thao tác cả trên file thật của máy bạn khi bạn cho phép. (Nếu bạn từng nghe tên "agent mode": OpenAI đã ngừng nó và hướng người dùng sang Work — thêm một minh chứng cho chuyện tên bề mặt đổi nhanh, tư duy thì ở lại.) Claude Cowork được thiết kế đúng cho dân văn phòng không kỹ thuật: giao việc nhiều bước, Claude làm trên thư mục và công cụ bạn đã cho phép, hiện từng bước và xin phê duyệt trước hành động hệ trọng.

Việc càng dài, brief càng phải có thêm ba thứ mà brief cho một lượt chat không cần. Thứ nhất, điểm-phải-dừng-hỏi: ranh giới rõ ràng cho những gì tuyệt đối không được tự làm — đúng tinh thần "State the boundaries" mà Anthropic khuyến nghị: định nghĩa tường minh điều model được và không được làm. "Cứ soạn draft email, nhưng không gửi bất cứ gì khi chưa hỏi tôi" là một câu đáng gõ. Thứ hai, cách báo tiến độ: bạn muốn nó báo sau mỗi phần xong, hay chỉ báo khi gặp vướng mắc? Thứ ba, tiêu chí "xong": với việc dài, "xong" mơ hồ nghĩa là agent hoặc dừng quá sớm, hoặc miệt mài đánh bóng thứ bạn không cần.

Chiều ngược lại cũng cần cân: đừng bắt nó dừng hỏi quá dày. Tài liệu của Anthropic cho Fable 5 có một câu đáng ngẫm: "When you have enough information to act, act" — khi đã đủ thông tin để làm thì cứ làm. Việc chạy dài mà cứ mười phút lại quay về hỏi bạn một câu thì thà bạn tự làm còn hơn. Đây chính là nút "quyền tự quyết" của Chương 4, vặn cho việc dài: cho phép tự quyết rộng trong vùng an toàn, và kẻ thật đậm ranh giới của vùng nguy hiểm.

## Ba nấc trưởng thành: ra lệnh, cộng tác, ủy quyền

Nhìn lại cả chương, bạn sẽ thấy ba nấc trong cách làm việc với AI. Nấc một: ra lệnh — một lượt hỏi, một lượt trả lời, xong việc. Nấc hai: cộng tác — chẻ việc, duyệt từng chặng, chê cụ thể, đi nhiều vòng đến khi đạt. Nấc ba: ủy quyền — đóng gói quy trình hoặc giao hẳn việc dài cho agent chạy, bạn chỉ xuất hiện ở các điểm phê duyệt.

Điều dễ hiểu nhầm nhất: nấc sau không thay thế nấc trước. Người làm việc giỏi với AI không phải người luôn ở nấc ba — mà là người chọn đúng nấc cho từng việc. Hỏi nhanh một khái niệm? Nấc một, một câu là đủ, bày vẽ quy trình chỉ tổ chậm. Báo cáo quan trọng gửi ban giám đốc? Nấc hai, đi từng vòng cho chắc taste. Việc sáng thứ Hai nào cũng lặp lại y hệt? Nấc ba, đóng gói rồi để nó chạy. Chọn nấc, cũng như vặn năm cái nút ở Chương 4, là thứ không ai đưa công thức thay bạn được — nhưng sau vài tuần làm thật, bạn sẽ chọn không cần nghĩ.

## Điều cốt lõi

- Đừng đặt cược vào một lệnh hoàn hảo: việc tử tế đi qua nhiều vòng — brief, nháp, feedback, chốt — như mọi cộng tác giữa người với người.
- Chẻ việc lớn thành chuỗi có điểm duyệt: mỗi lần duyệt là một lần bơm bối cảnh giá rẻ, và câu "hỏi tôi 3 câu trước khi làm" để model tự kéo bối cảnh nó thiếu.
- Chê cụ thể thì bản sau mới khá; đủ tốt cho mục đích là dừng; sửa mãi không trúng thì đập đi, brief lại từ đầu với những gì vừa học được.
- Việc lặp lại với tiêu chí ổn định thì đáng đóng gói thành quy trình (Projects, Skills, Scheduled Tasks, Cowork...); việc mỗi lần mỗi khác thì giao tay vẫn nhanh hơn.
- Brief cho việc dài cần thêm: điểm-phải-dừng-hỏi, cách báo tiến độ, và định nghĩa rõ thế nào là "xong".

# Chương 9 — AI làm gương: dùng AI để giỏi lên, không phải để lười đi

*Trong chương này, chúng ta đảo ngược mọi thứ đã làm từ đầu guide: thay vì giao việc cho AI làm rồi bạn duyệt, bạn sẽ là người làm — và AI trở thành tấm gương phản biện. Bạn sẽ thấy năm kiểu "soi gương" cụ thể, nghệ thuật xin góp ý sao cho được nghe sự thật, và ranh giới để tấm gương này giúp bạn giỏi lên thay vì lười đi.*

## Đảo vai: lần này bạn là người làm

Suốt tám chương vừa rồi, kịch bản luôn là một chiều: bạn giao, AI làm, bạn nghiệm thu. Chương này lật ngược lại. Bản báo cáo do chính tay bạn viết. Kế hoạch do chính bạn nghĩ ra. Buổi thuyết trình do bạn đứng. AI không làm hộ gì cả — nó ngồi ghế đối diện, đọc, nghe, và nói cho bạn biết những điều đồng nghiệp ngại nói.

Nghe hơi lạ, vì phản xạ tự nhiên là dùng AI theo hướng ngược lại: việc gì ngại làm thì đẩy cho máy. Không sai — cả guide này dạy cách đẩy sao cho khéo. Nhưng có một mỏ vàng ít người khai thác: chính "nhân viên xuất sắc" đó cũng là một người luyện tập lý tưởng. Nó không mệt, không phật ý, không kể lại với ai, và bạn có thể bắt nó chê mình lúc mười một giờ đêm mà không áy náy.

Lưu ý ranh giới để khỏi lẫn với Chương 6: bên đó, bạn nhờ AI review một văn bản để văn bản đó tốt lên — đối tượng là sản phẩm. Ở chương này, đối tượng là bạn. Văn bản chỉ là cái cớ; thứ bạn muốn cải thiện là năng lực viết, nghĩ, trình bày của chính mình — thứ còn lại sau khi văn bản đã gửi đi từ lâu.

## Năm kiểu soi gương

Tôi gom các cách dùng hay gặp nhất thành năm kiểu. Không phải danh mục đóng — bạn sẽ tự nghĩ ra kiểu thứ sáu hợp với nghề mình.

**Kiểu thứ nhất: xin feedback về thói quen, không chỉ về bản nháp.** Khi đưa AI một bản mình viết, đa số dừng ở "sửa giúp bản này". Câu hỏi đáng tiền hơn nằm ở tầng trên:

```text
Đây là ba email tôi viết tuần này. Ngoài lỗi của từng bản,
hãy chỉ ra 2 thói quen viết lặp đi lặp lại mà tôi nên bỏ —
kèm ví dụ trích từ chính các email này.
```

Sửa một bản nháp thì bản đó tốt lên. Chỉ ra thói quen thì mọi bản sau tốt lên. Cùng một tài liệu đầu vào, khác nhau ở chỗ bạn hỏi về sản phẩm hay hỏi về người làm ra sản phẩm.

**Kiểu thứ hai: mổ xẻ sau việc.** Đây là kiểu đáng giá nhất với người đi làm, và gần như không ai làm. Sếp sửa bản của bạn xong, phản xạ thường là thở phào rồi gửi đi. Nhưng bản trước và bản sau khi sếp sửa chính là cặp dữ liệu quý nhất bạn có về taste của sếp. Đưa cả hai cho AI:

```text
File 1 là bản tôi nộp. File 2 là bản sếp đã sửa và duyệt.
So sánh hai bản và cho tôi biết: sếp tôi đang ưu tiên điều gì
mà tôi chưa nhìn thấy? Có pattern nào trong các chỗ bị sửa không?
```

Bạn sẽ nhận về kiểu phân tích mà tự mình khó thấy — vì mình đứng quá gần bản của mình. Có thể là "các chỗ bị sửa đều là chỗ bạn nêu vấn đề mà không nêu phương án", có thể là chuyện giọng điệu. Làm vài lần, bạn học được thứ bình thường phải mất vài năm bị sửa bài mới ngấm.

**Kiểu thứ ba: học chủ động một chủ đề.** Cách học lười là bảo AI "giải thích X cho tôi" rồi đọc lướt và tưởng mình đã hiểu. Cách học chăm là bắt nó đổi chiều:

```text
Tôi vừa đọc xong tài liệu về chuẩn mực kế toán mới này.
Đừng giải thích gì thêm. Hãy hỏi tôi 5 câu để kiểm tra xem
tôi thực sự hiểu chưa — bắt đầu từ câu dễ, khó dần.
Chỗ nào tôi trả lời sai hoặc lơ mơ thì mới giảng lại chỗ đó.
```

Điểm hay không nằm ở chỗ AI giảng giỏi — mà ở chỗ khi phải trả lời, lỗ hổng của bạn lộ ra. Chiều ngược lại cũng hay: "Tôi giải thích lại theo cách tôi hiểu, bạn nghe và chỉ ra chỗ tôi hiểu sai." Phải nói được thì mới là hiểu; AI là người nghe kiên nhẫn vô hạn cho bài tập đó.

**Kiểu thứ tư: tập dượt tình huống.** Tuần sau bạn có buổi đề xuất tăng lương, hoặc phải trình bày trước một khách hàng nổi tiếng khó. Thay vì diễn tập trong đầu — nơi đối phương luôn hiền lành một cách phi thực tế — hãy dựng buồng tập:

```text
Tôi sắp nói chuyện đề xuất tăng lương với sếp. Bối cảnh: [X].
Hãy đóng vai sếp tôi — một người tiết kiệm lời khen, hay hỏi
"số liệu đâu", và có thói quen lái sang chuyện ngân sách khó khăn.
Đừng nương tay. Sau mỗi lượt, đừng nhận xét gì — cứ ở trong vai.
Khi nào tôi gõ "hết vai" thì mới tổng kết tôi nói tốt chỗ nào, hớ chỗ nào.
```

Nhớ lại Chương 2: đóng vai không làm model thông minh hơn, nhưng đổi góc nhìn thì nó vẫn là công cụ tốt — và buồng tập chính là chỗ dùng đúng. Cái bạn luyện không phải kịch bản thuộc lòng, mà là phản xạ khi bị hỏi xoáy.

**Kiểu thứ năm: soi điểm mù trước khi quyết.** Trước một quyết định có sức nặng — chọn nhà cung cấp, đổi hướng dự án — bạn thường đã nghiêng về một phía và đi tìm lý do ủng hộ. Hãy thuê AI làm phía bên kia:

```text
Tôi đang định quyết X, vì lý do Y và Z.
Nhiệm vụ của bạn không phải là đồng ý hay đưa thêm lý do ủng hộ.
Hãy tấn công lập luận này: giả định nào của tôi mỏng manh nhất?
Kịch bản nào khiến quyết định này sai? Tôi đang không nhìn thấy gì?
```

Đôi khi nó tấn công trúng, bạn kịp vá. Đôi khi nó tấn công trượt — và lập luận đứng vững qua trận đòn đó làm bạn tự tin hơn hẳn trước người thật. Đằng nào bạn cũng lời.

## Nghệ thuật xin góp ý — muốn nghe thật thì phải nói rõ

Cả năm kiểu trên có chung một điểm chết: model có xu hướng lịch sự. Bạn đưa bản viết của mình và hỏi "thấy sao?", gần như chắc chắn bạn sẽ nhận về lời khen kèm vài góp ý nhẹ nhàng đến mức vô hại. Không phải nó nịnh bạn — nó chỉ đang trả lời một câu hỏi mơ hồ theo cách an toàn nhất, hệt như đồng nghiệp mới vào công ty được hỏi "em thấy anh trình bày ổn không".

Muốn nghe thật, phải xin thật — và các nguyên tắc từ Chương 4 với Chương 6 áp dụng nguyên xi, chỉ đổi đối tượng. Thứ nhất, nói rõ mình muốn bị chê, và nói vì sao. Đây chính là nguyên tắc "giải thích lý do" mà Anthropic nêu trong hướng dẫn prompt chính chủ (tính đến 08/2026): cho model biết động cơ đằng sau yêu cầu — "explaining to Claude why such behavior is important" (giải thích vì sao hành vi đó quan trọng) — giúp nó hiểu đúng mục tiêu và trả lời trúng hơn. So sánh hai cách hỏi cho cùng một bản nháp: "góp ý giúp bản này" sẽ ra nhận xét tròn trịa; còn "tôi đang luyện viết để năm sau lên vị trí phải viết cho ban giám đốc — tôi cần biết điểm yếu thật, khen không giúp gì tôi lúc này" sẽ ra một cuộc nói chuyện khác hẳn. Không phải cách đầu sai — nếu bạn chỉ cần yên tâm nhanh trước khi gửi, nó đủ dùng. Nhưng cho mục tiêu giỏi lên, bạn cần cách sau.

Thứ hai, hỏi câu hẹp. "Nhận xét đi" là mời model trải một băng chuyền nhận xét đều đều mọi mặt. "Hai điểm yếu nhất của lập luận này là gì?" buộc nó xếp hạng — và xếp hạng mới là thông tin. Bạn có thể vặn tiếp: "trong các góp ý vừa rồi, cái nào đáng công sửa nhất, cái nào chỉ là gãi ngứa?"

Thứ ba, cảnh giác với lời khen. Khen mặc định của model là phép lịch sự, không phải chứng nhận chất lượng. Lời khen đáng tin là lời khen cụ thể sống sót sau khi bạn đã yêu cầu chê hết cỡ. Nếu bạn dặn "đừng khen, chỉ chê" mà nó vẫn khăng khăng đoạn mở đầu của bạn tốt và chỉ ra được vì sao tốt — cái đó mới đáng ghi nhận.

## Ranh giới lành mạnh: gương, không phải người quyết

Đến đây cần nói thẳng vài điều, vì chương này dễ bị hiểu quá đà.

AI là tấm gương và là buồng tập — không phải người quyết. Nó giúp bạn nhìn rõ lập luận của mình, nhưng quyết vẫn là bạn, chịu trách nhiệm cũng là bạn. Tấm gương tốt cho bạn thấy vết nhọ trên mặt; nó không rửa mặt thay bạn được, càng không chọn thay bạn hôm nay nên đi đâu.

Với lĩnh vực chuyên sâu của chính bạn, hãy giữ tỉnh táo đặc biệt: những gì AI nói về nghề của bạn vẫn cần kiểm chứng, vì trong căn phòng đó bạn mới là chuyên gia có trách nhiệm. Nghe nó phản biện để soi lỗ hổng thì rất tốt; coi nó là trọng tài chân lý về nghiệp vụ của mình thì không. Nếu nó nói điều gì về chuyên môn mà bạn thấy sai — nhiều khả năng bạn đúng, và chính khoảnh khắc "khoan, sai rồi" đó cũng là một bài tập: bạn vừa buộc phải gọi tên được vì sao sai.

Và điều cuối, quan trọng nhất: đừng outsource phần "hiểu". Có một ranh giới mảnh nhưng có thật giữa "AI giúp tôi hiểu nhanh hơn" và "AI hiểu hộ tôi rồi, tôi khỏi cần hiểu". Người thứ nhất dùng AI như dùng thang máy — vẫn đến đúng tầng đó, chỉ nhanh hơn leo bộ. Người thứ hai đứng dưới sảnh nhờ người khác lên tầng giúp. Phép thử đơn giản: sau khi làm việc với AI về một chủ đề, thử giải thích lại chủ đề đó cho một người — không mở chat. Nói trôi chảy nghĩa là bạn dùng gương đúng cách. Ấp úng nghĩa là bạn mới mượn được cái hiểu của máy, chưa đổi thành cái hiểu của mình — và cái hiểu đi mượn thì không mang vào phòng họp được.

Dùng đúng cách, nghịch lý dễ chịu sẽ xuất hiện: càng làm việc nhiều với "nhân viên xuất sắc" này, bạn càng giỏi lên — vì mỗi lần soi gương là một lần bạn buộc phải nhìn rõ chính mình. Đó là kết cục ngược hẳn với nỗi sợ "dùng AI nhiều sẽ lười đi", và nó không tự đến: nó đến với người chủ động cầm gương soi, thay vì đưa mặt cho gương ngắm hộ.

## Điều cốt lõi

- Chương này đảo vai: bạn làm, AI phản biện — đối tượng cần cải thiện là năng lực của bạn, không phải một văn bản cụ thể (việc đó thuộc Chương 6).
- Năm kiểu soi gương đáng thử: xin feedback về thói quen, mổ xẻ sau việc với cặp bản trước–sau, học chủ động bằng cách bắt AI hỏi ngược, tập dượt tình huống khó, và thuê AI tấn công lập luận trước khi quyết.
- Model có xu hướng lịch sự: muốn nghe thật phải nói rõ mình muốn bị chê và vì sao, hỏi câu hẹp buộc xếp hạng, và coi lời khen mặc định là phép lịch sự chứ không phải chứng nhận.
- Cặp "bản tôi nộp — bản sếp đã sửa" là dữ liệu quý nhất bạn có về taste của người duyệt; đưa cho AI phân tích pattern là cách học nhanh thứ vốn phải mất nhiều năm mới ngấm.
- AI là gương và buồng tập, không phải người quyết: kiến thức về nghề của bạn vẫn phải tự kiểm, và hãy dùng AI để hiểu nhanh hơn — đừng dùng để khỏi hiểu.

## Nguồn trong chương

- [Anthropic — Claude prompting best practices (nguyên tắc giải thích lý do đằng sau yêu cầu)](https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices) — truy cập 08/2026

Chương này phần lớn là nội dung tư duy/thực hành, không chứa thêm claim sản phẩm cần nguồn.

# Chương 10 — Nâng cao: cùng một tư duy, nhiều bề mặt làm việc

*Trong chương này, bạn sẽ đi một vòng qua các "bề mặt" làm việc của hai hệ sinh thái ChatGPT và Claude — từ khung chat quen thuộc đến những công cụ chạy việc khi bạn đã tắt máy đi ngủ. Điều bạn sẽ nhận ra: tư duy giao việc bạn học suốt chín chương qua không đổi một ly nào — thứ đổi là AI với tay được tới đâu, và với tay càng xa thì brief của bạn càng đáng giá.*

## Một tư duy, nhiều cánh tay

Suốt guide này, ta nói chuyện với AI chủ yếu qua một khung chat: bạn gõ, nó trả lời. Nhưng đến 08/2026, khung chat chỉ còn là bề mặt cơ bản nhất trong một dải bề mặt ngày càng dài. Hãy hình dung dải đó như mức độ "với tay" của người nhân viên xuất sắc kia: lúc đầu họ chỉ nghe bạn kể rồi viết lại; rồi họ được đọc file của bạn; rồi được tự lên web tra cứu; rồi được ngồi hẳn vào máy bạn, mở thư mục, sửa tài liệu; và cuối cùng — làm việc cả khi bạn vắng mặt.

Điều quan trọng nhất của chương này nằm ở một câu: **khi cánh tay AI vươn xa hơn, thứ bạn cần nâng cấp không phải là mẹo mới, mà vẫn là bối cảnh, tiêu chí nghiệm thu và ranh giới** — đúng những cái nút bạn đã học ở Chương 4, đặc biệt là nút "quyền tự quyết" (N5), và đúng cách làm việc theo vòng ở Chương 8. Một câu lệnh cẩu thả trong khung chat chỉ tốn của bạn một lần gõ lại. Cùng câu lệnh cẩu thả đó giao cho một agent (chương trình AI tự làm nhiều bước liên tiếp thay bạn) đang cầm quyền sửa file thật thì cái giá khác hẳn.

Vậy nên hãy đọc chương này như đọc sơ đồ tòa nhà, không phải sách hướng dẫn vận hành từng phòng. Mục tiêu là bạn biết mỗi bề mặt tồn tại, nó cho AI với tay tới đâu, và việc nào của bạn thì nên mang tới cửa nào.

## Phía ChatGPT: từ khung chat đến "bàn làm việc"

Bắt đầu từ những thứ nằm ngay trong ChatGPT trên web mà nhiều người dùng hằng ngày vẫn chưa động tới. **Projects** (tính đến 08/2026) cho bạn gom chat, file tham chiếu và custom instructions vào một không gian riêng theo từng mảng việc, kèm project-only memory — trí nhớ chỉ rút bối cảnh từ các cuộc trò chuyện trong cùng project. Nói theo ngôn ngữ của guide này: Projects là cách bạn trả trước tiền bối cảnh một lần, thay vì kể lại lý lịch công ty ở mỗi chat mới. **Memory** và **Custom Instructions** cũng phục vụ đúng mục tiêu đó ở tầng cá nhân: một bên tự động nhớ dần bối cảnh hữu ích từ chat, file và app bạn đã kết nối (kèm một bản memory summary bạn xem và sửa được), một bên là chỉ dẫn nền bạn tự viết, có ở mọi gói.

Với việc viết lách và sửa qua sửa lại, ChatGPT nay hỗ trợ các **khối soạn thảo ngay trong chat** (writing blocks / code blocks) — văn bản đứng thành khối riêng để cùng đẽo gọt qua các lượt, đúng kiểu "đồng-soạn-thảo" đã nói ở Chương 7. (Cửa sổ Canvas trước đây đã được gỡ khỏi các model hiện hành từ 28/05/2026 — chức năng chuyển vào thẳng trong chat.) Với việc thông tin, **Deep Research** tạo báo cáo có trích nguồn từ một kế hoạch research mà bạn duyệt được trước khi nó chạy sâu (xem Chương 5). Với việc lặp theo lịch, **Scheduled Tasks** cho hẹn giờ chạy một lần, chạy lặp lại, hoặc theo dõi và báo khi có thay đổi.

Nấc "với tay xa" đầu tiên nay mang tên **Work** — và chính cái tên là một bài học sống về tốc độ đổi thay: chế độ "agent mode" ra mắt trước đó đã được OpenAI ngừng và thay thế, với thông báo chính chủ ngắn gọn: "ChatGPT agent is no longer available. Use ChatGPT Work for longer, multi-step tasks and finished deliverables" — agent mode không còn, hãy dùng Work cho việc dài, nhiều bước, ra sản phẩm hoàn chỉnh. Work chạy dạng cloud trên web và mobile cho các gói trả phí đủ điều kiện (việc tiếp tục chạy trên máy chủ, đồng bộ giữa thiết bị), còn các luồng duyệt web kiểu agent thì đi qua cloud browser trong ChatGPT. Cùng họ với nó là các **app/connector** — nối ChatGPT vào Google Drive, SharePoint, Outlook, Gmail, Teams, GitHub... để nó đọc thẳng dữ liệu công việc của bạn thay vì chờ bạn dán từng đoạn.

Và từ 09/07/2026, phía OpenAI có một bước gom lớn: **app desktop hợp nhất** trên macOS và Windows với ba bề mặt — **Chat**, **Work** và **Codex**. Chính chủ mô tả: "Work is an agent designed for longer, multi-step work and finished deliverables" — Work là agent cho việc dài hơi, nhiều bước, ra sản phẩm hoàn chỉnh như tài liệu, bảng tính, slide, báo cáo; còn Codex dành cho lập trình. App desktop có thêm companion window gọi nhanh bằng Alt+Space (Windows) hoặc Option+Space (macOS). Một chi tiết thời sự đáng biết: trình duyệt Atlas của OpenAI bị khai tử — "Atlas is scheduled to stop working on August 9, 2026" (Atlas dự kiến ngừng hoạt động ngày 09/08/2026) — năng lực duyệt web kiểu agent được chuyển vào built-in browser ngay trong ChatGPT. Cuối cùng, cho quy mô team, **Workspace Agents** (gói Business/Enterprise) cho phép cả nhóm tự dựng agent dùng chung cho quy trình lặp lại — chạy trong ChatGPT và Slack, chạy theo lịch, kích hoạt qua API.

## Phía Claude: từ claude.ai đến Cowork

Trên **claude.ai** (tính đến 08/2026), bộ đồ nghề song song khá dễ nhận ra nếu bạn đã quen bên kia: **Projects** giữ bối cảnh bền theo chủ đề, **Artifacts** tạo sản phẩm xem và chia sẻ được ngay cạnh chat, memory (nhập được cả memory từ AI provider khác), upload file PDF/Word/Excel/ảnh, **Research mode** tìm kiếm web lẫn Google Workspace rồi trả về báo cáo tương tác, và Connectors. Claude cũng có app desktop cho macOS và Windows, cùng bản mobile — và chính app desktop này là chỗ Cowork (mục dưới) ngồi làm việc trên thư mục thật của bạn.

Riêng **Skills** đáng dừng lại một nhịp: đó là những thư mục chứa hướng dẫn, script và tài nguyên mà Claude tự nạp khi gặp đúng loại việc — tạo không cần biết code, có từ gói Free. Nếu Chương 8 nói về việc "đóng gói brief thành quy trình", thì Skills chính là một hộp đóng gói: bạn viết một lần cách công ty mình làm báo cáo tuần, những lần sau Claude tự lấy ra dùng.

Nhưng mục đáng kể nhất cho độc giả guide này là **Claude Cowork** — sản phẩm giao-việc-agentic mà Anthropic làm riêng cho dân văn phòng không kỹ thuật: marketing, sales, legal, finance. Bạn giao một việc nhiều bước, Claude làm trên thư mục và các tool bạn đã cho phép, hiện từng bước nó đang làm, và xin phê duyệt trước hành động hệ trọng. Bản beta của Cowork trên web, iOS và Android được công bố 07/07/2026 — triển khai dần trong vài tuần, bắt đầu từ người dùng gói Max — mang tới cloud tasks: việc tiếp tục chạy khi bạn gập laptop, task hẹn giờ chạy không cần thiết bị online, cần quyết định thì đẩy về điện thoại bạn. Ví dụ chính chủ từ blog Anthropic nghe rất "đời văn phòng": "Set Monday's client prep for 6 am: Claude works through the email threads, transcripts, and recent news, builds the briefing doc…" — hẹn 6 giờ sáng thứ Hai, Claude tự đọc các luồng email, biên bản, tin tức gần đây rồi dựng sẵn tài liệu chuẩn bị gặp khách (câu gốc còn một cái đuôi thú vị: nó soạn sẵn email follow-up *nhưng không gửi* — xem Chương 8). Và để bạn khỏi nghĩ đây là đồ của dân lập trình: Anthropic công bố hơn 90% usage của Cowork không phải là code, khoảng một nửa là vận hành doanh nghiệp và sáng tạo nội dung.

Còn **Claude Code** thì sao — cái tên nghe "kỹ thuật" nhất? Bạn chỉ cần biết-nó-là-gì: một agent lập trình chạy trên terminal, desktop, web, trong VS Code/JetBrains, cả mobile và Slack. Nó mạnh ở những việc dính đến file hàng loạt, dữ liệu, thao tác lặp trên máy — kiểu việc mà dân văn phòng thỉnh thoảng cũng đụng phải ("đổi tên 400 file theo quy tắc", "gộp 30 file số liệu"). Guide này không dạy dùng nó; chỉ dặn bạn: khi gặp việc dạng đó, biết rằng công cụ này tồn tại để nhờ đồng nghiệp kỹ thuật, hoặc tự thử nếu tò mò.

## Chọn bề mặt theo việc

Đừng học thuộc danh sách trên. Hãy xuất phát từ việc của bạn rồi hỏi: việc này cần AI với tay tới đâu? Bảng dưới là gợi ý khởi điểm — không phải luật:

| Việc của bạn | Phía ChatGPT | Phía Claude |
|---|---|---|
| Hỏi đáp, nháp nhanh, việc một lần | Chat thường | Chat thường |
| Một mảng việc lặp lại, cần bối cảnh bền | Projects + Custom Instructions | Projects |
| Viết và sửa qua lại một văn bản | Khối soạn thảo trong chat | Artifacts |
| Research sâu có nguồn | Deep Research | Research mode |
| Quy trình lặp muốn đóng gói | Scheduled Tasks, Workspace Agents (team) | Skills, Cowork cloud tasks |
| Việc nhiều bước trên web / trên file thật | Work | Cowork |
| Việc dính file hàng loạt, dữ liệu, máy móc | Codex | Claude Code |

Hai điều cần nói thêm về bảng này. Thứ nhất, ranh giới giữa các ô mềm hơn vẻ ngoài — Research mode nằm ngay trong chat, Cowork cũng nhận việc soạn thảo. Thứ hai, cột "việc của bạn" mới là cột quan trọng: nếu bạn chưa gọi tên được việc mình cần (mục đích, người nhận, tiêu chí đạt — xem Chương 3), thì đứng trước bề mặt nào bạn cũng sẽ lúng túng y như nhau. Bề mặt xịn không cứu được brief rỗng.

## Với tay càng xa, phê duyệt càng quý

Một điểm chung thú vị: cả hai hãng đều thiết kế các bề mặt agentic quanh chuyện **xin phép và giữ quyền kiểm soát cho bạn**. Cowork hiện từng bước và xin phê duyệt trước khi làm điều quan trọng; Work trong app desktop chỉ đụng vào file và app trên máy khi bạn cho phép ("with your permission" — nguyên văn tài liệu OpenAI); Deep Research để bạn duyệt và sửa kế hoạch trước khi chạy, "all while keeping you in control". Đó không phải thủ tục phiền hà mà hãng gắn vào cho có — đó chính là điểm chạm cuối cùng giữa tư duy giao việc của bạn và hành động thật của máy.

Hãy đối xử với màn hình phê duyệt như khi nhân viên mới hỏi "em gửi mail này cho khách luôn nhé anh/chị?". Bạn sẽ không gật đầu mà không liếc qua nội dung. Với AI cũng vậy: đọc nó định làm gì trước khi cho phép, và đừng để thói quen "bấm cho qua" hình thành — vì thói quen đó sẽ theo bạn sang những việc mà hậu quả không còn là một email vụng về. Ngược lại, đây cũng là chỗ nút N5 của Chương 4 phát huy: với việc bạn đã tin tay, hãy nói trước ranh giới ("cứ làm tới, chỉ dừng hỏi tôi khi động đến số liệu gốc") để không phải phê duyệt vụn vặt từng bước.

Và một lời trấn an để khép chương: danh sách bề mặt này chắc chắn sẽ lại đổi — tên gọi, nút bấm, cách gom app là thứ thay nhanh nhất trong ngành này. Nhưng bạn để ý mà xem: mọi bề mặt ở trên, từ Projects đến Cowork, thực chất chỉ là những cách khác nhau để làm đúng ba việc bạn đã học — chuyển giao bối cảnh, đặt tiêu chí nghiệm thu, vạch ranh giới tự quyết. Học ba việc đó, bạn không sợ bất kỳ bề mặt mới nào.

## Điều cốt lõi

- Tư duy giao việc không đổi qua các bề mặt — thứ đổi là AI với tay được tới đâu, và với tay càng xa thì bối cảnh, tiêu chí, ranh giới càng quan trọng.
- Projects, Memory, Custom Instructions hay Skills đều là các cách "trả trước tiền bối cảnh" để khỏi kể lại từ đầu ở mỗi lần giao việc.
- Cowork và Work đưa AI từ trả-lời sang làm-thật trên file và web của bạn, với cơ chế hiện từng bước, xin phê duyệt và chỉ chạm vào máy bạn khi được phép.
- Chọn bề mặt bằng cách xuất phát từ việc của mình, không phải từ danh sách tính năng — bề mặt xịn không cứu được brief rỗng.
- Màn hình phê duyệt là tính năng, không phải thủ tục: đọc AI định làm gì trước khi cho phép, đừng bấm cho qua.

# Phụ lục A — Giáo án buổi giảng ~4,5 tiếng

*Trong phụ lục này, bạn nhận được một giáo án dùng-được-ngay để đem guide này đi dạy: ba nguyên tắc đứng lớp, khung sáu khối có phân bổ phút rõ ràng, và với mỗi khối — mục tiêu, demo gợi ý, bài tập, cùng những cái bẫy mà người giảng nào cũng sẽ giẫm phải ít nhất một lần. Cuối phụ lục có bản rút gọn 90 phút cho hội thảo ngắn.*

## Ba nguyên tắc dạy — đọc trước khi cầm giáo án

Giáo án này đứng được là nhờ ba nguyên tắc. Bỏ một trong ba, buổi giảng sẽ trượt về kiểu "thuyết trình slide về AI" — thứ mà học viên nghe xong gật gù rồi về làm y như cũ.

**Một: demo sống trước, lý thuyết sau.** Đây là lý do các chương thực chiến (5–7) đều mở bằng một «Thí nghiệm mở màn» — chúng được viết ra để bạn *chạy*, không phải để đọc. Người lớn không đổi thói quen vì nghe một nguyên lý; họ đổi khi tận mắt thấy hai cách giao cùng một việc ra hai output khác hẳn nhau, ngay trên màn chiếu, không cắt ghép. Nguyên lý chỉ nên xuất hiện *sau* khoảnh khắc "ơ, lạ nhỉ" đó — lúc ấy nó mới có chỗ để bám vào.

**Hai: để học viên ĐOÁN trước khi xem output.** Trước mỗi lần bấm gửi, dừng lại hỏi cả lớp: "Bạn đoán bản này sẽ khác bản kia chỗ nào?" Bắt họ nói ra, thậm chí viết ra. Một dự đoán đã cam kết mà sai sẽ dạy được nhiều hơn mười slide đúng — vì lúc đó học viên đang so output với *mô hình trong đầu của chính họ*, không phải với lời thầy.

**Ba: bài tập trên việc THẬT của học viên.** Dặn trước buổi học: mỗi người mang theo một việc đang dang dở — một draft đang viết, một chủ đề cần tìm hiểu, vài email cũ của chính mình. Bài tập trên tình huống bịa thì học viên làm cho xong; bài tập trên việc họ đang bị deadline dí thì họ làm thật — và cái "taste" mà guide này nói mãi chỉ lộ ra trên việc thật.

Thêm một lưu ý trung thực, cũng là lời dặn xuyên suốt guide: các "output minh họa" trong sách là mô tả pattern, không phải log thật. Khi bạn chạy sống, kết quả sẽ ra khác — mỗi lần chạy mỗi khác. Đừng coi đó là rủi ro; đó là chất liệu giảng. Hãy chạy thử ở nhà để nắm nhịp, nhưng lên lớp cứ chạy thật và phân tích cái ra thật.

## Hậu cần trước buổi giảng — kiểm một lượt, đỡ vấp cả buổi

Giáo án này đứng trên demo sống, nên hậu cần đáng một lượt kiểm riêng, tốt nhất trước buổi giảng vài ngày:

- **Tài khoản của bạn.** Chạy thử toàn bộ demo dự kiến trên *đúng tài khoản sẽ dùng trên lớp*. Nhiều tính năng demo phụ thuộc gói (tính đến 08/2026): bề mặt Work của ChatGPT có trên web/mobile cho các gói trả phí đủ điều kiện, và các mức suy nghĩ GPT-5.6 không có ở gói Free/Go. Màn hình học viên thấy có thể khác màn hình của bạn nếu khác gói — nói trước điều đó một câu là đủ, đỡ mất năm phút giải thích giữa demo.
- **Tài khoản của học viên.** Khối 3 cần học viên tự chạy: dặn ngay trong thư mời — mang laptop, tài khoản ChatGPT hoặc Claude đã đăng nhập sẵn. Gói miễn phí của cả hai hệ vẫn chạy trọn các thí nghiệm chat cơ bản của Khối 3; người đến tay không thì sẽ thành khán giả cả buổi.
- **Dữ liệu demo.** Đừng chiếu tài liệu thật nhạy cảm của công ty lên màn hình lớp. Chuẩn bị sẵn một bộ "hồ sơ sạch": vài email mẫu, một bản draft, một biên bản họp đã thay tên đổi số. Và làm rõ với học viên: "mang việc thật" nghĩa là mang *loại việc* đang dang dở, không nhất thiết mang dữ liệu mật — chuyện đưa dữ liệu công ty lên AI, trỏ về FAQ ở Phụ lục B để họ tự cân nhắc theo chính sách nội bộ.

## Khung buổi giảng và cách ước lượng thời gian

| Khối | Nội dung | Dựa trên | Thời lượng |
|---|---|---|---|
| 1 | Vỡ tư duy | Chương 1 + 2 + 3 | 50' |
| 2 | Nghệ thuật liều lượng | Chương 4 | 40' |
| — | *Nghỉ* | | 15' |
| 3 | Thực chiến ba mảng | Chương 5 + 6 + 7 | 65' |
| 4 | Vòng lặp & quy trình | Chương 8 | 40' |
| — | *Nghỉ* | | 10' |
| 5 | AI làm gương + bề mặt nâng cao | Chương 9 + 10 | 35' |
| 6 | Q&A + cam kết hành động | Phụ lục B | 15' |

Cách ước lượng rất thô sơ và cố ý thô sơ: cộng dồn phút từng khối như liệt kê. Tổng giảng 50 + 40 + 65 + 40 + 35 + 15 = 245 phút ≈ 4 giờ 05; cộng 25 phút nghỉ ra khoảng 4 giờ 30 — lọt dưới khung 5 tiếng, có chừa đệm cho khởi động đầu giờ và những câu hỏi không mời mà đến. Đây là bản *thiết kế*, không phải thời khóa biểu nhà binh: lớp sôi nổi thì Khối 3 sẽ ăn lẹm sang chỗ khác, và nơi nên hy sinh trước là Khối 5 — vì Khối 3 mới là nơi học viên đổi thói quen.

## Chi tiết sáu khối

### Khối 1 (50') — Vỡ tư duy

**Mục tiêu một câu:** học viên tin — bằng mắt, không phải bằng lời — rằng máy đã đổi thế hệ, và cách giao việc của họ có thể vẫn đang ở thế hệ cũ.

**Demo gợi ý:** mở màn buổi học bằng một demo tương phản sống, *trước cả khi giới thiệu chương trình*. Lấy một việc văn phòng quen thuộc (một email khó viết, một đoạn tổng hợp) và giao hai cách: một bản theo đúng thói quen 2023–2024 — đóng vai chuyên gia, viết hoa nhấn mạnh, "hãy suy nghĩ từng bước"; một bản theo kiểu chương 3 — kể bối cảnh, nói rõ ai đọc, "đạt" nghĩa là gì. Cho lớp đoán trước khi xem. Rồi mới lần ngược: vì sao từng mẹo cũ ra đời (Chương 2), và mental model "nhân viên xuất sắc chưa biết gì về bạn" (Chương 3). Phần bức tranh model 2026 (Chương 1) chỉ cần mươi phút kể chuyện — đủ để học viên biết mình đang nói chuyện với ai.

**Bài tập:** golden rule của Chương 3, chạy tại chỗ. Mỗi học viên lấy một prompt mình hay dùng, đưa người ngồi cạnh đọc, và người đó nói lại xem họ hiểu việc cần làm là gì. Ba phút, cười rất nhiều, và những lỗ hổng bối cảnh tự lộ ra mà bạn không phải giảng câu nào.

**Bẫy thường gặp:** thứ nhất, sa đà vào chuyện tên model, giá, mốc ngày — hấp dẫn nhưng ngốn giờ và không đổi hành vi ai. Thứ hai, demo "thất bại": cả hai cách giao đều ra output ổn. Đừng chữa ngượng — nói thật với lớp rằng model mới chịu được prompt lôi thôi giỏi hơn xưa, và chính vì thế khác biệt sẽ hiện rõ nhất ở việc *khó và nhạy cảm*, thứ ta sẽ gặp ở Khối 3. Trung thực lúc này mua được lòng tin cho cả buổi.

### Khối 2 (40') — Nghệ thuật liều lượng

**Mục tiêu một câu:** học viên nắm được 5 cái nút của Chương 4 và hiểu vì sao không ai đưa được vạch chuẩn cho họ.

**Hoạt động "chỉnh nút":** một tình huống duy nhất cho cả lớp, chia nhóm, mỗi nhóm vặn một nút khác nhau — nhóm này bơm thêm bối cảnh, nhóm kia thêm ranh giới cấm, nhóm nọ nới quyền tự quyết. Chạy, dán các output cạnh nhau, và để lớp tự gắn từng khác biệt vào từng nút. Người giảng chỉ cần điều phối và gọi tên nút.

**Bẫy thường gặp:** giảng 5 nút như một bài lý thuyết có đánh số — nghe rất gọn, quên rất nhanh. Và câu hỏi chắc chắn có: "Vậy rốt cuộc bao nhiêu bối cảnh là đủ?" Đừng trả lời bằng con số; trả lời bằng *dấu-hiệu-lệch* như Chương 4 dạy — output cho thấy gì thì vặn lại. Đó không phải né tránh; đó chính là nội dung bài.

*Nghỉ 15 phút. Đừng cắt — buổi học này bắt học viên động não nhiều hơn họ tưởng.*

### Khối 3 (65') — Thực chiến ba mảng

**Mục tiêu một câu:** học viên tự tay chạy được ba loại việc phổ biến nhất — research, review, soạn thảo — trên đúng việc của mình.

**Demo gợi ý:** mỗi mảng khoảng 20 phút, theo cùng một nhịp: chạy thí nghiệm mở màn của chương tương ứng (Chương 5 cho research, Chương 6 cho review, Chương 7 cho soạn thảo), cho lớp đoán trước khi xem, phân tích nhanh — rồi dành phần lớn thời gian còn lại cho học viên chạy trên việc thật họ mang theo. Người giảng đi vòng quanh lớp; những cuộc trao đổi một-kèm-một lúc này đáng giá hơn mọi phần thuyết trình.

**Bài tập:** mỗi người chọn *một* việc thật đang cần làm tuần này và giao nó ít nhất hai cách khác nhau, rồi tự trả lời: bản nào hợp nhu cầu của mình hơn, và vì sao.

**Bẫy thường gặp:** ôm đồm. Mỗi thí nghiệm trong sách có 3 cách giao; chạy sống đủ cả ba cho cả ba mảng là cháy giờ chắc chắn — chọn hai cách tương phản nhất mỗi mảng là đủ. Bẫy thứ hai: học viên ngồi xem thầy biểu diễn mà không mở máy. Phải ép — khoảnh khắc "à" của buổi này xảy ra trên màn hình của họ, không phải trên màn chiếu của bạn.

### Khối 4 (40') — Vòng lặp & quy trình

**Mục tiêu một câu:** học viên rời tư duy "một lệnh ăn ngay" và thấy tận mắt vì sao làm việc nhiều vòng lại rẻ hơn.

**Demo gợi ý:** chạy sống một chuỗi step-by-step thật của Chương 8, trên một việc do lớp chọn: xin dàn ý → lớp duyệt và chê → viết một phần → chê cụ thể → sửa. Dừng lại ở đúng khoảnh khắc quan trọng nhất để chỉ cho lớp thấy: mỗi lần duyệt là một lần bơm thêm bối cảnh — feedback là cách chuyển giao bối cảnh rẻ nhất. Kết thúc demo bằng mẹo "trước khi làm, hỏi tôi 3 câu nếu thấy brief chưa đủ" và để lớp xem model hỏi gì.

**Bẫy thường gặp:** lún vào phần automation. Chương 8 có cả một họ công cụ đóng gói quy trình; trên lớp chỉ nên nhắc tên và một câu công dụng, rồi trỏ học viên về đọc Chương 8 và Chương 10. Demo cài đặt chi tiết một công cụ nào đó là cách nhanh nhất để mất nửa lớp không dùng công cụ ấy.

*Nghỉ 10 phút.*

### Khối 5 (35') — AI làm gương + bề mặt nâng cao

**Mục tiêu một câu:** mở hai cánh cửa để học viên tự đi tiếp — dùng AI nâng năng lực chính mình, và biết bản đồ các bề mặt làm việc rộng hơn khung chat.

**Demo gợi ý:** cho Chương 9, demo dũng cảm nhất cũng là demo hiệu quả nhất: đưa một bản *do chính bạn — người giảng — viết* cho AI phản biện, với lời xin góp ý đúng kiểu Chương 9, và nhận chê trước mặt cả lớp. Bạn đang làm mẫu chính cái tư thế mà chương đó dạy. Cho Chương 10, *nếu lớp phù hợp* — tức đã vững phần chat cơ bản — demo ngắn một bề mặt agentic: Claude Cowork (tính đến 08/2026) — sản phẩm giao-việc-agentic của Anthropic cho dân văn phòng không kỹ thuật, làm việc nhiều bước trên thư mục được cấp quyền, hiện từng bước và xin phê duyệt trước hành động hệ trọng — hoặc ChatGPT Work (tính đến 08/2026), agent cho việc dài nhiều bước ra sản phẩm hoàn chỉnh, chạy dạng cloud trên web/mobile cho các gói trả phí đủ điều kiện. Điểm cần chiếu sáng trong demo không phải "nó làm được gì" mà là *bước phê duyệt*: bề mặt càng agentic, việc xem-nó-định-làm-gì trước khi gật đầu càng là kỹ năng.

**Bẫy thường gặp:** lớp lệch trình độ — nửa lớp háo hức xem agent, nửa còn loay hoay với chat. Giải pháp: demo thật ngắn, đóng bằng đúng một câu của Chương 10 — "tư duy giao việc không đổi qua các bề mặt, thứ đổi là AI với tay được tới đâu" — rồi trỏ về sách. Nếu lớp còn mới, bỏ hẳn demo, thay bằng một slide bản đồ bề mặt là đủ tử tế.

### Khối 6 (15') — Q&A + cam kết hành động

**Mục tiêu một câu:** mỗi người ra về với một cam kết cụ thể, không phải một cảm hứng chung chung.

**Hoạt động:** mỗi học viên viết một câu theo mẫu: "Trong tuần này, tôi sẽ giao việc [X] cho AI, và điều tôi sẽ làm khác trước là [Y]." Mời vài người đọc to. Câu hỏi phổ biến trong Q&A phần lớn đã có ở Phụ lục B — trỏ về đó thay vì trả lời dài.

**Bẫy thường gặp:** Q&A biến thành tư vấn cá nhân cho một hai người trong khi cả lớp ngồi chờ. Hẹn trao đổi riêng sau giờ, giữ sân khấu cho phần cam kết — nó mới là thứ còn lại sau buổi học.

## Câu hỏi chắc chắn sẽ gặp: "Thầy cho xin mẫu prompt được không?"

Câu này sẽ đến, thường vào giữa Khối 3, và cách bạn trả lời quyết định học viên hiểu hay hiểu nhầm cả buổi. Câu trả lời đúng tinh thần guide gồm ba nhịp. Một: công nhận nhu cầu — muốn có mẫu là phản xạ hợp lý của người bận. Hai: giải thích vì sao guide không phát mẫu — một prompt mẫu là brief của *người khác*, đông cứng bối cảnh và taste của họ tại một thời điểm; Chương 2 đã cho thấy những công thức đông cứng kiểu đó hết thiêng nhanh thế nào, có khi còn thành gánh nặng. Ba: đưa thứ thay thế tốt hơn — Phụ lục B, bộ câu hỏi tự kiểm trước khi giao việc. Mẫu thì mượn được; câu hỏi tự kiểm thì thành của mình.

Cùng họ với bẫy này là cám dỗ "diễn lại" demo: chạy trước ở nhà ra kết quả đẹp, lên lớp chiếu lại ảnh chụp như thể vừa chạy. Đừng. Học viên về nhà chạy sẽ ra khác, và niềm tin sụp còn nhanh hơn demo hỏng. Chạy thật, ra gì phân tích nấy — sự trung thực đó chính là một phần nội dung bài giảng.

## Phiên bản rút gọn 90 phút

Cho hội thảo ngắn, giữ nguyên xương, bỏ bớt thịt — mỗi khối một dòng:

- **Khối 1 (25')** — demo tương phản sống + mental model "nhân viên xuất sắc chưa biết gì về bạn"; bỏ phần bức tranh model, chỉ nói một câu "máy đã đổi thế hệ".
- **Khối 2 (10')** — giới thiệu 5 nút qua đúng một ví dụ, không hoạt động nhóm.
- **Khối 3 (30')** — chạy *một* thí nghiệm thực chiến duy nhất, chọn mảng hợp khán giả nhất; học viên chạy nhanh trên việc thật.
- **Khối 4 (10')** — demo một chuỗi dàn ý → duyệt → viết rút gọn.
- **Khối 5 (5')** — bản đồ bề mặt một slide, không demo.
- **Khối 6 (10')** — cam kết hành động + trỏ về guide để đọc tiếp.

Cộng đúng 90 phút, không nghỉ. Bản này chỉ nhằm "vỡ tư duy + một trải nghiệm tay"; đừng hứa với ban tổ chức nhiều hơn thế.

## Điều cốt lõi

- Ba nguyên tắc không nhân nhượng: demo sống trước lý thuyết, học viên đoán trước khi xem output, bài tập trên việc thật của họ.
- Khung sáu khối ≈ 4 giờ 05 giảng + 25 phút nghỉ ≈ 4 giờ 30 — là thiết kế để co giãn, và nơi hy sinh trước khi cháy giờ là Khối 5, không phải Khối 3.
- Demo ra kết quả ngoài dự kiến không phải tai nạn — phân tích tại chỗ chính là bài giảng.
- Khi học viên xin mẫu prompt, đừng phát mẫu: giải thích vì sao mẫu đông cứng sẽ hết thiêng, và phát bộ câu hỏi tự kiểm ở Phụ lục B.
- Thứ học viên mang về không phải là ghi chép, mà là một câu cam kết: tuần này giao việc gì, khác trước ở chỗ nào.

# Phụ lục B — Bộ câu hỏi tự kiểm + FAQ

*Trong phụ lục này, bạn sẽ không nhận được mẫu prompt nào cả — và đó là chủ ý. Thay vào đó là ba bộ câu hỏi tự kiểm để dùng trước khi giao việc, khi output chưa như ý, và khi một việc bắt đầu lặp lại; kèm theo là phần FAQ gom những câu hỏi tôi nghe nhiều nhất mỗi lần đứng lớp.*

## Vì sao phụ lục cuối cùng không phải là kho mẫu prompt

Đến cuối mỗi buổi giảng, thế nào cũng có một cánh tay giơ lên: "Thầy gửi cho lớp bộ mẫu prompt được không ạ?" Tôi hiểu tấm lòng đó lắm — ai chẳng muốn cầm về một thứ dùng được ngay. Nhưng nếu cả cuốn guide này nói đúng một điều, thì điều đó là: một prompt hay của người khác chứa bối cảnh của người khác, taste của người khác, sếp của người khác. Bạn chép về, nó thành cái áo mượn — mặc được, nhưng không vừa.

Bạn còn nhớ mental model xuyên suốt guide chứ: AI là "brilliant but new employee" — nhân viên xuất sắc nhưng mới toanh, chưa biết gì về bạn (xem Chương 3). Với một nhân viên như thế, thứ đáng trao không phải là kịch bản thoại soạn sẵn, mà là thói quen tự hỏi mình vài câu trước khi mở miệng giao việc. Câu hỏi thì đi theo bạn qua mọi model, mọi công cụ, mọi lần đổi tên sản phẩm. Mẫu prompt thì không.

Nên phụ lục này là một phản-cheat-sheet: không phát cá, không phát cả cần câu — phát cái thói quen nhìn mặt hồ trước khi buông câu.

## Trước khi bấm gửi: sáu câu hỏi

Không cần hỏi đủ sáu câu cho mọi việc — việc nhỏ hỏi một câu là đủ, việc quan trọng thì rà hết. Quan trọng là hỏi *trước* khi gửi, vì mười giây tự kiểm rẻ hơn nhiều so với ba vòng sửa output.

- **Người nhận việc này cần biết gì mà chỉ mình tôi biết?** — Sếp bạn khó tính chỗ nào, khách hàng này kỵ điều gì, bản trước bị chê vì sao. Đó là phần bối cảnh không nằm ở đâu ngoài đầu bạn, và model không có cách nào đoán ra (Chương 3 gọi đây là "khoảng cách ý định").
- **"Đạt" nghĩa là gì?** — Độ dài bao nhiêu, giọng thế nào, ai đọc, họ sẽ soi chỗ nào. Nếu chính bạn chưa trả lời được câu này, đừng ngạc nhiên khi output "đúng mà không trúng".
- **Điều gì tuyệt đối không được xảy ra?** — Số liệu bịa? Lộ thông tin nội bộ? Hứa thay công ty? Ranh giới thật thì nói thẳng ra; còn lại, hãy nói điều model *nên* làm thay vì rải một rừng điều cấm (Chương 4, nút trói buộc).
- **Nó được tự quyết tới đâu?** — Gặp chỗ mơ hồ thì tự chọn phương án hay dừng lại hỏi bạn? Việc một-lần-ăn-ngay và việc chạy dài cần hai câu trả lời khác nhau (Chương 4, nút quyền tự quyết; Chương 8 cho việc dài).
- **Tôi có đang dạy nó cách làm một việc nó giỏi hơn tôi không?** — Đọc lại brief lần cuối: phần nào là *đích và tiêu chí*, phần nào là *kịch bản từng bước*? Phần đầu gần như luôn đáng tiền; phần sau chỉ đáng khi quy trình chính là thứ bạn cần kiểm soát.
- **Việc này đáng để máy nghĩ sâu đến đâu?** — Cần gạt duy nhất nằm ngoài brief: mức suy nghĩ (hoặc lựa chọn model) trên giao diện. Việc vặt để mức mặc định; việc mơ hồ, nhiều tài liệu, sai-là-đau thì vặn lên và chấp nhận chờ (xem cuối Chương 4).

Và một phép thử chốt hạ, mượn từ chính Anthropic: đưa brief cho một đồng nghiệp đọc. Nếu người đó có thể hiểu nhầm, model cũng có thể hiểu nhầm. Nhân tiện, lúc đọc lại, để ý luôn xem brief có chỗ nào *tự mâu thuẫn* không — Chương 2 đã kể vì sao mâu thuẫn còn hại hơn thiếu: model thế hệ mới đọc kỹ đến mức thấy cả những mâu thuẫn bạn không thấy, rồi loay hoay tìm cách chiều cả hai phía.

## Khi output chưa như ý: bốn câu hỏi

Output dở là lúc dễ đổ lỗi nhất — cho model, cho công cụ, cho "AI cũng thường thôi". Trước khi kết luận, dừng lại bốn nhịp.

- **Brief-lỗi hay model-lỗi?** — Câu hỏi đảo của Chương 3: một nhân viên giỏi nhận đúng cái brief này, liệu có làm khác không? Nếu câu trả lời là "chắc cũng ra cỡ đó thôi", thì thứ cần sửa không phải là model.
- **Thiếu bối cảnh nào?** — Nhìn vào chỗ output trượt: nó trượt vì không biết điều gì? Điều đó có nằm trong brief không? Thường là không — và thường nó nằm trong đầu bạn, hiển nhiên với bạn đến mức bạn quên nói.
- **Chê của tôi đã đủ cụ thể chưa?** — "Chưa hay lắm, viết lại" là lời chê không ai làm theo được, kể cả người. "Đoạn hai dài, giọng đoạn cuối cứng, bỏ ý ba" mới là feedback (Chương 7). Mỗi lần chê cụ thể là một lần chuyển giao thêm bối cảnh — rẻ nhất trong mọi hình thức.
- **Sửa tiếp hay giao lại từ đầu?** — Nếu đã ba vòng mà bản sửa vẫn xoay quanh cùng một chỗ hỏng, nhiều khả năng khung ban đầu đã lệch. Đập đi, viết brief tốt hơn với những gì vừa học được từ các vòng thất bại — thường nhanh hơn là vá mãi (Chương 8).

## Khi một việc bắt đầu lặp lại: ba câu hỏi

- **Việc này đã lặp đủ đều, tiêu chí đã đủ ổn định chưa?** — Việc lặp đều với tiêu chí ổn định thì đáng đóng gói thành quy trình; việc mỗi lần mỗi khác thì giao tay từng lần vẫn nhanh hơn.
- **Đóng gói ở đâu?** — Chương 8 đã dạo một vòng các chỗ cất: Custom Instructions và Projects (tính đến 08/2026) bên ChatGPT, Projects và Skills bên Claude, rồi các loại task hẹn giờ, agent cho team. Chương 10 nói kỹ từng bề mặt. Nguyên tắc chọn vẫn thế: brief bạn gõ đi gõ lại chính là thứ nên được đóng gói.
- **Bao lâu tôi xem lại cái gói một lần?** — Đừng đóng gói rồi quên. Chương 2 đã cho thấy bài học chính chủ: hướng dẫn viết cho model đời trước có thể làm model đời sau *kém đi* — Anthropic nói thẳng về các Skills cũ: "Skills developed for prior models are often too prescriptive... and can degrade output quality" (những skill viết cho model trước thường quá chi li với model mới và có thể làm giảm chất lượng output). Mỗi lần model lên đời là một dịp mở gói ra, gỡ bớt đồ cũ.

## FAQ — những câu hay gặp nhất ở lớp

**"Nói tiếng Việt với AI có kém hơn tiếng Anh không?"** Với công việc văn phòng thường ngày, model hiện nay xử lý tiếng Việt tốt — bạn cứ giao việc bằng tiếng Việt cho tự nhiên. Thuật ngữ chuyên ngành thì trộn Anh–Việt thoải mái, như chính bạn vẫn nói ở văn phòng. Điều quyết định chất lượng output là chất lượng brief, không phải ngôn ngữ của brief.

**"Đưa dữ liệu công ty lên có an toàn không?"** Câu này guide không trả lời thay công ty bạn được. Nguyên tắc: hỏi chính sách nội bộ trước; dữ liệu nhạy cảm thì dùng các gói dành cho doanh nghiệp; và tự đọc trang privacy của vendor thay vì tin lời kể lại — kể cả lời của guide này.

**"Rốt cuộc model nào tốt nhất?"** Câu hỏi này giống "xe nào tốt nhất" — tùy bạn chở gì, đi đường nào. Cả hai hệ sinh thái đều có model mạnh (Chương 1 chụp lại bức tranh tại 08/2026); cách duy nhất để biết cái nào hợp là thử cả hai *trên đúng việc của bạn*, với cùng một brief tử tế, rồi để taste của bạn chấm điểm.

**"Prompt dài hay ngắn thì tốt hơn?"** Câu hỏi sai đơn vị đo. Thứ cần đếm không phải chữ mà là tín hiệu: một file mẫu đúng ý đáng giá hơn mười dòng mô tả; một dòng tiêu chí trúng chỗ đáng giá hơn một trang rào đón. Có brief hai câu là hoàn hảo, có brief một trang vẫn thiếu (Chương 4).

**"Tôi có cần học 'prompt engineering' bài bản không?"** Nếu ý bạn là học thuộc các công thức, thì không — Chương 2 đã kể số phận của các công thức. Nếu ý bạn là tập thói quen nói rõ đích, bối cảnh và tiêu chí, thì có — nhưng đó là kỹ năng giao việc, và nó làm bạn giỏi lên cả khi làm việc với người.

**"AI nói sai, bịa số thì sao?"** Vẫn xảy ra — ít hơn trước, nhưng không miễn nhiễm. Việc càng hệ trọng càng phải đòi nguồn kèm link, ngày của số liệu, và dặn model nói rõ chỗ nó không chắc (Chương 5). Chữ ký dưới văn bản là của bạn, không phải của model.

**"Dùng nhiều thế này có lười đi, phụ thuộc không?"** Có, nếu bạn outsource phần *hiểu*. Không, nếu bạn dùng nó như cái gương và buồng tập — bắt nó phản biện mình, hỏi ngược mình, soi điểm mù của mình. Chương 9 dành trọn cho chuyện này; nó là chương tôi mong bạn đọc lại nhất sau vài tháng.

**"Xin mẫu prompt của người giỏi về dùng có sao không?"** Đọc để học cách người ta *nghĩ* thì rất nên. Chép nguyên văn về dùng thì như mượn bài phát biểu đám cưới của người khác — câu chữ mượt đấy, nhưng cô dâu chú rể nghe sẽ thấy sai sai. Đọc mẫu của họ, rồi tự hỏi sáu câu ở đầu phụ lục này cho việc của bạn.

**"Mai kia model đổi tên hết thì guide này còn đúng không?"** Tên model chắc chắn sẽ đổi — Chương 1 chốt số liệu tại 08/2026 và nói trước điều đó. Nhưng thứ guide này dạy không nằm ở tên: chừng nào bạn còn giao việc cho một trí tuệ giỏi-mà-chưa-biết-gì-về-bạn, chừng đó bối cảnh và tiêu chí nghiệm thu còn là đồng tiền mạnh nhất.

**"Ngày mai tôi nên bắt đầu từ đâu?"** Chọn một việc thật bạn đang phải làm tuần này. Giao nó với đủ sáu câu tự kiểm. Khi output về, đừng chấm "được/không được" — hỏi xem nó thiếu bối cảnh gì, rồi giao lại. Hai vòng như thế dạy bạn nhiều hơn mọi phụ lục.

## Lời chào ra về

Nếu phải gói cả cuốn guide vào một hình ảnh mang về, tôi xin gửi lại hình ảnh đã mở đầu: công ty bạn vừa tuyển được một người cực giỏi, và ngày mai là ngày đầu tiên người đó đi làm. Người đó không cần bạn đọc cho chép từng chữ. Người đó cần bạn ngồi xuống, kể cho nghe sếp bạn khó ở đâu, khách bạn kỵ điều gì, và thế nào thì được gọi là "đạt".

Kỹ năng ngồi xuống kể-cho-rõ ấy, bạn luyện với AI, nhưng nó ở lại với bạn — trong cách bạn giao việc cho đồng nghiệp, cách bạn nhận việc từ sếp, cách bạn tự hỏi "mình thật ra muốn gì" trước mỗi việc lớn nhỏ. Máy sẽ còn đổi thế hệ nhiều lần nữa. Người biết nói rõ mình muốn gì thì thế hệ nào cũng quý.

Chúc bạn giao việc vui. Và nhớ: khi output dở, hãy hỏi cái brief trước khi trách người nhận brief.

## Điều cốt lõi

- Mẫu prompt của người khác chứa bối cảnh của người khác; thứ đáng mang theo là bộ câu hỏi tự kiểm, không phải bộ câu trả lời soạn sẵn.
- Trước khi gửi, rà sáu điều: bối cảnh chỉ mình biết, định nghĩa "đạt", ranh giới tuyệt đối, mức tự quyết, mình có đang dạy cách làm thừa không, và việc này đáng để máy nghĩ sâu đến đâu.
- Khi output dở, câu hỏi đầu tiên là "brief-lỗi hay model-lỗi?" — và lời chê chỉ có tác dụng khi đủ cụ thể.
- Việc lặp đều với tiêu chí ổn định thì đáng đóng gói, nhưng gói nào cũng cần mở ra xem lại mỗi lần model lên đời.
- Tên model sẽ đổi; thói quen chuyển giao bối cảnh và tiêu chí nghiệm thu thì đi theo bạn lâu dài.

/* ================= markdown ================= */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(s){
  s=s.replace(/`([^`]+)`/g,(m,c)=>"<code>"+c+"</code>");
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/\*([^*\n]+)\*/g,"<em>$1</em>");
  return s;
}
function renderTable(rows){
  let h='<div class="tblwrap"><table>';
  rows.forEach((r,i)=>{
    if(/^\|[\s\-|:]+\|$/.test(r)) return;
    const cells=r.split("|").slice(1,-1).map(c=>c.trim());
    const tag=i===0?"th":"td";
    h+="<tr>"+cells.map(c=>"<"+tag+">"+inline(c)+"</"+tag+">").join("")+"</tr>";
  });
  return h+"</table></div>";
}
function mdToHtml(md){
  const fences=[];
  md=md.replace(/```text\r?\n([\s\S]*?)```/g,(m,c)=>{fences.push(c);return "␀F"+(fences.length-1)+"␀";});
  md=esc(md);
  const lines=md.split(/\r?\n/);
  let html="",list=false,para=[];
  const flush=()=>{if(para.length){html+="<p>"+inline(para.join(" "))+"</p>";para=[];}};
  const endList=()=>{if(list){html+="</ul>";list=false;}};
  for(let i=0;i<lines.length;i++){
    const L=lines[i];
    const T=L.trim();
    if(/^\|/.test(T)){flush();endList();const tb=[];while(i<lines.length&&/^\|/.test(lines[i].trim())){tb.push(lines[i].trim());i++;}i--;html+=renderTable(tb);continue;}
    if(/^### /.test(L)){flush();endList();html+="<h3>"+inline(L.slice(4))+"</h3>";continue;}
    if(/^## /.test(L)){flush();endList();html+="<h2>"+inline(L.slice(3))+"</h2>";continue;}
    if(/^# /.test(L)){flush();endList();html+="<h1>"+inline(L.slice(2))+"</h1>";continue;}
    if(/^- /.test(L)){flush();if(!list){html+="<ul>";list=true;}html+="<li>"+inline(L.slice(2))+"</li>";continue;}
    if(/^␀F\d+␀$/.test(T)){flush();endList();html+=T;continue;}
    if(T===""){flush();endList();continue;}
    para.push(T);
  }
  flush();endList();
  html=html.replace(/␀F(\d+)␀/g,(m,n)=>'<figure class="prompt"><figcaption>Ví dụ · cách giao việc</figcaption><pre>'+esc(fences[+n]).trim()+"</pre></figure>");
  return html;
}

function titleOf(i){

}

function minutesOf(i){

}

function decorate(articleEl){
