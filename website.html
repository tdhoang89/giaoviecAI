class=\"ch\">←<\/span><\/div>\n<div class=\"navz right\" onclick=\"next()\"><span class=\"ch\">→<\/span><\/div>\n\n<div id=\"stage\">\n\n<!-- ═══════════ 00 TITLE ═══════════ -->\n<section class=\"scene\" id=\"s-title\" data-fx=\"zoom\" data-label=\"Mở màn\">\n  <div class=\"wrap\">\n    <div class=\"pre\" data-anim style=\"--d:.1s\">BUỔI GIẢNG · <b>NGHỆ THUẬT GIAO VIỆC CHO AI<\/b> · 08/2026<\/div>\n    <h1 class=\"display\">\n      <span class=\"ln\"><span style=\"--d:.35s\">Nhân Viên Xuất Sắc<\/span><\/span>\n      <span class=\"ln\"><span class=\"l2\" style=\"--d:.55s\">Chưa Biết Gì Về Bạn<\/span><\/span>\n    <\/h1>\n    <div class=\"sub\" data-anim style=\"--d:.95s\">Làm việc với ChatGPT &amp; Claude thế hệ mới — như sếp giỏi làm việc với người giỏi<\/div>\n    <div class=\"start\" data-anim style=\"--d:1.35s\">Bấm <span class=\"arr\">→<\/span> để bắt đầu<\/div>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 01 HOOK ═══════════ -->\n<section class=\"scene statement\" data-label=\"Mở màn\">\n  <div class=\"wrap\">\n    <div class=\"kicker\" data-anim>Câu hỏi mở màn<\/div>\n    <h1 class=\"display\" style=\"margin-top:3vh\">\n      <span class=\"ln\"><span style=\"--d:.15s\">“Ơ, sao nó<\/span><\/span>\n      <span class=\"ln\"><span style=\"--d:.3s\">không hiểu ý mình nhỉ?”<\/span><\/span>\n    <\/h1>\n    <p class=\"lead frag\">Cái nhíu mày quen thuộc đó là điểm xuất phát của cả buổi hôm nay.<\/p>\n    <p class=\"lead frag\">Vì phần lớn trường hợp — <strong>vấn đề không nằm ở máy.<\/strong><br>Nó nằm ở chỗ: <strong>cách giao việc của chúng ta đang lệch thế hệ so với máy.<\/strong><\/p>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 02 DIVIDER I ═══════════ -->\n<section class=\"scene divider\" data-theme=\"acc\" data-fx=\"wipe\" data-label=\"Phần một\">\n  <div class=\"wrap\">\n    <div class=\"rn\" data-anim>I<\/div>\n    <div>\n      <div class=\"dk\" data-anim style=\"--d:.15s\">Phần một<\/div>\n      <h1 class=\"display\" ><span class=\"ln\"><span style=\"--d:.25s\">Máy đã đổi thế hệ<\/span><\/span><\/h1>\n      <p class=\"dsub\" data-anim style=\"--d:.5s\">Trước khi giao việc, hãy nhìn mặt người nhận việc — họ vừa thay đổi rất nhiều.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 03 MODELS 2026 ═══════════ -->\n<section class=\"scene\" data-label=\"Phần một · Bức tranh 2026\">\n  <div class=\"wrap wide\">\n    <div class=\"kicker\" data-anim>Bức tranh 08/2026 — bạn đang nói chuyện với ai?<\/div>\n    <div class=\"cols2\">\n      <div class=\"brandcol\" data-anim style=\"--d:.2s\">\n        <div class=\"bh\"><span class=\"bn\">OpenAI<\/span><span class=\"bl\">ChatGPT<\/span><\/div>\n        <div class=\"mcard hot\">\n          <div class=\"mtop\"><span class=\"mname\">GPT-5.6 — Sol · Terra · Luna<\/span><span class=\"mdate\">09.07.2026<\/span><\/div>\n          <div class=\"mdesc\">Flagship mới nhất. Sol nhận các mức nghĩ sâu; <em>GPT-5.5 Instant<\/em> vẫn trực mặc định cho câu nhanh.<\/div>\n        <\/div>\n        <div class=\"mcard\">\n          <div class=\"mtop\"><span class=\"mname\">GPT-5.5<\/span><span class=\"mdate\">23.04.2026<\/span><\/div>\n          <div class=\"mdesc\">“Giao một việc bừa bộn, nhiều phần — và tin nó tự lập kế hoạch, tự kiểm tra, làm cho tới xong.”<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"brandcol\" data-anim style=\"--d:.4s\">\n        <div class=\"bh\"><span class=\"bn\">Anthropic<\/span><span class=\"bl\">Claude<\/span><\/div>\n        <div class=\"mcard hot\">\n          <div class=\"mtop\"><span class=\"mname\">Claude Fable 5 &amp; Mythos 5<\/span><span class=\"mdate\">09.06.2026<\/span><\/div>\n          <div class=\"mdesc\">Tier mới <em>Mythos-class<\/em>, đứng trên cả Opus — “vượt mọi model từng phổ cập”.<\/div>\n        <\/div>\n        <div class=\"mcard\">\n          <div class=\"mtop\"><span class=\"mname\">Opus 5 · Sonnet 5<\/span><span class=\"mdate\">24.07 · 30.06.2026<\/span><\/div>\n          <div class=\"mdesc\"><em>Sonnet 5<\/em> là người bạn gặp mặc định trên claude.ai (Free/Pro) — thế hệ “làm xong việc khó”, không phải thế hệ “trả lời câu hỏi”.<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"footnote\" data-anim style=\"--d:.7s\">Tên model &amp; ngày: công bố chính chủ OpenAI / Anthropic · chốt tại 08/2026 — tên sẽ đổi, bài học thì không<\/div>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 04 FAREWELL GPT-4 ═══════════ -->\n<section class=\"scene\" id=\"s-farewell\" data-fx=\"zoom\" data-label=\"Phần một · Một đám tang lặng lẽ\">\n  <div class=\"wrap\">\n    <div class=\"kicker\" data-anim>Một đám tang lặng lẽ<\/div>\n    <div class=\"date\" data-anim style=\"--d:.15s\">13.02.2026<\/div>\n    <h2 data-anim style=\"--d:.3s\">Thời GPT-4 chính thức khép lại.<\/h2>\n    <div class=\"rows\" data-anim style=\"--d:.45s\">\n      <div class=\"rw\"><span class=\"who\">GPT-4o · GPT-4.1 · o4-mini<\/span><span class=\"when\">rời ChatGPT — 13.02.2026<\/span><\/div>\n      <div class=\"rw\"><span class=\"who\">GPT-4.5<\/span><span class=\"when\">27.06.2026<\/span><\/div>\n      <div class=\"rw\"><span class=\"who\">o3<\/span><span class=\"when\">hẹn 26.08.2026<\/span><\/div>\n    <\/div>\n    <p class=\"punch frag\">Mọi file <strong>“100 mẫu prompt hay”<\/strong> từng chuyền tay trên Zalo…<br>đều được viết cho <strong>một thế hệ máy không còn tồn tại trong sản phẩm.<\/strong><\/p>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 05 PICKER ═══════════ -->\n<section class=\"scene\" id=\"s-picker\" data-label=\"Phần một · Câu hỏi mới\">\n  <div class=\"wrap\">\n    <div class=\"kicker\" data-anim>Sự dịch chuyển ít ai để ý<\/div>\n    <h1 class=\"display\" style=\"margin-top:2.6vh\"><span class=\"ln\"><span style=\"--d:.15s\">Câu hỏi không còn là “chọn model nào”…<\/span><\/span><\/h1>\n    <div class=\"q frag\">mà là: việc này đáng để máy<br>nghĩ sâu đến đâu?<\/div>\n    <div class=\"rail\">\n      <div class=\"stop frag\"><div class=\"sn\">Instant<\/div><div class=\"sd\">GPT-5.5 · mặc định<\/div><\/div>\n      <div class=\"stop frag\"><div class=\"sn\">Medium<\/div><div class=\"sd\">GPT-5.6 Sol<\/div><\/div>\n      <div class=\"stop frag\"><div class=\"sn\">High<\/div><div class=\"sd\">GPT-5.6 Sol<\/div><\/div>\n      <div class=\"stop frag\"><div class=\"sn\">Extra High<\/div><div class=\"sd\">GPT-5.6 Sol<\/div><\/div>\n      <div class=\"stop frag lit\"><div class=\"sn\">Pro<\/div><div class=\"sd\">GPT-5.6 Sol Pro<\/div><\/div>\n    <\/div>\n    <p class=\"note frag\">Picker của ChatGPT giờ hiển thị <b style=\"color:var(--ink);font-weight:500\">mức nỗ lực suy nghĩ<\/b>, kèm auto-routing tự nâng mức khi việc phức tạp (gói trả phí). Đây là một câu hỏi kiểu <b style=\"color:var(--ink);font-weight:500\">quản lý<\/b> — và người trả lời được là bạn.<\/p>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 06 DIVIDER II ═══════════ -->\n<section class=\"scene divider\" data-theme=\"acc\" data-fx=\"wipe\" data-label=\"Phần hai\">\n  <div class=\"wrap\">\n    <div class=\"rn\" data-anim>II<\/div>\n    <div>\n      <div class=\"dk\" data-anim style=\"--d:.15s\">Phần hai<\/div>\n      <h1 class=\"display\"><span class=\"ln\"><span style=\"--d:.25s\">Vì sao mẹo cũ hết thiêng<\/span><\/span><\/h1>\n      <p class=\"dsub\" data-anim style=\"--d:.5s\">Mỗi mẹo là một miếng vá — vá đúng một khuyết điểm có thật của model đời cũ. Áo đã thay rồi.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 07 PATCHES ═══════════ -->\n<section class=\"scene\" data-label=\"Phần hai · Khảo cổ 6 mẹo\">\n  <div class=\"wrap wide\">\n    <div class=\"kicker\" data-anim>Khảo cổ những câu thần chú 2023–2024<\/div>\n    <div class=\"chips\">\n      <div class=\"chip frag\" data-strike><div class=\"cn\">MẸO 01<\/div><div class=\"ct\">“Hãy suy nghĩ từng bước”<\/div><div class=\"cw\">Model nay tự nháp bên trong — nhắc thêm là thừa, có khi nhận về tờ nháp dài gấp ba.<\/div><\/div>\n      <div class=\"chip frag\" data-strike><div class=\"cn\">MẸO 02<\/div><div class=\"ct\">“Bạn là chuyên gia 20 năm”<\/div><div class=\"cw\">Vai không còn “tăng IQ” — chỉ còn đáng khi đổi <b>góc nhìn<\/b> (để dành cho phần review).<\/div><\/div>\n      <div class=\"chip frag\" data-strike><div class=\"cn\">MẸO 03<\/div><div class=\"ct\">VIẾT HOA · “CỰC KỲ QUAN TRỌNG”<\/div><div class=\"cw\">Micro hết rè rồi. Hét gì máy làm quá cái đó — bệnh làm-thiếu thành bệnh làm-thừa.<\/div><\/div>\n      <div class=\"chip frag\" data-strike><div class=\"cn\">MẸO 04<\/div><div class=\"ct\">Dọa trừ lương, hứa tip<\/div><div class=\"cw\">Thay bằng một thứ mạnh hơn nhiều: nói <b>lý do<\/b> điều đó hệ trọng.<\/div><\/div>\n      <div class=\"chip frag\" data-strike><div class=\"cn\">MẸO 05<\/div><div class=\"ct\">Nhồi ví dụ few-shot<\/div><div class=\"cw\">“Thử không ví dụ trước đã.” Ví dụ để truyền <b>taste<\/b> thì vẫn quý.<\/div><\/div>\n      <div class=\"chip frag\" data-strike><div class=\"cn\">MẸO 06<\/div><div class=\"ct\">Prompt dài như hợp đồng<\/div><div class=\"cw\">Chỉ dẫn ngắn đủ lái; file hướng dẫn phình to làm máy bỏ qua chỉ dẫn thật.<\/div><\/div>\n    <\/div>\n    <p class=\"patches-punch frag\">Không phải người dạy bạn sai — <strong>hồi đó chúng đúng thật.<\/strong> Nhưng mẹo chỉ sống khi khuyết điểm nó bù còn sống.<\/p>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 08 TWIST ═══════════ -->\n<section class=\"scene\" data-fx=\"zoom\" data-label=\"Phần hai · Cái twist\">\n  <div class=\"wrap\">\n    <div class=\"bigquote\">\n      <div class=\"qmark\" data-anim>“<\/div>\n      <blockquote>\n        <span class=\"ln\"><span style=\"--d:.2s\">Prompt mâu thuẫn hoặc mơ hồ<\/span><\/span>\n        <span class=\"ln\"><span style=\"--d:.35s\">gây hại cho model mới<\/span><\/span>\n        <span class=\"ln\"><span class=\"hl\" style=\"--d:.5s\">nhiều hơn cả model cũ.<\/span><\/span>\n      <\/blockquote>\n      <p class=\"gloss frag\">“…can be <b style=\"color:var(--ink)\">more damaging to GPT-5<\/b> than to other models, as it expends reasoning tokens searching for a way to reconcile the contradictions…”<\/p>\n      <p class=\"gloss frag\"><b style=\"color:var(--ink);font-weight:500\">Model mới đọc kỹ đến mức thấy cả những mâu thuẫn bạn không thấy.<\/b> Model cũ lười đọc nên thoát nạn — model mới đọc hết, nên lãnh đủ.<\/p>\n      <div class=\"att\" data-anim style=\"--d:.6s\">OpenAI — GPT-5 Prompting Guide<\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 09 VENDORS SAY ═══════════ -->\n<section class=\"scene\" data-label=\"Phần hai · Chính chủ nói\">\n  <div class=\"wrap\">\n    <div class=\"kicker\" data-anim>Không phải tôi nói — chính hãng nói<\/div>\n    <div class=\"qcards\">\n      <div class=\"qcard frag\">\n        <div class=\"qe\">“GPT-5 follows prompt instructions with surgical precision.”<\/div>\n        <div class=\"qv\">Nghe lời chính xác như dao mổ — prompt tốt được nhân lên, prompt dở cũng vậy.<\/div>\n        <div class=\"qs\">OpenAI<\/div>\n      <\/div>\n      <div class=\"qcard frag\">\n        <div class=\"qe\">“CRITICAL: You MUST…” → hãy viết bình thường: “Use this tool when…”<\/div>\n        <div class=\"qv\">Anthropic khuyên gỡ over-prompting khi lên model mới — nói một lần, giọng bình thường, là đủ.<\/div>\n        <div class=\"qs\">Anthropic<\/div>\n      <\/div>\n      <div class=\"qcard frag\">\n        <div class=\"qe\">“Skills developed for prior models… can degrade output quality.”<\/div>\n        <div class=\"qv\">Bộ hướng dẫn viết cho model cũ có thể làm model mới <b style=\"color:var(--ink)\">kém đi<\/b> — hãy rà và gỡ bớt. Đường đến kết quả tốt hơn là <b style=\"color:var(--ink)\">bớt đi<\/b>, không phải thêm vào.<\/div>\n        <div class=\"qs\">Anthropic — Prompting Claude Fable 5<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 10 DIVIDER III ═══════════ -->\n<section class=\"scene divider\" data-theme=\"acc\" data-fx=\"wipe\" data-label=\"Phần ba\">\n  <div class=\"wrap\">\n    <div class=\"rn\" data-anim>III<\/div>\n    <div>\n      <div class=\"dk\" data-anim style=\"--d:.15s\">Phần ba — tư duy nền tảng<\/div>\n      <h1 class=\"display\"><span class=\"ln\"><span style=\"--d:.25s\">Nhân viên xuất sắc,<\/span><\/span><span class=\"ln\"><span class=\"it\" style=\"--d:.4s\">chưa biết gì về bạn<\/span><\/span><\/h1>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 11 MENTAL MODEL ═══════════ -->\n<section class=\"scene\" id=\"s-mental\" data-label=\"Phần ba · Mental model\">\n  <div class=\"wrap\">\n    <div class=\"bigquote\">\n      <blockquote>\n        <span class=\"ln\"><span style=\"--d:.15s\">“Think of Claude as a <span class=\"hl\">brilliant but new employee<\/span><\/span><\/span>\n        <span class=\"ln\"><span style=\"--d:.3s\">who lacks context on your norms and workflows.”<\/span><\/span>\n      <\/blockquote>\n      <div class=\"att\" data-anim style=\"--d:.5s\">Anthropic — tài liệu hướng dẫn chính thức<\/div>\n    <\/div>\n    <div class=\"panels\">\n      <div class=\"panel frag\">\n        <div class=\"pt\">Xuất sắc<\/div>\n        <div class=\"pd\">→ <strong>Đừng dạy nó cách làm.<\/strong><br>Bạn không ngồi cạnh kế toán trưởng giỏi để chỉ “em mở Excel, gõ ô A1…”<\/div>\n      <\/div>\n      <div class=\"panel frag\">\n        <div class=\"pt\">Mới toanh<\/div>\n        <div class=\"pd\">→ <strong>Đừng bắt nó đoán bối cảnh.<\/strong><br>Mọi thứ bạn thấy “hiển nhiên, cần gì nói” — với nó đều không hiển nhiên.<\/div>\n      <\/div>\n    <\/div>\n    <p class=\"lead frag\" style=\"margin-top:4.5vh;font-size:clamp(1rem,1.5vw,1.3rem);color:var(--mut)\">Toàn bộ nghệ thuật nằm ở chỗ giữ cả hai: <b style=\"color:var(--acc);font-weight:600\">rộng tay về cách làm — hào phóng về bối cảnh.<\/b> Đa số chúng ta đang làm ngược lại.<\/p>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 12 ICEBERG ═══════════ -->\n<section class=\"scene\" id=\"s-iceberg\" data-label=\"Phần ba · Khoảng cách ý định\">\n  <div class=\"wrap wide\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:4vw;align-items:center\">\n    <div>\n      <div class=\"kicker\" data-anim>Khoảng cách ý định<\/div>\n      <h1 class=\"display\" style=\"margin-top:2.4vh\"><span class=\"ln\"><span style=\"--d:.15s\">Cái bạn gõ ra<\/span><\/span><span class=\"ln\"><span style=\"--d:.3s\">chỉ là phần nổi.<\/span><\/span><\/h1>\n      <p class=\"lead frag\">Trong đầu bạn có cả bức tranh: <strong>mục đích, người đọc, taste, điều kỵ.<\/strong> Gõ ra thì còn đúng một câu: <em>“viết giúp tôi báo cáo quý”.<\/em><\/p>\n      <p class=\"punch frag\">Nó làm đúng cái bạn <span class=\"accent\">nói<\/span> —<br>không phải cái bạn <span class=\"accent\">nghĩ<\/span>.<\/p>\n      <p class=\"small frag\" style=\"margin-top:2.4vh\">“Claude can infer intent, but it can’t read your mind.” — Anthropic<\/p>\n    <\/div>\n    <div class=\"berg\" data-anim style=\"--d:.35s\">\n      <svg viewBox=\"0 0 400 560\" fill=\"none\">\n        <line x1=\"0\" y1=\"150\" x2=\"400\" y2=\"150\" stroke=\"#d3b078\" stroke-opacity=\".5\" stroke-dasharray=\"5 7\"/>\n        <polygon points=\"200,52 258,150 142,150\" fill=\"none\" stroke=\"#f1ebdf\" stroke-width=\"1.6\"/>\n        <polygon points=\"142,150 258,150 320,300 250,430 190,520 110,380 90,240\" fill=\"none\" stroke=\"#5f584c\" stroke-width=\"1.3\"/>\n        <polygon points=\"142,150 258,150 320,300 250,430 190,520 110,380 90,240\" fill=\"rgba(255,74,45,.05)\"/>\n      <\/svg>\n      <div class=\"lbl top\">phần bạn gõ ra<\/div>\n      <div class=\"lbl b1\">mục đích thật<\/div>\n      <div class=\"lbl b2\">ai sẽ đọc, họ soi gì<\/div>\n      <div class=\"lbl b3\">taste — giọng “giống mình”<\/div>\n      <div class=\"lbl b4\">điều tuyệt đối kỵ<\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 13 GOAL NOT PATH ═══════════ -->\n<section class=\"scene\" id=\"s-goal\" data-label=\"Phần ba · Giao đích, đừng giao đường\">\n  <div class=\"wrap\">\n    <div class=\"kicker\" data-anim>Giao đích — đừng giao đường đi<\/div>\n    <div class=\"vs\">\n      <div class=\"boss bad frag\"><div class=\"bt\">Sếp tồi<\/div><div class=\"bx\">Áp đặt từng bước, đọc cho chép từng chữ — và nhận về những nhân viên chỉ biết chờ lệnh.<\/div><\/div>\n      <div class=\"vsm\" data-anim style=\"--d:.3s\">vs<\/div>\n      <div class=\"boss good frag\"><div class=\"bt\">Sếp giỏi<\/div><div class=\"bx\">Nói rõ đích đến, kể đủ bối cảnh, chốt tiêu chí nghiệm thu — rồi để chuyên viên tự chọn đường.<\/div><\/div>\n    <\/div>\n    <div class=\"formula frag\"><b>MỤC TIÊU<\/b><span class=\"plus\">+<\/span><b>BỐI CẢNH<\/b> <span class=\"mut\" style=\"font-size:.75em\">(nhất là lý do)<\/span><span class=\"plus\">+<\/span><b>TIÊU CHÍ “ĐẠT”<\/b><\/div>\n    <div class=\"tmpl frag\">“I’m working on [việc lớn] for [ai]. They need [để làm gì]. With that in mind: [yêu cầu].” — khung câu chính chủ của Anthropic<\/div>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 14 BRIEF OR MODEL ═══════════ -->\n<section class=\"scene statement\" id=\"s-flip\" data-fx=\"zoom\" data-label=\"Phần ba · Phép đảo\">\n  <div class=\"wrap\">\n    <div class=\"kicker\" data-anim>Khi output dở — hỏi câu này trước<\/div>\n    <h1 class=\"display serif it\" style=\"margin-top:2.2vh;font-size:clamp(1.7rem,4.1vw,3.5rem);line-height:1.28\">\n      <span class=\"ln\"><span style=\"--d:.2s\">“Một nhân viên giỏi, nhận đúng<\/span><\/span>\n      <span class=\"ln\"><span style=\"--d:.35s\">cái brief này — không hơn không kém —<\/span><\/span>\n      <span class=\"ln\"><span class=\"accent\" style=\"--d:.5s\">liệu có làm khác không?”<\/span><\/span>\n    <\/h1>\n    <p class=\"lead frag\">Nếu <strong>“chắc cũng ra cỡ đó thôi”<\/strong> → brief-lỗi. Trường hợp phổ biến — và may mắn, vì nó nằm trong tay bạn.<\/p>\n    <p class=\"lead frag\">Người hay cáu <strong>đổi model liên tục, giữ nguyên brief<\/strong>. Người hiệu quả <strong>giữ model, sửa brief<\/strong> — và mỗi lần sửa lại hiểu thêm chính công việc của mình.<\/p>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 15 DIVIDER IV ═══════════ -->\n<section class=\"scene divider\" data-theme=\"acc\" data-fx=\"wipe\" data-label=\"Phần bốn\">\n  <div class=\"wrap\">\n    <div class=\"rn\" data-anim>IV<\/div>\n    <div>\n      <div class=\"dk\" data-anim style=\"--d:.15s\">Phần bốn<\/div>\n      <h1 class=\"display\"><span class=\"ln\"><span style=\"--d:.25s\">Nghệ thuật liều lượng<\/span><\/span><\/h1>\n      <p class=\"dsub\" data-anim style=\"--d:.5s\">Lúc nào cần chi tiết? Lúc nào cần cấm? Không có công thức — có 5 cái nút, và dấu hiệu đang vặn lệch.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 16 MIXER ═══════════ -->\n<section class=\"scene\" id=\"s-mixer\" data-label=\"Phần bốn · 5 cái nút\">\n  <div class=\"wrap wide\">\n    <div class=\"kicker\" data-anim>Bàn trộn của người giao việc — không nút nào có vạch chuẩn<\/div>\n    <div class=\"board\">\n      <div class=\"knob frag\" style=\"--rot:35deg\"><div class=\"dial\"><\/div><div class=\"kt\">Đích<\/div><div class=\"kd\">Chi tiết về <b>đích<\/b> gần như luôn đáng tiền — chi tiết về cách làm thì ngược lại.<\/div><\/div>\n      <div class=\"knob frag\" style=\"--rot:-25deg\"><div class=\"dial\"><\/div><div class=\"kt\">Trói buộc<\/div><div class=\"kd\">Nói điều <b>nên<\/b> làm; cấm đoán để dành cho ranh giới thật — thứ sai là phải giải trình.<\/div><\/div>\n      <div class=\"knob frag\" style=\"--rot:-40deg\"><div class=\"dial\"><\/div><div class=\"kt\">Cách làm<\/div><div class=\"kd\">Chỉ kê bước khi quy trình là <b>của công ty bạn<\/b> — không phải của thế giới.<\/div><\/div>\n      <div class=\"knob frag\" style=\"--rot:20deg\"><div class=\"dial\"><\/div><div class=\"kt\">Bối cảnh<\/div><div class=\"kd\">Đo bằng <b>tín hiệu<\/b>, không bằng số chữ — một file mẫu thắng mười dòng mô tả.<\/div><\/div>\n      <div class=\"knob frag\" style=\"--rot:45deg\"><div class=\"dial\"><\/div><div class=\"kt\">Tự quyết<\/div><div class=\"kd\">Trao quyền càng rộng, ranh giới càng phải <b>sắc<\/b>.<\/div><\/div>\n    <\/div>\n    <div class=\"rule frag\">Vặn chiều nào cũng có giá. Không có vạch chuẩn —<br><span class=\"accent\">chỉ có dấu hiệu đang lệch, đọc từ output.<\/span><\/div>\n    <div class=\"taste frag\">Bộ vị trí nút của riêng bạn — dò ra qua vài lần giao việc thật — chính là “taste” của bạn. Vì thế không ai đưa được công thức: <b style=\"color:var(--ink)\">họ không nêm bếp nhà bạn.<\/b><\/div>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 17 LEVER 6 ═══════════ -->\n<section class=\"scene\" id=\"s-lever\" data-label=\"Phần bốn · Cần gạt thứ sáu\">\n  <div class=\"wrap\">\n    <div class=\"kicker\" data-anim>Cần gạt thứ sáu — không nằm trong brief, nằm trên giao diện<\/div>\n    <h1 class=\"display\" style=\"margin-top:2.6vh;font-size:clamp(2rem,4.6vw,4rem)\"><span class=\"ln\"><span style=\"--d:.15s\">Mức suy nghĩ.<\/span><\/span><\/h1>\n    <div class=\"qs\">\n      <div class=\"qq frag\"><div class=\"qn\">Câu hỏi 1<\/div><div class=\"qt\">Việc này <em class=\"accent\" style=\"font-style:normal;font-weight:600\">sai thì tốn<\/em> bao nhiêu?<\/div><\/div>\n      <div class=\"qq frag\"><div class=\"qn\">Câu hỏi 2<\/div><div class=\"qt\">Nó có <em class=\"accent\" style=\"font-style:normal;font-weight:600\">mơ hồ, nhiều tầng<\/em>, nhiều tài liệu không?<\/div><\/div>\n    <\/div>\n    <p class=\"lead frag\" style=\"margin-top:5vh;font-size:clamp(.98rem,1.4vw,1.25rem);color:var(--mut);line-height:1.75\">Việc vặt — mức mặc định là quá đủ, chờ máy nghĩ sâu chỉ phí thời gian của bạn.<br>Việc sai-là-đau — <b style=\"color:var(--ink);font-weight:500\">đáng vặn lên, và đáng chờ.<\/b> Vẫn là câu hỏi quản lý quen thuộc: việc nào giao chuyên viên làm nhanh, việc nào đáng cả hội đồng ngồi lại — chỉ khác là bạn trả lời bằng một cú click.<\/p>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 18 DIVIDER V ═══════════ -->\n<section class=\"scene divider\" data-theme=\"acc\" data-fx=\"wipe\" data-label=\"Phần năm\">\n  <div class=\"wrap\">\n    <div class=\"rn\" data-anim>V<\/div>\n    <div>\n      <div class=\"dk\" data-anim style=\"--d:.15s\">Phần năm — thực chiến<\/div>\n      <h1 class=\"display\"><span class=\"ln\"><span style=\"--d:.25s\">Cùng một việc.<\/span><\/span><span class=\"ln\"><span class=\"it\" style=\"--d:.4s\">Ba cách giao. Ba sản phẩm.<\/span><\/span><\/h1>\n      <p class=\"dsub\" data-anim style=\"--d:.55s\">Research — Review — Soạn thảo. Phần này chạy demo sống: đoán trước, xem sau, rút nguyên lý.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 19 EXPERIMENT RESEARCH ═══════════ -->\n<section class=\"scene\" id=\"s-exp\" data-label=\"Phần năm · Research & tổng hợp\">\n  <div class=\"wrap wide\">\n    <div class=\"kicker\" data-anim>Thí nghiệm · Research<\/div>\n    <p class=\"setup\" data-anim style=\"--d:.15s\"><strong>4 giờ chiều.<\/strong> Sếp nhắn: “Mai họp đối tác, chuẩn bị cho anh nói 5 phút về thị trường văn phòng ảo Việt Nam nhé.” — Bạn sẽ gõ gì?<\/p>\n    <div class=\"abc\">\n      <div class=\"pcard frag\">\n        <div class=\"ph\"><span class=\"pl\">a<\/span><span class=\"pm\">một câu trần trụi<\/span><\/div>\n        <div class=\"pb\">Tìm hiểu về thị trường văn phòng ảo ở Việt Nam.<\/div>\n        <div class=\"po\"><b>→ Tổng quan dàn trải.<\/b> “Đúng nhưng vô dụng cho cuộc họp 5 phút” — nhưng lại là thứ cần khi bạn chỉ mới thăm dò.<\/div>\n      <\/div>\n      <div class=\"pcard frag\">\n        <div class=\"ph\"><span class=\"pl\">b<\/span><span class=\"pm\">bối cảnh + tiêu chí<\/span><\/div>\n        <div class=\"pb\">Sếp tôi mai họp đối tác BĐS, cần nói 5 phút… <span class=\"cm\">Người nghe trong ngành. Tối đa 5 ý, mỗi ý có số liệu + nguồn + thời điểm để tôi kiểm. Chỗ nào mỏng, nói thẳng là mỏng.<\/span><\/div>\n        <div class=\"po\"><b>→ Đồ dùng được.<\/b> Không phải vì prompt dài hơn — mà vì bạn chuyển giao đúng những thứ chỉ mình bạn biết.<\/div>\n      <\/div>\n      <div class=\"pcard frag\">\n        <div class=\"ph\"><span class=\"pl\">c<\/span><span class=\"pm\">giao kiểu quy trình<\/span><\/div>\n        <div class=\"pb\">Trước khi tìm sâu, đề xuất dàn ý research: tìm mảng nào, tin nguồn nào, mảng nào khó có số liệu. <span class=\"cm\">Tôi duyệt xong mới chạy.<\/span><\/div>\n        <div class=\"po\"><b>→ An toàn nhất cho chủ đề lạ.<\/b> Bạn kiểm hướng đi khi nó còn rẻ.<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"verdict frag\">Cả ba đều đúng — <span class=\"accent\">mỗi cách đúng với một nhu cầu.<\/span><\/div>\n    <div class=\"footnote\" data-anim style=\"--d:.5s\">Bốn câu hỏi của mọi việc thông tin: để làm gì · cho ai · sâu tới đâu · tin nguồn nào — và người ký tên kiểm số liệu vẫn là bạn<\/div>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 20 REVIEW ═══════════ -->\n<section class=\"scene\" id=\"s-review\" data-label=\"Phần năm · Review & phản biện\">\n  <div class=\"wrap\">\n    <div class=\"kicker\" data-anim>Thí nghiệm · Review — “xem giúp mình file này với”<\/div>\n    <div class=\"pillars\">\n      <div class=\"pil frag\"><div class=\"pn\">Vai<\/div><div class=\"px\">Đứng ở góc nhìn nào? <strong>“Đọc như đối tác đang tìm cớ ép giá”<\/strong> ra góp ý khác hẳn “xem giúp”. Đây là chỗ hiếm hoi đóng vai còn đất sống — đổi góc nhìn, không phải tăng IQ.<\/div><\/div>\n      <div class=\"pil frag\"><div class=\"pn\">Phạm vi<\/div><div class=\"px\"><strong>“Bỏ qua chính tả — soi giúp tôi rủi ro.”<\/strong> Khoanh phạm vi không phải trói máy lại, mà là dồn lực vào đúng chỗ cần soi sâu.<\/div><\/div>\n      <div class=\"pil frag\"><div class=\"pn\">Khẩu vị rủi ro<\/div><div class=\"px\">Thà báo động nhầm hay thà bỏ sót? <strong>Chỉ bạn biết<\/strong> — không nói, máy mặc định về mức an toàn: mức lịch sự.<\/div><\/div>\n    <\/div>\n    <div class=\"say frag\">Model vốn lịch sự. Muốn bị chê thật — <span class=\"accent\" style=\"font-weight:600\">phải xin chê thật, và nói vì sao.<\/span><br><span style=\"font-size:.72em;color:var(--mut)\">“Bản này lọt lỗi thì người ký chịu trận là mình — đừng ngại làm mình mất hứng.”<\/span><\/div>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 21 TASTE ═══════════ -->\n<section class=\"scene statement\" data-fx=\"zoom\" data-label=\"Phần năm · Soạn thảo\">\n  <div class=\"wrap\">\n    <div class=\"kicker\" data-anim>Thí nghiệm · Soạn thảo — vương quốc của taste<\/div>\n    <h1 class=\"display serif\" style=\"margin-top:3vh;font-size:clamp(2rem,4.8vw,4.2rem);line-height:1.25\">\n      <span class=\"ln\"><span style=\"--d:.2s\">Một file mẫu đáng giá hơn<\/span><\/span>\n      <span class=\"ln\"><span class=\"it accent\" style=\"--d:.38s\">mười dòng mô tả giọng văn.<\/span><\/span>\n    <\/h1>\n    <p class=\"lead frag\">“Chuyên nghiệp nhưng thân thiện, trang trọng nhưng không cứng nhắc” — gần như <strong>không chứa thông tin gì<\/strong>, vì email nào chẳng muốn thế. Đưa 2–3 email cũ của chính bạn: <strong>“viết đúng giọng của tôi trong này.”<\/strong><\/p>\n    <p class=\"lead frag\">Khi chê, chê như biên tập viên: <strong>“đoạn 2 dài, cắt nửa; giọng đoạn kết cứng, người nhận là chỗ thân tình.”<\/strong> — “Chưa hay lắm, viết lại” không phải feedback. Đó là một tiếng thở dài.<\/p>\n    <p class=\"lead frag\" style=\"color:var(--dim);font-size:.95rem\">Văn bản dài? Duyệt dàn ý trước — sửa trên giấy rẻ hơn sửa trên tường trăm lần. Và đừng gửi thứ bạn không giải thích ngược lại được.<\/p>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 22 DIVIDER VI ═══════════ -->\n<section class=\"scene divider\" data-theme=\"acc\" data-fx=\"wipe\" data-label=\"Phần sáu\">\n  <div class=\"wrap\">\n    <div class=\"rn\" data-anim>VI<\/div>\n    <div>\n      <div class=\"dk\" data-anim style=\"--d:.15s\">Phần sáu<\/div>\n      <h1 class=\"display\"><span class=\"ln\"><span style=\"--d:.25s\">Đừng chỉ ra một lệnh<\/span><\/span><\/h1>\n      <p class=\"dsub\" data-anim style=\"--d:.5s\">Máy bán hàng tự động thì bỏ xu nhận lon. Đồng nghiệp thì có brief, có nháp, có feedback, có chốt — nhiều vòng.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 23 LADDER ═══════════ -->\n<section class=\"scene\" id=\"s-ladder\" data-label=\"Phần sáu · Ba nấc trưởng thành\">\n  <div class=\"wrap\">\n    <div class=\"kicker\" data-anim>Ba nấc trưởng thành khi làm việc với AI<\/div>\n    <div class=\"steps\">\n      <div class=\"st frag\"><div class=\"sn\">Nấc 1<\/div><h3>Ra lệnh<\/h3><p>Một lượt hỏi, một lượt trả lời. Đủ cho việc nhỏ — bày vẽ quy trình chỉ tổ chậm.<\/p><\/div>\n      <div class=\"st frag\"><div class=\"sn\">Nấc 2<\/div><h3>Cộng tác<\/h3><p>Chẻ việc, duyệt từng chặng, chê cụ thể. Mẹo đảo chiều: <b style=\"color:var(--ink)\">“trước khi làm, hỏi tôi 3 câu nếu brief chưa đủ.”<\/b><\/p><\/div>\n      <div class=\"st frag\"><div class=\"sn\">Nấc 3<\/div><h3>Ủy quyền<\/h3><p>Đóng gói quy trình, giao việc dài cho agent — bạn chỉ xuất hiện ở các điểm phê duyệt.<\/p><\/div>\n    <\/div>\n    <p class=\"creed frag\"><strong>Nấc sau không thay nấc trước<\/strong> — người giỏi chọn đúng nấc cho từng việc. Và mỗi lần duyệt là một lần bơm bối cảnh giá rẻ: <strong>feedback là hình thức chuyển giao bối cảnh rẻ nhất.<\/strong><\/p>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 24 PACKAGE ═══════════ -->\n<section class=\"scene\" id=\"s-pack\" data-label=\"Phần sáu · Đóng gói thành quy trình\">\n  <div class=\"wrap\">\n    <div class=\"kicker\" data-anim>Khi việc lặp lại — đóng gói brief thành quy trình<\/div>\n    <div class=\"tools\">\n      <div class=\"tool frag\"><i>2 hệ<\/i>Projects<\/div>\n      <div class=\"tool frag\"><i>ChatGPT<\/i>Custom Instructions · Memory<\/div>\n      <div class=\"tool frag\"><i>ChatGPT<\/i>Scheduled Tasks<\/div>\n      <div class=\"tool frag\"><i>ChatGPT<\/i>Work · Workspace Agents<\/div>\n      <div class=\"tool frag\"><i>Claude<\/i>Skills<\/div>\n      <div class=\"tool frag\"><i>Claude<\/i>Cowork · cloud tasks<\/div>\n    <\/div>\n    <div class=\"cq frag\">\n      <div class=\"qe\">“Set Monday’s client prep for 6 am: Claude works through the email threads, transcripts, and recent news, builds the briefing doc, and leaves the follow-up email <span style=\"color:var(--acc)\">drafted but unsent<\/span>.”<\/div>\n      <div class=\"qv\">6 giờ sáng thứ Hai, tài liệu gặp khách đã dựng sẵn — và email follow-up <b>soạn sẵn nhưng không tự gửi<\/b>. Ranh giới được cài ngay trong thiết kế. <span class=\"goldc\">— Blog Anthropic (Cowork)<\/span><\/div>\n    <\/div>\n    <p class=\"when frag\"><strong>Việc lặp đều + tiêu chí ổn định<\/strong> → đáng đóng gói. Việc mỗi lần mỗi khác → giao tay vẫn nhanh hơn. Và mỗi lần model lên đời — <strong>mở gói ra, gỡ bớt đồ cũ.<\/strong><\/p>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 25 MIRROR ═══════════ -->\n<section class=\"scene\" id=\"s-mirror\" data-label=\"Phần bảy · AI làm gương\">\n  <div class=\"wrap\">\n    <div class=\"kicker\" data-anim>Phần bảy — đảo vai: lần này bạn làm, AI phản biện<\/div>\n    <h1 class=\"display\" data-anim style=\"--d:.12s;font-size:clamp(1.8rem,3.8vw,3.2rem);margin-top:2vh\">Dùng AI để <span class=\"accent\">giỏi lên<\/span> — không phải để lười đi.<\/h1>\n    <div class=\"five\">\n      <div class=\"mrow frag\"><span class=\"mn\">1<\/span><span class=\"mt\">Feedback về thói quen<\/span><span class=\"md\">“Ngoài lỗi của bản này — 2 thói quen viết tôi nên bỏ, kèm ví dụ trích từ chính bài tôi.”<\/span><\/div>\n      <div class=\"mrow frag\"><span class=\"mn\">2<\/span><span class=\"mt\">Mổ xẻ sau việc<\/span><span class=\"md\">Bản tôi nộp vs bản sếp đã sửa: “Sếp tôi đang ưu tiên điều gì mà tôi chưa thấy?” — cặp dữ liệu quý nhất về taste của sếp.<\/span><\/div>\n      <div class=\"mrow frag\"><span class=\"mn\">3<\/span><span class=\"mt\">Học chủ động<\/span><span class=\"md\">“Đừng giảng thêm. Hỏi tôi 5 câu, dễ tới khó — chỗ nào tôi lơ mơ mới giảng lại.”<\/span><\/div>\n      <div class=\"mrow frag\"><span class=\"mn\">4<\/span><span class=\"mt\">Tập dượt tình huống<\/span><span class=\"md\">Buồng tập đàm phán, thuyết trình — đối phương không mệt, không phật ý, không kể lại với ai.<\/span><\/div>\n      <div class=\"mrow frag\"><span class=\"mn\">5<\/span><span class=\"mt\">Tấn công lập luận<\/span><span class=\"md\">“Tôi định quyết X vì Y — giả định nào của tôi mỏng nhất? Tôi đang không nhìn thấy gì?”<\/span><\/div>\n    <\/div>\n    <p class=\"creed frag\">Dùng AI để <span class=\"accent\" style=\"font-weight:600\">hiểu nhanh hơn<\/span> — đừng dùng để <span style=\"color:var(--mut)\">khỏi hiểu<\/span>. Cái hiểu đi mượn không mang vào phòng họp được.<\/p>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 26 SURFACES ═══════════ -->\n<section class=\"scene\" id=\"s-surface\" data-label=\"Phần tám · Nhiều bề mặt, một tư duy\">\n  <div class=\"wrap wide\">\n    <div class=\"kicker\" data-anim>Phần tám — cùng một tư duy, nhiều cánh tay<\/div>\n    <div class=\"spectrum\" data-anim style=\"--d:.2s\">\n      <div class=\"track\"><div class=\"fill\" id=\"s-surface-fill\"><\/div><\/div>\n      <div class=\"stops\">\n        <div class=\"sp frag\"><div class=\"st1\">Nghe bạn kể<\/div><div class=\"st2\">khung chat cơ bản<\/div><\/div>\n        <div class=\"sp frag\"><div class=\"st1\">Đọc file của bạn<\/div><div class=\"st2\">upload · Projects<\/div><\/div>\n        <div class=\"sp frag\"><div class=\"st1\">Tự lên web<\/div><div class=\"st2\">Deep Research · Research mode<\/div><\/div>\n        <div class=\"sp frag\"><div class=\"st1\">Ngồi vào máy bạn<\/div><div class=\"st2\">Cowork · Work (desktop) · Claude Code<\/div><\/div>\n        <div class=\"sp frag\"><div class=\"st1\">Làm khi bạn vắng<\/div><div class=\"st2\">cloud tasks · lịch hẹn giờ<\/div><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"law frag\">Với tay càng xa — <span class=\"accent\">bối cảnh, tiêu chí và ranh giới càng đáng giá.<\/span><\/div>\n    <p class=\"frag\" style=\"text-align:center;margin-top:2.6vh;color:var(--mut);font-size:clamp(.85rem,1.15vw,1rem)\">Màn hình phê duyệt là <b style=\"color:var(--ink)\">tính năng<\/b>, không phải thủ tục — đọc nó định làm gì trước khi gật đầu. Đừng để thói quen “bấm cho qua” hình thành.<\/p>\n    <div class=\"ticker frag\">\n      <span><b>Canvas<\/b> → khối soạn thảo trong chat · 28.05.2026<\/span>\n      <span><b>agent mode<\/b> → ChatGPT Work · 2026<\/span>\n      <span><b>Atlas<\/b> → trình duyệt trong ChatGPT · 08/2026<\/span>\n      <span style=\"color:var(--gold)\">Tên đổi nhanh — tư duy ở lại.<\/span>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 27 SIX QUESTIONS ═══════════ -->\n<section class=\"scene\" id=\"s-sixq\" data-label=\"Gói mang về\">\n  <div class=\"wrap wide\">\n    <div class=\"kicker\" data-anim>Gói mang về — không phải mẫu prompt, mà là 6 câu tự kiểm<\/div>\n    <div class=\"qlist\">\n      <div class=\"qi frag\"><span class=\"n\">1<\/span><span class=\"q\">Người nhận việc này cần biết gì <b>mà chỉ mình tôi biết?<\/b><\/span><\/div>\n      <div class=\"qi frag\"><span class=\"n\">2<\/span><span class=\"q\">“Đạt” nghĩa là gì?<small>độ dài · giọng · ai đọc · họ soi chỗ nào<\/small><\/span><\/div>\n      <div class=\"qi frag\"><span class=\"n\">3<\/span><span class=\"q\">Điều gì <b>tuyệt đối không<\/b> được xảy ra?<\/span><\/div>\n      <div class=\"qi frag\"><span class=\"n\">4<\/span><span class=\"q\">Nó được <b>tự quyết tới đâu<\/b> trước khi quay lại hỏi tôi?<\/span><\/div>\n      <div class=\"qi frag\"><span class=\"n\">5<\/span><span class=\"q\">Tôi có đang dạy nó cách làm <b>một việc nó giỏi hơn tôi<\/b> không?<\/span><\/div>\n      <div class=\"qi frag\"><span class=\"n\">6<\/span><span class=\"q\">Việc này đáng để máy <b>nghĩ sâu đến đâu?<\/b><\/span><\/div>\n    <\/div>\n    <p class=\"anti frag\">Mẫu prompt là brief của người khác — <strong>mượn được, không vừa.<\/strong> Câu hỏi tự kiểm thì thành của bạn, đi theo bạn qua mọi model, mọi lần đổi tên sản phẩm.<\/p>\n  <\/div>\n<\/section>\n\n<!-- ═══════════ 28 CLOSE ═══════════ -->\n<section class=\"scene\" id=\"s-close\" data-fx=\"zoom\" data-label=\"Kết\">\n  <div class=\"wrap\">\n    <h1 class=\"display\"><span class=\"ln\"><span style=\"--d:.15s\">Máy sẽ còn đổi thế hệ<\/span><\/span><span class=\"ln\"><span style=\"--d:.3s\">nhiều lần nữa.<\/span><\/span><\/h1>\n    <div class=\"final frag\">Người biết nói rõ mình muốn gì —<br>thì thế hệ nào cũng quý.<\/div>\n    <div class=\"cred\" data-anim style=\"--d:.4s\">\n      <b>«Nhân Viên Xuất Sắc Chưa Biết Gì Về Bạn»<\/b><br>\n      Bộ guide 13 chương · nguồn: công bố chính chủ OpenAI &amp; Anthropic · chốt tại 08/2026<br>\n      Khi output dở — hỏi cái brief trước khi trách người nhận brief.\n    <\/div>\n  <\/div>\n<\/section>\n\n<\/div>\n\n<!-- overview -->\n<div id=\"toc\">\n  <div class=\"in\">\n    <div class=\"th\">Mục lục buổi giảng<\/div>\n    <div id=\"toclist\"><\/div>\n    <div class=\"tclose\">G hoặc ESC để đóng · click để nhảy tới<\/div>\n  <\/div>\n<\/div>\n\n<script>\n(function(){\n  const scenes=[...document.querySelectorAll('.scene')];\n  const total=scenes.length;\n  document.getElementById('total').textContent=String(total).padStart(2,'0');\n  let i=0, started=false;\n\n  // build toc\n  const toclist=document.getElementById('toclist');\n  scenes.forEach((s,n)=>{\n    const a=document.createElement('a');\n    a.href='#'+(n+1);\n    a.innerHTML='<span class=\"tn\">'+String(n+1).padStart(2,'0')+'<\/span><span>'+(s.dataset.label||'—')+'<\/span>';\n    a.onclick=e=>{e.preventDefault();go(n);toggleToc(false);};\n    toclist.appendChild(a);\n  });\n\n  function frags(s){return [...s.querySelectorAll('.frag')];}\n  function shown(s){return frags(s).filter(f=>f.classList.contains('on'));}\n\n  function paint(){\n    scenes.forEach((s,n)=>{\n      s.classList.toggle('active',n===i);\n      s.classList.toggle('past',n<i);\n    });\n    const cur=scenes[i];\n    document.body.dataset.theme=cur.dataset.theme||'';\n    document.getElementById('progress').style.width=((i)/(total-1))*100+'%';\n    document.getElementById('counter').innerHTML='<b>'+String(i+1).padStart(2,'0')+'<\/b> / '+String(total).padStart(2,'0');\n    document.getElementById('seclabel').textContent=cur.dataset.label||'';\n    if(location.hash!=='#'+(i+1)) history.replaceState(null,'','#'+(i+1));\n    document.body.classList.toggle('hidehint',i>0);\n  }\n\n  function go(n){\n    i=Math.max(0,Math.min(total-1,n));\n    // reset frags of scenes after current; keep past scenes' frags shown\n    scenes.forEach((s,k)=>{ if(k>=i&&k!==i) frags(s).forEach(f=>f.classList.remove('on')); });\n    if(i===0) frags(scenes[0]).forEach(f=>f.classList.remove('on'));\n    paint();\n  }\n\n  window.next=function(){\n    const s=scenes[i], fs=frags(s), sh=shown(s);\n    if(sh.length<fs.length){ fs[sh.length].classList.add('on'); return; }\n    if(i<total-1){ i++; frags(scenes[i]).forEach(f=>f.classList.remove('on')); paint(); }\n  };\n  window.prev=function(){\n    const s=scenes[i], sh=shown(s);\n    if(sh.length>0){ sh[sh.length-1].classList.remove('on'); return; }\n    if(i>0){ i--; frags(scenes[i]).forEach(f=>f.classList.add('on')); paint(); }\n  };\n\n  function toggleToc(force){\n    const t=document.getElementById('toc');\n    const open=force!==undefined?force:!t.classList.contains('open');\n    t.classList.toggle('open',open);\n  }\n\n  document.addEventListener('keydown',e=>{\n    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();}\n    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}\n    else if(e.key==='Home'){go(0);}\n    else if(e.key==='End'){go(total-1);}\n    else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}\n    else if(e.key==='g'||e.key==='G'){toggleToc();}\n    else if(e.key==='Escape'){toggleToc(false);}\n  });\n\n  // click zones (ignore links/toc)\n  document.getElementById('stage').addEventListener('click',e=>{\n    if(e.target.closest('a,button,#toc')) return;\n    const x=e.clientX/innerWidth;\n    x<0.18?prev():next();\n  });\n\n  // touch swipe\n  let tx=null;\n  addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});\n  addEventListener('touchend',e=>{\n    if(tx===null)return;\n    const dx=e.changedTouches[0].clientX-tx;\n    if(Math.abs(dx)>50) dx<0?next():prev();\n    tx=null;\n  },{passive:true});\n\n  // deep link\n  const h=parseInt((location.hash||'').slice(1));\n  if(h>=1&&h<=total){ i=h-1; scenes.slice(0,i).forEach(s=>frags(s).forEach(f=>f.classList.add('on'))); }\n  paint();\n})();\n<\/script>\n<\/body>\n<\/html>\n";
let deckURL=null;
function openDeck(){
  const ov=document.getElementById("deckover");
  const fr=document.getElementById("deckframe");
  if(!deckURL){deckURL=URL.createObjectURL(new Blob([DECK_SRC],{type:"text/html"}));}
  if(!fr.src)fr.src=deckURL;
  ov.classList.add("open");
  setTimeout(()=>{try{fr.contentWindow.focus();}catch(e){}},80);
}
function closeDeck(){document.getElementById("deckover").classList.remove("open");if(document.fullscreenElement)document.exitFullscreen();}
function deckFull(){const ov=document.getElementById("deckover");(ov.requestFullscreen?ov.requestFullscreen():null);setTimeout(()=>{try{document.getElementById("deckframe").contentWindow.focus();}catch(e){}},120);}

/* ================= chrome ================= */
addEventListener("scroll",()=>{
  const h=document.documentElement;
  const p=h.scrollTop/(h.scrollHeight-h.clientHeight||1);
  document.getElementById("rprog").style.width=(p*100)+"%";
});
addEventListener("keydown",e=>{
  if(document.getElementById("deckover").classList.contains("open")){if(e.key==="Escape")closeDeck();return;}
  if(cur>=0){
    if(e.key==="ArrowRight")stepCh(1);
    else if(e.key==="ArrowLeft")stepCh(-1);
    else if(e.key==="Escape")goHome();
  }
});

/* ================= boot ================= */
buildMenu();buildRail();
(function(){
  const m=(location.hash||"").match(/^#c\/(\d+)$/);
  if(m&&+m[1]<CH.length)openCh(+m[1]);
})();
</script>
