<style>

# Mở đầu — Guide này là gì và dùng thế nào

*Trong phần mở đầu này, bạn sẽ biết guide này dành cho ai, vì sao nó cố tình không phát "mẫu prompt thần thánh" nào, và ba cách dùng nó tùy bạn là người đọc, người dạy hay người đang bí giữa chừng công việc.*

## Guide này dành cho ai

Nếu bạn là dân văn phòng — marketing, sales, pháp lý, tài chính, vận hành — và đã từng mở ChatGPT hay Claude nhờ viết hộ cái email, tóm tắt hộ cái biên bản, thì guide này viết cho bạn. Không cần biết lập trình. Chỉ cần từng nhận về một output khiến bạn nhíu mày "ơ, sao nó không hiểu ý mình nhỉ?"

Cái nhíu mày đó là điểm xuất phát của cả cuốn này. Vì phần lớn trường hợp, vấn đề không ở chỗ máy kém — mà ở chỗ cách giao việc của chúng ta đang lệch thế hệ so với máy.

## Luận điểm một câu

Toàn bộ guide đứng trên một luận điểm: AI đã thành **một nhân viên cực kỳ xuất sắc nhưng chưa biết gì về bạn** — và khi nhân viên đổi đẳng cấp, cách giao việc phải đổi theo.

Đây không phải phép ví von tôi tự nghĩ ra cho vui. Chính Anthropic khuyên người dùng hình dung đúng như vậy (tính đến 08/2026): "Think of Claude as a brilliant but new employee who lacks context on your norms and workflows" — hãy coi Claude như một nhân viên xuất sắc nhưng mới toanh, chưa biết gì về nề nếp và quy trình của bạn. Nó giỏi hơn bạn ở khối kỹ năng, nhưng nghèo tuyệt đối một thứ — bối cảnh về bạn, công ty bạn, khẩu vị của bạn. Nghệ thuật giao tiếp với AI, suy cho cùng, là chuyển giao bối cảnh và tiêu chí nghiệm thu — không phải đọc cho nó chép từng bước.

## Vì sao dạy tư duy, không phát công thức

Bạn có thể hỏi: sao không đưa luôn 50 mẫu prompt xịn cho nhanh? Vì hai lẽ. Một, mẫu prompt già đi rất nhanh — nhiều mẹo từng là "chân lý" năm 2023 giờ đã hết thiêng, thậm chí phản tác dụng (xem Chương 2). Hai, quan trọng hơn: tiêu chí cuối cùng của một output tốt là "hợp với MÌNH" — hợp giọng của bạn, sếp của bạn, khách của bạn. Không ai viết sẵn công thức cho khẩu vị của người khác, cũng như không ai nêm hộ được nồi canh nhà bạn.

Nên guide này dạy cách nghĩ: tình huống nào giao kiểu nào, dấu hiệu nào cho thấy đang chỉnh sai hướng. Mọi ví dụ trong sách là gợi ý để bạn thử trên việc thật của mình — không phải đáp án để chép.

## Trong này có gì: 10 chương + 2 phụ lục

- **Chương 1 — Bức tranh 2026:** bạn đang giao việc cho "ai" — model mới khác gì thế hệ trước.
- **Chương 2 — Vì sao những mẹo prompt cũ hết thiêng:** khảo cổ từng mẹo 2023–2024, mẹo nào nên bỏ và vì sao.
- **Chương 3 — Nhân viên xuất sắc chưa biết gì về bạn:** trái tim tư duy của guide — bối cảnh, mục tiêu, tiêu chí nghiệm thu.
- **Chương 4 — Nghệ thuật liều lượng:** 5 cái nút không vạch chuẩn — lúc nào cần chi tiết, lúc nào cần buông.
- **Chương 5 — Thực chiến research:** giao việc tìm hiểu, tổng hợp thông tin sao cho ra đồ dùng được.
- **Chương 6 — Thực chiến review:** nhờ AI phản biện văn bản — và cách để được chê thật.
- **Chương 7 — Thực chiến soạn thảo:** viết email, báo cáo mang đúng giọng của bạn.
- **Chương 8 — Làm việc theo vòng:** từ ra một lệnh sang cộng tác nhiều nhịp, rồi đóng gói thành quy trình.
- **Chương 9 — AI làm gương:** dùng AI để chính bạn giỏi lên, không phải để lười đi.
- **Chương 10 — Nâng cao:** cùng một tư duy, nhiều bề mặt làm việc — từ chat tới công cụ agentic.
- **Phụ lục A:** giáo án buổi giảng ~4,5 tiếng cho người cầm guide đi dạy.
- **Phụ lục B:** bộ câu hỏi tự kiểm trước khi giao việc + FAQ hay gặp ở lớp học Việt Nam.

## Ba cách dùng

**Đọc như một cuốn sách mỏng.** Các chương xếp theo mạch: hiểu máy → gỡ thói quen cũ → dựng tư duy mới → thực chiến → nâng cấp. Đọc tuần tự trọn vẹn nhất, tầm vài buổi tối.

**Dạy theo giáo án.** Cần đứng lớp thì Phụ lục A đã chia sẵn khung ~4,5 tiếng: khối nào demo gì, bài tập gì. Các chương thực chiến (5–7) đều mở bằng một "thí nghiệm mở màn" thiết kế để chạy sống trước lớp.

**Tra cứu khi bí.** Output dở không biết vì đâu — mở Chương 3 và Phụ lục B. Không biết nên chi tiết đến mức nào — Chương 4. Việc lặp đi lặp lại mãi — Chương 8.

## Hai lời dặn trước khi vào sách

**Về tính thời sự.** Thông tin model và tính năng trong guide chốt tại 08/2026. Tên model sẽ đổi — có khi ngay quý sau — nhưng tư duy giao việc bền hơn nhiều: máy càng giỏi, phần bối cảnh và tiêu chí bạn nắm giữ càng quyết định.

**Về sự trung thực của ví dụ.** Các "output minh họa" trong guide là mô tả pattern điển hình — kiểu kết quả bạn thường nhận về — không phải log chép nguyên văn. Model mỗi lần chạy mỗi khác; bởi vậy nếu đi dạy, hãy chạy demo sống thay vì chiếu ảnh chụp màn hình, để học viên thấy cả cái hay lẫn cái trồi sụt thật.

## Điều cốt lõi

- AI nay như một nhân viên xuất sắc chưa biết gì về bạn — giao việc kiểu cũ là phí một nhân viên giỏi.
- Guide dạy tư duy giao việc, không phát mẫu prompt — vì tiêu chí cuối cùng là output hợp với chính bạn.
- Ba cách dùng: đọc tuần tự, dạy theo giáo án Phụ lục A, hoặc tra cứu khi bí.
- Thông tin sản phẩm chốt tại 08/2026; tên model sẽ đổi, tư duy thì bền.
- Mọi ví dụ là lời mời thử trên việc thật của bạn, không phải đáp án.

# Chương 1 — Bức tranh 2026: bạn đang nói chuyện với ai?

*Trong chương này, chúng ta cùng chụp một tấm ảnh toàn cảnh: đến tháng 8/2026, khi bạn mở ChatGPT hay Claude, phía bên kia màn hình thật ra là "ai"? Bạn không cần thuộc lòng bảng tên model — nhưng cần nắm được ba thay đổi lớn khiến người nhận việc của bạn hôm nay khác hẳn người nhận việc năm 2023.*

## Trước khi giao việc, hãy nhìn mặt người nhận việc

Ở công ty, trước khi giao việc cho ai đó, bạn thường biết sơ sơ về họ: người này mới ra trường hay đã mười năm kinh nghiệm, cẩn thận hay ẩu, giỏi số liệu hay giỏi chữ nghĩa. Không ai giao việc cho một cái bóng.

Với AI, phần lớn chúng ta lại đang làm đúng điều đó: mở app lên, gõ yêu cầu, và không hề biết "người" đang nhận việc thuộc thế hệ nào, đang ở chế độ nào, giỏi lên bao nhiêu so với lần cuối mình để ý. Trong khi đó, giai đoạn 2025–2026 là giai đoạn các model đổi thế hệ nhanh đến mức chóng mặt — và quan trọng hơn: đổi cả *tính cách làm việc*, chứ không chỉ đổi tên.

Chương này không nhằm biến bạn thành người thuộc catalog sản phẩm. Nó nhằm một việc thực dụng hơn: khi bạn hiểu người bên kia đã thay đổi thế nào, bạn sẽ hiểu vì sao cách giao việc của mình cũng phải thay đổi theo — đó là câu chuyện của toàn bộ phần còn lại của guide.

## Phía OpenAI: câu hỏi mới không phải "model nào" mà là "nghĩ kỹ cỡ nào"

Tính đến 08/2026, dòng flagship mới nhất của OpenAI là gia đình **GPT-5.6**, chính thức phát hành rộng rãi ngày 09/07/2026 sau giai đoạn preview. Gia đình này có ba thành viên: **Sol** — bản flagship mạnh nhất, **Terra** — bản cân bằng cho công việc hằng ngày, và **Luna** — bản tiết kiệm chi phí nhất. Trước đó một thế hệ là **GPT-5.5**, ra mắt 23/04/2026.

Nhưng đây mới là điều đáng để dân văn phòng dừng lại: khi bạn mở ChatGPT, cái menu chọn model quen thuộc đã không còn hiển thị tên model thô nữa. Nó hiển thị **mức nỗ lực suy nghĩ**: Instant / Medium / High / Extra High / Pro. Mặc định cho các câu trả lời nhanh vẫn là GPT-5.5 Instant; còn khi bạn chọn Medium, High hay Extra High thì GPT-5.6 Sol đứng ra nhận việc, và mức Pro do GPT-5.6 Sol Pro đảm nhiệm. Hai người em Terra và Luna thì không xuất hiện trong hội thoại chat thông thường — họ làm việc ở các bề mặt khác như Work in ChatGPT, Codex và API.

Thêm một chi tiết thú vị: trên các gói trả phí đủ điều kiện, ChatGPT có **auto-routing** — gặp yêu cầu đủ phức tạp, nó tự động nâng từ Instant lên Medium mà không cần bạn nhấc tay (tính năng này bật/tắt được trong phần Configure). Nói cách khác, chính hãng cũng thừa nhận: người dùng thường *đánh giá thấp* độ phức tạp của việc mình giao.

Việc phân quyền theo gói cũng xoay quanh trục "mức suy nghĩ" này: gói Free và Go chưa có GPT-5.6; gói Plus được dùng Medium và High; các gói Pro, Business, Enterprise mở thêm Extra High và Pro. Trên cả các mức trong picker, dòng GPT-5.6 còn có hai chế độ compute mới tên là **max** và **ultra** dành cho công việc đòi hỏi nhất — trong đó ultra, theo công bố của OpenAI, mặc định điều phối bốn agent (chương trình AI tự làm việc nhiều bước) chạy song song, chấp nhận tốn nhiều token hơn để đổi lấy kết quả mạnh hơn trên các việc khó. Bạn không cần dùng tới chúng; chỉ cần biết cái thang "nghĩ sâu đến đâu" giờ đã dài đến vậy.

Bạn để ý sự dịch chuyển chưa? Câu hỏi khi mở ChatGPT không còn là "chọn model nào" — mà là "**việc này đáng để máy nghĩ sâu đến đâu?**". Đó là một câu hỏi kiểu quản lý, không phải kiểu kỹ thuật. Một câu hỏi mà bạn — người giao việc — mới là người trả lời được.

Còn về năng lực? Khi ra mắt GPT-5.5, OpenAI định vị nó bằng một câu rất đáng đọc chậm: bạn có thể giao cho nó "a messy, multi-part task and trust it to plan, use tools, check its work, navigate through ambiguity, and keep going" — một việc bừa bộn, nhiều phần, và tin rằng nó sẽ tự lập kế hoạch, dùng công cụ, tự kiểm tra kết quả, tự xoay xở qua chỗ mơ hồ và làm tiếp cho đến xong. Sang GPT-5.6, các bước tiến được quảng bá — theo công bố của OpenAI — tập trung vào việc agentic dài hơi, khả năng nhìn-và-tinh-chỉnh kết quả hiển thị chứ không chỉ sinh ra code hay nội dung thô, và làm tài liệu, slide, bảng tính bám template tốt hơn. Hãy ghi nhớ cụm "việc bừa bộn, nhiều phần" — nó sẽ quay lại ở cuối chương.

## Một đám tang lặng lẽ: thời GPT-4 chính thức khép lại

Có một mốc rất đáng kể mà ít người để ý. Ngày 13/02/2026, OpenAI cho "nghỉ hưu" GPT-4o, GPT-4.1 và o4-mini khỏi ChatGPT. GPT-4.5 theo chân ngày 27/06/2026, và o3 được hẹn ngày 26/08/2026.

Vì sao chuyện này quan trọng với bạn? Vì GPT-4o chính là "con AI" mà phần lớn dân văn phòng Việt Nam đã dùng, đã quen tay, và — quan trọng nhất — đã *học các mẹo* trên đó. Những buổi training nội bộ năm 2023–2024, những file "100 mẫu prompt hay" được chuyền tay nhau trên Zalo, đều được viết cho một thế hệ máy nay đã không còn tồn tại trong sản phẩm.

Tưởng tượng bạn có một bộ bí kíp làm việc với chị kế toán cũ — nào là phải nhắc ba lần, phải in đậm chỗ quan trọng, phải làm mẫu cho chị xem trước. Rồi chị nghỉ hưu, công ty tuyển về một người hoàn toàn khác. Bộ bí kíp ấy giờ nên làm gì? Đó chính xác là câu hỏi của Chương 2 — ở đây, ta chỉ cần ghi nhận sự kiện: thế hệ cũ đã rời sân khấu, một cách chính thức và có ngày giờ cụ thể.

## Phía Anthropic: nhà Claude mọc thêm tầng trên cùng

Bên kia chiến tuyến — à không, guide này trung lập, bên kia *thị trường* — Anthropic cũng vừa trải qua một mùa hè dày đặc sự kiện.

Ngày 09/06/2026, Anthropic phát hành cặp model **Claude Fable 5** và **Claude Mythos 5**, mở ra một tier hoàn toàn mới gọi là "Mythos-class", đứng trên cả dòng Opus vốn là đỉnh bảng trước đó. Hai model chung kiến trúc nhưng khác cơ chế an toàn: Fable 5 là bản phổ cập cho mọi người, còn Mythos 5 gỡ một số lớp safeguard và chỉ dành cho các đối tác được ủy quyền. Về Fable 5, Anthropic viết: "Fable 5's capabilities exceed those of any model we've ever made generally available" — năng lực của Fable 5 vượt mọi model mà hãng từng đưa ra công chúng. Hành trình của nó cũng không phẳng lặng: từng bị tạm ngừng giữa tháng 6 do quy định kiểm soát xuất khẩu của chính phủ Mỹ, rồi được triển khai lại toàn cầu ngày 01/07/2026 — một lát cắt nhỏ cho thấy chuyện model AI giờ đã là chuyện tầm chính sách quốc gia, không còn là đồ chơi công nghệ.

Gần với đời sống văn phòng hơn là hai cái tên còn lại. **Claude Sonnet 5** ra mắt 30/06/2026 và là model mặc định cho gói Free và Pro trên claude.ai — tức nhiều khả năng đây chính là "người" bạn gặp khi mở Claude lên. Anthropic mô tả nó bằng một câu ngắn mà đắt: "It finishes complex tasks where previous Sonnet models would stop short" — nó làm *xong* những việc phức tạp mà các đời Sonnet trước sẽ bỏ dở giữa chừng. Còn **Claude Opus 5**, ra mắt 24/07/2026, được hãng định vị — theo công bố của Anthropic — là model "chu đáo và chủ động", tiến gần trí tuệ hàng đầu của Fable 5 với chi phí chỉ một nửa, kèm chế độ Fast chạy nhanh hơn khoảng 2,5 lần.

Xếp lại cho dễ hình dung, thang năng lực nhà Claude đến 08/2026, từ cao xuống thấp: Mythos 5 (hạn chế đối tác) → Fable 5 → Opus 5 → Sonnet 5 → Haiku 4.5. Bạn không cần nhớ chính xác thang này — chỉ cần nhớ rằng nó *tồn tại*, và người bạn gặp mặc định (Sonnet 5) đã là một nhân viên thuộc thế hệ "làm xong việc khó", chứ không phải thế hệ "trả lời câu hỏi".

## Ba điều cần mang theo khỏi chương này

Nếu bức tranh trên hơi nhiều tên riêng, đừng lo — tên riêng rồi sẽ đổi. Ba điều dưới đây mới là thứ bền.

**Thứ nhất: "biết nghĩ trước khi làm" đã thành mặc định.** Các model chủ lực của cả hai hãng nay đều là reasoning model (model suy luận — loại máy tự lập kế hoạch, tự cân nhắc bên trong trước khi viết ra câu trả lời). Nó không còn là con vẹt phản xạ chữ; nó là người ngồi nghĩ một lúc rồi mới bắt tay. Điều này thay đổi tận gốc cách bạn nên nói chuyện với nó — Chương 2 sẽ cho thấy nhiều mẹo cũ sinh ra chỉ để *bù* cho việc máy ngày xưa không biết nghĩ.

**Thứ hai: bạn đang chọn mức suy nghĩ, không chỉ chọn model.** Cái picker Instant→Pro của ChatGPT là ví dụ rõ nhất: quyết định của người dùng giờ giống quyết định của một người sếp — việc này cần nghĩ nhanh hay nghĩ sâu, đáng bao nhiêu thời gian và chi phí. Máy càng nhiều "số", người cầm lái càng cần biết mình đang đi đường nào — cuối Chương 4 sẽ đưa cho bạn cách chọn số theo từng việc.

**Thứ ba: cả hai hãng đang nói cùng một câu, bằng hai giọng.** OpenAI nói bạn có thể tin giao "việc bừa bộn, nhiều phần". Anthropic nói model của họ "làm xong những việc mà thế hệ trước bỏ dở". Dịch sang ngôn ngữ văn phòng: người nhận việc của bạn đã đủ sức nhận việc **dài hơn và mơ hồ hơn** — loại việc trước đây bạn phải tự xé nhỏ, nhai kỹ rồi mới dám đưa máy từng miếng.

Và chính điều thứ ba này tạo ra một nghịch lý thú vị: máy đã lên thế hệ mới, nhưng thói quen giao việc của rất nhiều người trong chúng ta vẫn đang ở thế hệ cũ — vẫn xé nhỏ, vẫn nhắc ba lần, vẫn viết hoa chỗ quan trọng, vẫn đọc cho máy chép từng bước. Giống như công ty vừa tuyển được một chuyên viên xuất sắc, mà ta vẫn đối xử như với thực tập sinh năm nhất. Chuyện gì xảy ra khi làm vậy — và vì sao nó không chỉ vô ích mà đôi khi còn *phản tác dụng* — là câu chuyện của Chương 2.

## Điều cốt lõi

- Đến 08/2026, cả OpenAI (gia đình GPT-5.6: Sol/Terra/Luna) và Anthropic (Fable 5, Opus 5, Sonnet 5) đều đã bước sang thế hệ model mới; thời GPT-4 đã chính thức khép lại từ đầu năm 2026.
- Model picker của ChatGPT nay hiển thị mức nỗ lực suy nghĩ (Instant→Pro) chứ không phải tên model — câu hỏi của người dùng chuyển từ "chọn model nào" sang "việc này đáng nghĩ sâu đến đâu".
- Reasoning — máy tự lập kế hoạch trước khi trả lời — đã là mặc định, không còn là tính năng cao cấp.
- Cả hai hãng cùng công bố model mới làm được việc dài hơn, mơ hồ hơn — nghĩa là cách giao việc kiểu "xé nhỏ, cầm tay chỉ việc" đang lệch pha với người nhận việc.
- Tên model sẽ còn đổi; ba dịch chuyển trên thì bền — và chúng là nền cho toàn bộ guide này.

# Chương 2 — Vì sao những mẹo prompt cũ hết thiêng

*Trong chương này, chúng ta sẽ làm một chuyến "khảo cổ" các mẹo prompt từng được truyền tay nhau giai đoạn 2023–2024 — để hiểu mỗi mẹo ra đời nhằm bù cho khuyết điểm nào của model đời cũ, khuyết điểm đó giờ còn không, và nếu không còn thì ta nên làm gì thay thế. Bạn sẽ thấy: nhiều mẹo không chỉ hết tác dụng, mà theo chính lời hai hãng, còn có thể làm output kém đi.*

## Mỗi mẹo là một miếng vá

Nếu bạn từng đi học một lớp "prompt engineering" quãng 2023–2024, hoặc từng lưu về một tấm ảnh "10 câu thần chú dùng ChatGPT", thì trong đầu bạn chắc vẫn còn vài câu quen thuộc: "Hãy suy nghĩ từng bước". "Bạn là chuyên gia 20 năm kinh nghiệm". "CỰC KỲ QUAN TRỌNG, TUYỆT ĐỐI PHẢI...". Tôi cũng từng dạy y những câu đó, nói thật.

Và hồi đó, chúng có tác dụng thật — các mẹo này không phải mê tín. Mỗi mẹo là một miếng vá, vá đúng vào một lỗ hổng có thật của model thời ấy. Model hay trả lời vội? Vá bằng "suy nghĩ từng bước". Model hay bỏ qua chỉ dẫn? Vá bằng VIẾT HOA.

Vấn đề là: áo đã thay rồi mà ta vẫn cầm miếng vá cũ. Như Chương 1 đã kể, cả hai hãng đều đã sang thế hệ model mới, lỗ hổng cũ nhiều cái đã lành. Và miếng vá dán lên chỗ da lành thì không vô hại — nó vướng. Giờ ta đi từng mẹo một.

## «Hãy suy nghĩ từng bước» và chuyện đóng vai chuyên gia

Mẹo "think step by step" ra đời vì model đời cũ có tật trả lời kiểu học sinh làm bài phút chót: chưa nghĩ xong đã viết, nhảy cóc, sai ở bước giữa. Bắt nó viết lập luận ra từng bước là ép nó đi chậm lại — và chất lượng lên thật.

Nhưng các model chủ lực hiện nay (tính đến 08/2026) là reasoning model — loại model tự lập luận bên trong trước khi trả lời bạn, như người cầm giấy nháp riêng. Chính OpenAI viết trong hướng dẫn chính chủ: "Since these models perform reasoning internally, prompting them to 'think step by step' or 'explain your reasoning' is unnecessary" — model đã tự suy luận bên trong, nhắc "suy nghĩ từng bước" hay "giải thích lập luận" là không cần thiết, thậm chí có thể phản tác dụng. Bạn đang dặn một người có thói quen nháp rất kỹ: "nhớ nháp nhé". Nhẹ thì thừa; nặng thì họ tưởng bạn muốn xem cả tờ nháp, và bạn nhận về bài trả lời dài gấp ba nhu cầu.

Vậy giờ làm gì? Nếu bạn thật sự cần *nhìn thấy* lập luận — ví dụ để trình bày cho sếp vì sao chọn phương án A — cứ nói thẳng nhu cầu đó. Đó là yêu cầu về *sản phẩm đầu ra*, không phải mẹo kích não.

Người anh em của mẹo này là màn đóng vai: "Bạn là chuyên gia tài chính 20 năm kinh nghiệm...". Mẹo này từng ăn tiền vì model cũ hay trả lời làng nhàng kiểu trung bình cộng; gán một cái vai oách là cách kéo nó về vùng từ vựng và giọng điệu chuyên môn. Model nay tự bắt sóng ngữ cảnh tốt hơn nhiều: bạn đưa bản hợp đồng và hỏi về rủi ro, nó tự hiểu phải nói chuyện ở trình độ nào. Cái vai không còn "tăng IQ" cho model nữa.

Nhưng khoan vứt hẳn mẹo này. Vai vẫn đáng dùng khi nó thay đổi *góc nhìn* chứ không phải trình độ: "hãy đọc kế hoạch này như đối tác đang tìm cớ ép giá" cho ra một kiểu góp ý khác hẳn "hãy đọc như sếp tôi". Đó không phải phép bơm thông minh — đó là chỉ định lăng kính. Chương 6 sẽ khai thác kỹ chỗ này khi bàn về review văn bản.

## VIẾT HOA, dọa nạt, và nhồi ví dụ

Thời model cũ, chỉ dẫn hay bị trôi: dặn ba điều thì nó làm hai. Thế là dân tình học cách hét: VIẾT HOA, "CỰC KỲ QUAN TRỌNG", "TUYỆT ĐỐI KHÔNG BAO GIỜ", có người còn dọa trừ lương hoặc hứa tip. Đây là chỉnh âm lượng bằng cách gào vào micro — hợp lý khi micro rè.

Micro giờ không rè nữa. OpenAI mô tả GPT-5 (tính đến 08/2026) tuân thủ chỉ dẫn "with surgical precision" — chính xác như dao mổ. Còn Anthropic viết hẳn vào tài liệu chính chủ lời khuyên gỡ mẹo này: "Where you might have said \"CRITICAL: You MUST use this tool when...\", you can use more normal prompting like \"Use this tool when...\"" — chỗ trước kia phải viết "QUAN TRỌNG: BẮT BUỘC phải...", giờ chỉ cần nói bình thường "Hãy dùng... khi...". Họ còn cảnh báo chiều ngược: những câu ép kiểu "If in doubt, use [tool]" — cứ phân vân thì dùng công cụ này — vốn chữa bệnh *làm thiếu* của model cũ, nay gây bệnh *làm thừa*: model mới nghe lời đến mức bạn hét cái gì nó làm quá cái đó. Hét "LUÔN LUÔN phải có số liệu" là số liệu sẽ được nhét cả vào chỗ không cần.

Cách thay thế đơn giản đến bất ngờ: nói một lần, rõ ràng, bằng giọng bình thường. Nếu một điều thật sự hệ trọng, thay vì tăng cỡ chữ, hãy nói *lý do* nó hệ trọng — "báo cáo này gửi thẳng cho khách, nên tuyệt đối không được có số liệu chưa kiểm" thuyết phục model hơn mọi cái caps lock. (Cho công bằng, có một ngoại lệ có địa chỉ: chính tài liệu Claude Code ghi nhận rằng trong *file hướng dẫn nền* dài cho agent — kiểu CLAUDE.md — thêm nhấn mạnh như "IMPORTANT" vẫn có thể cải thiện độ tuân thủ. Đó là chuyện của file cấu hình nền, không phải giấy phép quay lại caps lock trong lời giao việc hằng ngày.)

Mẹo thứ tư cùng nhà: nhồi ví dụ mẫu — dân trong nghề gọi là few-shot (đưa vài cặp "đề bài → đáp án mẫu" để model bắt chước). Từng là mẹo quý, vì model cũ nhìn ví dụ mới hiểu ý. Với reasoning model, chính OpenAI khuyên: "Reasoning models often don't need few-shot examples to produce good results, so try to write prompts without examples first" — thường không cần ví dụ mẫu nữa, hãy thử viết prompt không ví dụ trước đã. Chú ý chữ "thử... trước": đây không phải lệnh cấm. Đưa văn bản mẫu để truyền *taste* — giọng văn của bạn, format công ty bạn — vẫn là nước đi rất giá trị (Chương 7 sẽ nói kỹ). Khác biệt nằm ở mục đích: ví dụ để truyền khẩu vị thì vẫn quý; ví dụ để dạy model hiểu đề thì phần lớn đã thừa.

## Prompt dài như hợp đồng — và cái twist ít ai ngờ

Mẹo thứ năm sinh ra từ nỗi sợ: sợ model làm sai nên liệt kê mọi trường hợp, mọi ngoại lệ, thành những prompt dài như hợp đồng bảo hiểm, copy từ dự án này sang dự án khác, mỗi lần gặp lỗi lại đắp thêm một điều khoản.

Ba tài liệu chính chủ cùng chĩa vào mẹo này. Một: với Claude Fable 5 (tính đến 08/2026), Anthropic viết "Instruction-following is improved enough that you can steer most behaviors with a brief instruction rather than enumerating each behavior by name" — độ nghe lời đã tốt tới mức một chỉ dẫn ngắn lái được hầu hết hành vi, không cần liệt kê từng thứ. Hai: trong tài liệu Claude Code, họ cảnh báo thẳng "Bloated CLAUDE.md files cause Claude to ignore your actual instructions!" — file hướng dẫn phình to khiến model bỏ qua chính những chỉ dẫn bạn cần nhất. Nghịch lý quen thuộc với ai từng viết quy trình nội bộ: sổ tay 80 trang là sổ tay không ai đọc.

Và ba — cái twist đắt giá nhất chương này. OpenAI viết về GPT-5: "poorly-constructed prompts containing contradictory or vague instructions can be more damaging to GPT-5 than to other models, as it expends reasoning tokens searching for a way to reconcile the contradictions…" — prompt chứa chỉ dẫn mâu thuẫn hoặc mơ hồ gây hại cho GPT-5 *nhiều hơn* các model trước, vì nó đốt công suy luận tìm cách dung hòa mâu thuẫn. Nghĩa là: model mới đọc kỹ đến mức thấy cả những mâu thuẫn bạn không thấy. Cái prompt-hợp-đồng đắp qua ba đời dự án gần như chắc chắn có chỗ điều 7 cãi nhau với điều 12 — model cũ lười đọc nên thoát nạn, model mới đọc hết nên lãnh đủ. Càng chăm vá, tấm áo càng nặng.

Mẹo cuối cùng, ngắn thôi: prefill — mồi sẵn mấy chữ đầu của câu trả lời để ép model viết tiếp theo hướng đó, một mẹo dân kỹ thuật chuộng một thời. Anthropic nay ghi rõ: "Model intelligence and instruction following have advanced such that most use cases of prefill no longer require it" — trí năng và độ nghe lời của model đã tiến xa tới mức hầu hết trường hợp không còn cần mồi nữa. Muốn output mở đầu kiểu gì, mô tả thẳng là được.

## Bằng chứng chính chủ: mẹo cũ không chỉ thừa, mà có thể gây hại

Đọc đến đây có thể bạn nghĩ: thừa thì kệ, để đó có sao đâu. Đây là chỗ cả hai hãng nói: có sao đấy.

Anthropic, trong tài liệu về Claude Fable 5: "Skills developed for prior models are often too prescriptive for Claude Fable 5 and can degrade output quality. Review and consider removing older instructions if default performance is better" — các bộ hướng dẫn viết cho model đời trước thường quá chi li với Fable 5 và *có thể làm giảm chất lượng output*; hãy rà lại và cân nhắc gỡ bỏ nếu model tự làm còn tốt hơn. Không phải "hết tác dụng" — là "làm kém đi". Micromanage một nhân viên giỏi thì nhận về đúng thứ micromanage mang lại: một người giỏi làm việc như người thường.

Phía OpenAI có hai mẩu chuyện cùng bài học. Cursor — một công ty làm công cụ lập trình — khi chuyển sang GPT-5 phát hiện những phần prompt "had been effective with earlier models needed tuning to get the most out of GPT-5" — từng hiệu quả với model cũ nay phải chỉnh lại mới khai thác được model mới. Và OpenAI ghi nhận nhiều người dùng sớm khi rà kho prompt của mình đã "uncover ambiguities and contradictions in their core prompt libraries... removing them drastically streamlined and improved their GPT-5 performance" — lôi ra cả đống chỗ mơ hồ, mâu thuẫn; gỡ đi thì hiệu năng cải thiện rõ rệt. Để ý: đường đến kết quả tốt hơn ở cả hai chuyện đều là *bớt đi*, không phải thêm vào.

Vậy nếu bạn đang có sẵn một kho "câu thần chú" dùng quen, bài tập thực tế nhất sau chương này: mở ra đọc lại bằng con mắt khảo cổ. Với từng câu, hỏi ba câu — nó vá lỗ hổng nào? lỗ hổng đó còn không? gỡ nó đi thì mình mất gì? Bạn sẽ ngạc nhiên vì số câu không sống sót nổi.

## Không phải quên hết — mà là hiểu vì sao

Chốt chương này thật rõ, vì dễ hiểu nhầm: thông điệp không phải "những gì bạn học đều sai, quên hết đi". Những mẹo kia từng đúng, và người dạy bạn hồi 2023 không lừa bạn. Thông điệp là: mẹo chỉ có giá trị khi khuyết điểm nó bù đắp còn tồn tại. Hiểu được cặp "mẹo ↔ khuyết điểm" thì bạn không cần ai phát danh sách mẹo mới mỗi lần model đổi tên — tự bạn nhìn ra mẹo nào nên về hưu.

Và câu hỏi tự nhiên bật ra: nếu mẹo nào rồi cũng có ngày hết thiêng, có thứ gì *không bao giờ* lỗi thời không?

Có. Đó là thứ không model nào, đời nào, tự biết được: bối cảnh của bạn — sếp bạn khó chỗ nào, khách bạn kỵ điều gì — và tiêu chí "thế nào là đạt" trong đầu bạn. Mẹo là đồ theo mùa; bối cảnh và tiêu chí là của gia truyền. Chương 3 nói về của gia truyền đó.

## Điều cốt lõi

- Mỗi mẹo prompt 2023–2024 là miếng vá cho một khuyết điểm cụ thể của model cũ; khuyết điểm lành rồi thì miếng vá thành vật vướng víu.
- Reasoning model đã tự suy luận bên trong — "hãy suy nghĩ từng bước" là thừa; đóng vai chỉ còn giá trị khi đổi góc nhìn, không phải để "tăng IQ".
- Model mới nghe lời chính xác tới mức VIẾT HOA và dọa nạt gây làm-thừa; nói bình thường, một lần, kèm lý do là đủ.
- Prompt dài như hợp đồng phản chủ theo cách bất ngờ: model mới đọc kỹ đến mức thấy cả mâu thuẫn bạn không thấy — và trả giá vì chúng.
- Cả hai hãng đều xác nhận: gỡ chỉ dẫn cũ đi thường cải thiện kết quả — bớt đi, không phải thêm vào.

# Chương 3 — Nhân viên xuất sắc chưa biết gì về bạn

*Trong chương này, bạn sẽ gặp mental model (mô hình tư duy) quan trọng nhất của cả guide: coi AI như một nhân viên cực giỏi nhưng mới toanh. Từ hình ảnh đó, ta sẽ lần ra vì sao output dở phần lớn không phải do model dở — và câu hỏi đúng cần hỏi trước khi đổ lỗi cho máy.*

## Một hình ảnh đáng giá hơn nghìn mẹo

Chương 2 vừa dọn dẹp xong đống mẹo cũ. Giờ là lúc đặt vào chỗ trống đó một thứ bền hơn — không phải mẹo mới, mà là một hình ảnh.

Hình ảnh này không phải tôi nghĩ ra. Nó nằm ngay trong tài liệu hướng dẫn chính chủ của Anthropic (tính đến 08/2026): "Think of Claude as a brilliant but new employee who lacks context on your norms and workflows. The more precisely you explain what you want, the better the result." — hãy coi Claude như một nhân viên xuất sắc nhưng mới vào, chưa có chút bối cảnh nào về nề nếp và cách làm việc của bạn; bạn nói rõ mình muốn gì bao nhiêu, kết quả tốt bấy nhiêu.

Câu này có hai vế, và mỗi vế cấm bạn làm một việc.

Vế thứ nhất: **xuất sắc**. Nó đọc nhanh hơn bạn, viết nhanh hơn bạn, biết nhiều lĩnh vực hơn bạn. Với một người như vậy, đừng dạy họ cách làm. Bạn tuyển một kế toán trưởng giỏi về, bạn không ngồi cạnh chỉ "em mở Excel ra, gõ vào ô A1..." — làm thế vừa phí tiền lương vừa xúc phạm người ta. Mà thú vị ở chỗ: với model thế hệ mới, micromanage kiểu đó không chỉ thừa — nó còn làm kết quả kém đi, như ta đã thấy ở chương 2.

Vế thứ hai: **mới toanh**. Người này chưa biết sếp bạn khó tính chỗ nào, khách hàng nào đang giận, công ty bạn kiêng chữ gì trong email. Với một người như vậy, đừng bắt họ đoán. Mọi thứ bạn thấy "hiển nhiên quá, cần gì nói" — với họ đều không hiển nhiên chút nào.

Hai vế này kéo về hai hướng ngược nhau, và toàn bộ nghệ thuật giao việc nằm ở chỗ giữ được cả hai: **rộng tay về cách làm, hào phóng về bối cảnh.** Đa số chúng ta làm ngược lại — kể lể cách làm rất kỹ, còn bối cảnh thì giữ khư khư trong đầu.

## Khoảng cách ý định: nó làm đúng cái bạn nói, không phải cái bạn nghĩ

Bạn thử để ý khoảnh khắc trước khi gõ một yêu cầu cho AI. Trong đầu bạn lúc đó có cả một bức tranh: bản báo cáo này để làm gì, ai sẽ đọc, người đó hay soi chỗ nào, lần trước bị chê vì đâu, giọng thế nào thì "giống mình". Rồi bạn gõ ra... một câu: "viết giúp tôi báo cáo tổng kết quý".

Cái câu gõ ra chỉ là phần nổi của tảng băng. Chín phần chìm — mục đích, người nhận, taste (khẩu vị, gu thẩm mỹ), điều kỵ — vẫn nằm nguyên trong đầu bạn. Tôi gọi phần chênh lệch đó là **khoảng cách ý định**: khoảng cách giữa cái bạn *nghĩ* và cái bạn *nói*.

Model thế hệ cũ thất bại vì nhiều lý do: hiểu sai, làm ẩu, bịa lung tung. Model thế hệ mới "thất bại" chủ yếu vì đúng một lý do: nó làm rất tốt *cái bạn nói* — mà cái bạn nói lại không phải *cái bạn cần*. Tài liệu best practices của Claude Code viết thẳng: "Claude can infer intent, but it can't read your mind" — Claude suy đoán được ý định, nhưng không đọc được suy nghĩ của bạn.

Một nhân viên giỏi nhận câu "em làm cái báo cáo quý đi" sẽ làm ra một bản chỉn chu, đúng chuẩn... chung chung. Không sai chỗ nào cả. Chỉ là nó không biết sếp bạn chỉ đọc trang đầu, không biết quý này có một con số xấu cần giải thích khéo. Lỗi không nằm ở năng lực người làm — lỗi nằm ở cái brief (bản mô tả yêu cầu công việc).

Khi output "đúng nhưng không trúng", hãy nhớ chữ này: khoảng cách ý định. Việc của bạn không phải viết prompt hay hơn — mà là chuyển sang lời được nhiều hơn phần chìm của tảng băng.

## Giao đích, đừng giao đường đi

Vậy chuyển giao cái gì, giữ lại cái gì? Nguyên tắc gói được trong một câu: **chuyển giao mục tiêu, bối cảnh và tiêu chí — không chuyển giao cách làm** (trừ khi cách làm chính là thứ bạn cần kiểm soát, như quy trình chuẩn của công ty — chuyện liều lượng này bàn kỹ ở Chương 4).

Nghe quen không? Đây chính là khác biệt giữa sếp tồi và sếp giỏi. Sếp tồi giao việc bằng cách áp đặt từng bước, và nhận về những nhân viên chỉ biết chờ lệnh. Sếp giỏi nói rõ đích đến, kể đủ bối cảnh, chốt tiêu chí nghiệm thu — rồi để chuyên viên tự chọn đường. Anthropic khuyên đúng tinh thần đó cho model của họ: "Prefer general instructions over prescriptive steps" — ưu tiên chỉ dẫn khái quát thay vì kịch bản từng bước; một câu "think thoroughly" (nghĩ cho thấu đáo) thường cho kết quả tốt hơn cả một kế hoạch chi tiết bạn tự soạn.

Và trong phần bối cảnh, có một mảnh đáng tiền hơn hẳn các mảnh khác: **lý do**. Trang hướng dẫn của Anthropic viết: "Providing context or motivation behind your instructions, such as explaining to Claude why such behavior is important, can help Claude better understand your goals and deliver more targeted responses" — giải thích *vì sao* bạn yêu cầu như vậy giúp model hiểu mục tiêu và trả lời trúng hơn. Điều này rất giống người: nhân viên biết *vì sao* sẽ tự xử lý đúng cả những tình huống bạn không kịp dặn; nhân viên chỉ biết *phải làm gì* thì gặp tình huống lạ là làm sai.

Trang hướng dẫn dành cho Claude Fable 5 (tính đến 08/2026) thậm chí đưa hẳn một khung câu: "I'm working on [the larger task] for [who it's for]. They need [what the output enables]. With that in mind: [request]." — tôi đang làm [việc lớn hơn] cho [ai]; họ cần [output này để làm gì]; với bối cảnh đó, [yêu cầu]. Đừng coi đây là công thức phải thuộc lòng — hãy coi nó là bằng chứng cho thấy chính hãng làm ra model cũng xác nhận: nói lý do, đừng chỉ nói yêu cầu.

Dịch khung đó ra một tình huống văn phòng quen thuộc, nó chỉ đơn giản thế này (minh họa cách nói, không phải mẫu chuẩn):

```text
Tôi đang chuẩn bị tài liệu cho buổi họp với khách hàng A — họ đang
cân nhắc có gia hạn hợp đồng không, nên tài liệu này phải làm họ
yên tâm về tiến độ. Với bối cảnh đó: tóm tắt giúp tôi file đính kèm
thành một trang, tập trung vào những gì đã hoàn thành đúng hẹn.
```

Ba câu. Không có kỹ thuật gì cao siêu — chỉ là phần chìm của tảng băng được kéo lên mặt nước.

## "Đạt" nghĩa là gì? — thứ dân văn phòng hay quên nhất

Trong bộ ba mục tiêu – bối cảnh – tiêu chí, cái thứ ba là cái bị bỏ quên nhiều nhất: **tiêu chí nghiệm thu**. Tức là trả lời câu hỏi: bản thế nào thì được coi là *xong*, là *đạt*?

Bạn nghĩ mình đã có tiêu chí rồi — "bản này đưa sếp duyệt được là đạt". Nhưng thử tự vấn: "duyệt được" nghĩa là gì, *với bạn*? Dài một trang hay ba trang? Giọng trang trọng hay gần gũi? Sếp bạn dị ứng nhất điều gì — hứa hẹn suông, số liệu không nguồn, hay câu dài lê thê? Những câu hỏi này bạn đều trả lời được, chỉ là chưa bao giờ phải trả lời *thành lời*, vì xưa nay chúng nằm sẵn trong tay nghề của bạn.

Với nhân viên mới, tay nghề đó phải được nói ra. Không cần dài — vài dòng là đủ:

```text
Đạt nghĩa là: dưới một trang, đọc trong 2 phút; giọng như email
nội bộ chứ không phải thông cáo báo chí; mọi con số phải kèm nguồn;
tuyệt đối không hứa mốc thời gian mà tôi chưa chốt.
```

Kinh nghiệm đứng lớp của tôi: chỉ riêng việc tập nói rõ tiêu chí nghiệm thu đã thay đổi chất lượng output nhiều hơn mọi mẹo prompt cộng lại. Vì nó buộc bạn làm rõ điều mà chính bạn cũng đang để mờ — và một khi bạn đã rõ, thì máy hay người làm cho bạn cũng dễ trúng hơn.

## Phép thử đồng nghiệp

Đến đây có một câu hỏi thực dụng: làm sao biết brief của mình đã đủ chưa? Có một phép thử rất đời, cũng từ trang best practices của Anthropic: đưa prompt cho một đồng nghiệp đọc. Nếu đồng nghiệp — một người thông minh nhưng không ở trong đầu bạn — đọc xong mà hiểu nhầm hoặc phải hỏi lại, thì model cũng hoàn toàn có thể hiểu nhầm y như thế.

Phép thử này hay ở chỗ nó không đòi bạn hiểu gì về AI cả. Nó chỉ đòi bạn thừa nhận một sự thật: brief của bạn được viết cho một người *không biết những gì bạn biết*. Mà đó chính là định nghĩa của nhân viên mới.

Bạn không cần lôi đồng nghiệp thật ra làm phiền mỗi lần giao việc. Chỉ cần trước khi bấm gửi, tự đọc lại yêu cầu bằng con mắt người ngoài: chỗ nào mình viết "làm cho đẹp", "như mọi khi" — đó là chỗ người ngoài phải đoán. Và chỗ nào phải đoán, chỗ đó output sẽ lệch.

## Phép đảo cuối chương: brief-lỗi hay model-lỗi?

Giờ ta đảo ngược tình huống để chốt lại. Bạn giao việc, nhận về một output dở. Phản xạ tự nhiên: "model này chán nhỉ." Có thể đúng. Nhưng câu hỏi *đầu tiên* nên là câu khác:

**"Một nhân viên giỏi, nhận đúng cái brief này — không hơn không kém — liệu có làm khác không?"**

Nếu câu trả lời là "ừ nhỉ, người giỏi nhận brief này chắc cũng ra cái na ná thế" — thì đó là brief-lỗi. Thiếu bối cảnh nào, bổ sung bối cảnh đó; mờ tiêu chí nào, làm rõ tiêu chí đó. Đây là trường hợp phổ biến, và là trường hợp *may mắn*, vì nó nằm hoàn toàn trong tay bạn.

Nếu câu trả lời là "không, brief đã đủ rõ, người giỏi sẽ làm tốt hơn hẳn" — thì mới đến lượt nghi ngờ model: thử diễn đạt lại, thử mức suy nghĩ cao hơn, thử model khác. Đó là model-lỗi, và nó hiếm hơn bạn tưởng.

Thói quen phân loại này là ranh giới giữa người dùng AI hay cáu và người dùng AI hiệu quả. Người hay cáu đổi model liên tục mà giữ nguyên brief. Người hiệu quả giữ model, sửa brief — và mỗi lần sửa lại hiểu thêm một chút về chính công việc của mình.

Còn một câu hỏi lớn treo lại: nói "hào phóng bối cảnh, rộng tay cách làm" thì dễ, nhưng *hào phóng đến đâu*? Lúc nào cần chi tiết, lúc nào cần buông? Đó không phải câu hỏi có đáp án chung — đó là câu chuyện liều lượng, và nó xứng đáng nguyên một chương. Mời bạn sang Chương 4.

## Điều cốt lõi

- AI hiện nay như nhân viên xuất sắc nhưng mới toanh: đừng dạy nó cách làm, và đừng bắt nó đoán bối cảnh.
- Output "đúng nhưng không trúng" thường do khoảng cách ý định: nó làm đúng cái bạn nói, không phải cái bạn nghĩ — vì nó không đọc được suy nghĩ của bạn.
- Chuyển giao mục tiêu, bối cảnh (nhất là *lý do*) và tiêu chí nghiệm thu; giữ lại cách làm cho model tự chọn, trừ khi cách làm chính là thứ bạn cần kiểm soát.
- Tiêu chí nghiệm thu là mảnh hay bị quên nhất: hãy tập trả lời thành lời câu hỏi «"đạt" nghĩa là gì với mình?».
- Khi output dở, câu hỏi đầu tiên không phải "model dở à?" mà là "một nhân viên giỏi nhận đúng brief này liệu có làm khác không?"

## Nguồn trong chương

- [Claude prompting best practices — Anthropic](https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices) — truy cập 08/2026
- [Prompting Claude Fable 5 — Anthropic](https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-fable-5) — truy cập 08/2026

# Chương 4 — Nghệ thuật liều lượng: 5 cái nút không có vạch chuẩn

*Trong chương này, bạn sẽ có câu trả lời cho những câu hỏi khó chịu nhất khi giao việc cho AI: lúc nào cần chi tiết, lúc nào nên cấm đoán, lúc nào thì thả. Không có công thức đâu — nhưng có 5 cái nút, và có dấu hiệu để biết bạn đang vặn lệch nút nào.*

## Vì sao không ai đưa được vạch chuẩn cho bạn

Đến chương này, bạn có thể đang hơi bực. Chương 2 bảo đừng viết prompt dài như hợp đồng. Chương 3 lại bảo phải chuyển giao bối cảnh cho đủ. Vậy rốt cuộc là viết nhiều hay viết ít?

Câu trả lời thật thà: cả hai — tùy chỗ. Giao việc cho AI giống nấu ăn hơn pha thuốc: pha thuốc có định lượng in trên nhãn, nấu ăn thì "nêm vừa miệng", mà miệng mỗi nhà mỗi khác. Người nấu giỏi không nhớ từng gram — họ nếm rồi chỉnh.

Chương này đưa cho bạn cái bếp đó: 5 cái nút vặn, nút nào cũng hai chiều, và **vặn chiều nào cũng có giá phải trả**. Thứ đáng học không phải vị trí chuẩn của từng nút — làm gì có — mà là cách nếm ra output đang "mặn" hay "nhạt" để biết mình vừa quá tay nút nào.

## Nút 1 — Độ chi tiết của ĐÍCH: chi tiết gì cũng tốt, trừ khi chi tiết nhầm thứ

Đây là nút bị hiểu nhầm nhiều nhất: "viết chi tiết" nghe như một lời khuyên duy nhất, nhưng thật ra có hai loại chi tiết ngược tính nhau hoàn toàn.

Loại thứ nhất: chi tiết về **đích đến** — bạn cần gì, cho ai, "đạt" nghĩa là thế nào. Loại này gần như luôn đáng tiền. Anthropic viết thẳng trong hướng dẫn chính chủ (tính đến 08/2026): "The more precisely you explain what you want, the better the result" — bạn giải thích điều mình muốn càng chính xác, kết quả càng tốt. Muốn email "ngắn", ngắn là ba dòng hay nửa trang? Mỗi lần bạn nói rõ thêm một nấc về đích, model đỡ phải đoán một nấc.

Loại thứ hai: chi tiết về **cách làm** — làm theo bước nào, mở bài ra sao, cấu trúc gì. Loại này ngược hẳn: với model thế hệ mới, càng kê đơn từng bước càng dễ làm kết quả kém đi. Cũng chính Anthropic khuyên: "Prefer general instructions over prescriptive steps" — ưu tiên chỉ dẫn chung thay vì các bước kê sẵn; một câu "think thoroughly" (nghĩ cho kỹ) thường ra kết quả tốt hơn cả một kế hoạch từng bước bạn tự soạn.

Nút này, vì thế, không phải "nhiều chữ hay ít chữ" — nó là **chi tiết đổ vào đâu**. Hai cách giao cùng một việc:

```text
Cách A: "Viết giúp tôi thông báo nghỉ lễ gửi toàn công ty.
Mở đầu bằng lời chúc, sau đó nêu ngày nghỉ, sau đó dặn dò
công việc, kết bằng lời cảm ơn, mỗi đoạn 2 câu."
```

```text
Cách B: "Viết giúp tôi thông báo nghỉ lễ gửi toàn công ty
(~200 người, đủ mọi bộ phận). Cần: ngày nghỉ 1/9–3/9 nổi bật
ngay từ đầu để người lướt vội không bỏ sót; giọng ấm nhưng
không sến; dưới 150 chữ vì mọi người đọc trên điện thoại."
```

Cách A chi tiết về cách làm — bạn sẽ nhận về đúng bộ khung bạn kê, kể cả khi khung đó không phải cách tốt nhất cho người đọc trên điện thoại. Nó vẫn hợp lý nếu công ty bạn có format thông báo bắt buộc (xem Nút 3). Cách B chi tiết về đích — model được tự chọn cấu trúc, nhưng bị "khóa" đúng những thứ bạn thật sự cần: thông tin nổi bật, giọng, độ dài, lý do.

Còn một cái bẫy tinh vi: chi tiết nhiều mà **mâu thuẫn nhau** thì tệ hơn cả thiếu. Hướng dẫn prompt chính chủ của OpenAI cho dòng GPT-5 (tính đến 08/2026) cảnh báo rằng prompt chứa chỉ dẫn mâu thuẫn hoặc mơ hồ "can be more damaging to GPT-5 than to other models" — gây hại cho model mới nhiều hơn model cũ, vì model đốt công suy nghĩ vào việc dung hòa các mâu thuẫn của bạn. Bảo "thật ngắn gọn" rồi liệt kê tám ý bắt buộc, model sẽ vật lộn thay vì làm việc.

**Dấu hiệu đang lệch:** output đúng dàn ý bạn kê nhưng đọc gượng gạo → chi tiết đang nhầm sang cách làm, thử rút về mô tả đích. Output mỗi lần một kiểu, cái nào cũng "gần đúng nhưng không phải" → thiếu chi tiết về đích, tiêu chí "đạt" còn nằm trong đầu bạn. Output ngập ngừng, tự mâu thuẫn → soi lại xem brief có đang bắt cá hai tay không.

## Nút 2 — Trói buộc và cấm đoán: để dành cho ranh giới thật

Bản năng của người mới là rào trước đón sau: đừng viết dài, đừng dùng từ sáo, chớ thế này thế kia. Cảm giác an toàn, nhưng có giá.

Mặc định nên là chiều dương: Anthropic khuyên "Tell Claude what to do instead of what not to do" — nói điều nên làm thay vì điều không nên làm. "Viết giọng thân thiện như email nội bộ" cho model một hướng để chạy; "đừng viết khô khan" chỉ cho nó một hướng để né, mà cách khô khan thì có vô số kiểu bạn chưa cấm.

Vậy cấm đoán để làm gì? Để dành cho **ranh giới thật** — những điều tuyệt đối không được xảy ra, bất kể output hay đến đâu. Số liệu không được bịa. Bản nháp không được tự gửi đi. Số liệu gốc không được sửa. Đây chính là tinh thần "State the boundaries" trong hướng dẫn cho Claude Fable 5 (tính đến 08/2026): định nghĩa rõ những gì model được và không được làm — cấm đoán đúng chỗ vẫn rất cần, nhất là với hành vi ngoài ý muốn.

Phép thử nhanh cho một điều cấm: nếu nó xảy ra, bạn chỉ hơi nhíu mày hay phải đi giải trình? Loại "nhíu mày" (văn hơi dài, giọng hơi cứng) → chuyển thành mô tả đích ở Nút 1. Loại "giải trình" → đó là ranh giới: viết rõ, viết ngắn, đặt trang trọng.

**Dấu hiệu đang lệch:** output rón rén, câu nào cũng lưỡng lự như sợ phạm quy, né luôn cả vùng hữu ích sát ranh giới → bạn đã cấm quá nhiều, model dồn sức tránh né thay vì làm tốt. Ngược lại, output thỉnh thoảng "sáng tạo" đúng chỗ chết người — tự chế số liệu minh họa, tự thêm cam kết bạn không định hứa → đang thiếu đúng vài dòng ranh giới lẽ ra phải có.

## Nút 3 — Chỉ dẫn cách làm: khi quy trình chính là thứ bạn cần kiểm soát

Nghe xong Nút 1, có người sẽ kết luận "vậy đừng bao giờ chỉ cách làm nữa". Cũng sai nốt.

Có những việc mà **cách làm chính là yêu cầu**. Báo cáo tài chính phải theo đúng template kế toán duyệt. Biên bản họp phải đủ bốn mục theo quy định. Ở những việc này, chỉ dẫn từng bước không phải micromanage — nó là chuyển giao **quy chuẩn**, một dạng bối cảnh quý mà model không thể tự đoán. Cứ mạnh dạn kê: "làm đúng theo cấu trúc trong file mẫu đính kèm, không sáng tạo thêm mục."

Ngược lại, có những việc bạn chỉ cần kết quả tốt và thật lòng không quan tâm đường đi: tóm tắt tài liệu, phân tích số liệu, tìm phương án. Ở đó, model thế hệ mới đã đủ nghe lời để không cần kê đơn — trang hướng dẫn Claude Fable 5 viết: "Instruction-following is improved enough that you can steer most behaviors with a brief instruction rather than enumerating each behavior by name" — khả năng làm theo chỉ dẫn đã tốt tới mức một câu ngắn đủ lái hầu hết hành vi, không cần liệt kê từng thứ. Kê mười bước cho việc model đã làm cả nghìn lần giống như dặn đầu bếp nhà hàng cách cầm dao: vừa thừa, vừa dễ bắt họ làm theo cách dở hơn cách họ biết.

Câu hỏi định vị rất gọn: **quy trình này là của công ty bạn, hay của thế giới?** Của công ty bạn (template, checklist, quy định nội bộ) → chỉ dẫn, càng chuẩn càng tốt. Của thế giới (cách tóm tắt, cách phân tích, cách viết) → giao đích, để model chọn đường.

**Dấu hiệu đang lệch:** bạn vừa viết 10 bước cho một việc phổ thông mà chính bạn cũng chỉ biết lơ mơ cách làm tốt nhất — dừng lại, xóa các bước, giữ lại đích. Ngược lại, output "hay nhưng sai chuẩn nhà mình", lần nào cũng phải nắn về format công ty — đó là việc thuộc loại quy-trình-của-bạn mà bạn quên chuyển giao quy chuẩn.

## Nút 4 — Lượng bối cảnh: đủ tín hiệu, không phải nhiều chữ

Chương 3 đã thuyết phục bạn rằng bối cảnh là tài sản quý nhất bạn nắm giữ. Nhưng "cho nhiều bối cảnh" không có nghĩa là trút cả ổ cứng vào chat.

Trong tài liệu về context engineering (kỹ thuật quản lý bối cảnh cho AI), Anthropic có một định nghĩa đáng dán lên màn hình: tìm "the smallest possible set of high-signal tokens that maximize the likelihood of some desired outcome" — tập nhỏ nhất có thể những thông tin đậm tín hiệu giúp tối đa khả năng ra được kết quả mong muốn. Dịch ra tiếng văn phòng: câu hỏi không phải "đưa bao nhiêu?" mà là "mỗi thứ mình đưa có đang làm việc gì không?"

Ba mẹo thực dụng cho nút này. Một, **tài liệu thật thắng mô tả dài**: một file báo cáo cũ từng được sếp khen đáng giá hơn mười dòng bạn gồng mình tả "giọng chuyên nghiệp mà gần gũi". Hai, **bối cảnh phải có địa chỉ**: đừng đưa nguyên biên bản 20 trang rồi thôi — nói rõ "chỉ cần phần thảo luận ngân sách ở mục 3". Ba, chọn đúng **tầm cao**: tài liệu Anthropic gọi là "right altitude" — chỉ dẫn nên lơ lửng ở khoảng giữa, không sà xuống thành luật if-else cứng nhắc cho từng tình huống, cũng không bay cao thành khẩu hiệu ai đọc cũng gật mà chẳng ai làm được.

**Dấu hiệu đang lệch:** output chung chung như viết cho công ty nào cũng đúng → thiếu tín hiệu, thêm tài liệu thật và các chi tiết chỉ-mình-bạn-biết. Output lạc đề, bám vào một chi tiết phụ trong đống tài liệu bạn trút vào → thừa nhiễu, cắt bớt và chỉ địa chỉ. Và một dấu hiệu ít ai để ý: mất mười lăm phút soạn bối cảnh cho việc năm phút — nút này còn có chiều "quá tay" tính bằng công sức của chính bạn.

## Nút 5 — Quyền tự quyết: cho hỏi lại, hay dặn "cứ làm tới"?

Nút cuối cùng ít người biết mình đang cầm: model được **tự quyết đến đâu** trước khi quay lại hỏi bạn? Tài liệu OpenAI đặt tên cho khái niệm này là "agentic eagerness" — độ hăng hái tự chủ, tức "its balance between proactivity and awaiting explicit guidance": cán cân giữa chủ động làm tới và chờ chỉ dẫn tường minh. Cán cân này bạn chỉnh được bằng lời, ngay trong brief.

Vặn về phía "hỏi trước": hợp với việc một-lần-ăn-ngay, sai là tốn — nội dung cho cuộc họp chiều nay, email nhạy cảm gửi đối tác. Một câu hỏi ngược của model rẻ hơn nhiều so với một bản làm lại. Bạn có thể mời thẳng: "trước khi làm, nếu thấy brief còn mơ hồ chỗ nào thì hỏi tôi trước."

Vặn về phía "cứ làm tới": hợp với việc chạy dài, hoặc khi bạn muốn có bản nháp để phản ứng thay vì ngồi trả lời phỏng vấn. Hướng dẫn cho Claude Fable 5 có một câu đúng tinh thần này: "When you have enough information to act, act" — khi đã đủ thông tin để làm, hãy làm. Bạn chuyển tinh thần đó vào brief của mình: "cứ quyết các chi tiết nhỏ theo phán đoán của bạn, chỉ dừng hỏi tôi nếu đụng đến ngân sách hoặc lời hứa với khách hàng." Để ý cấu trúc: quyền tự quyết rộng, đi kèm ranh giới hẹp mà rõ — Nút 5 vặn lên thì Nút 2 phải chắc tay. Nút này sẽ càng quan trọng khi bạn giao việc dài hơi cho agent (AI làm việc nhiều bước liên tục) — chuyện của Chương 8 và Chương 10.

**Dấu hiệu đang lệch:** model hỏi bạn dăm câu về những thứ nó thừa sức tự quyết → bạn chưa trao quyền, thêm một câu "cứ chủ động, tôi sẽ góp ý trên bản nháp". Model tự quyết một thứ khiến bạn giật mình → quyền trao rộng hơn ranh giới, quay lại Nút 2 vẽ lại vạch "phải dừng hỏi".

## Cái cần gạt thứ sáu — không nằm trong brief

Năm cái nút trên đều vặn bằng lời, ngay trong brief. Nhưng còn một cần gạt cuối cùng nằm ngoài brief, ngay trên giao diện — và Chương 1 đã treo nó lại cho chương này: **việc này đáng để máy nghĩ sâu đến đâu?**

Với ChatGPT (tính đến 08/2026), cần gạt đó chính là cái picker Instant / Medium / High / Extra High / Pro, kèm auto-routing tự nâng mức khi gặp yêu cầu phức tạp. Phía Claude, nó là việc chọn model trong menu: bản mặc định nhanh gọn cho việc thường ngày, các bản mạnh hơn khi việc khó lên tay.

Chọn thế nào thì không cần bảng tra — hai câu hỏi là đủ. Một: *việc này sai thì tốn bao nhiêu?* Hai: *nó có mơ hồ, nhiều tầng, nhiều tài liệu không?* Hỏi nhanh một khái niệm, nháp một email thường ngày — mức mặc định là quá đủ, chờ máy nghĩ sâu chỉ phí thời gian của bạn. Còn bản phân tích nhiều ràng buộc, việc phải đọc cả xấp tài liệu, hay thứ mà sai là đau — đáng để vặn mức nghĩ lên và đáng để chờ. Bạn để ý: đây vẫn là câu hỏi quản lý quen thuộc — việc nào giao chuyên viên làm nhanh, việc nào đáng để cả hội đồng ngồi lại — chỉ là lần này bạn trả lời nó bằng một cú click.

**Dấu hiệu đang lệch:** bạn ngồi chờ sốt ruột một câu trả lời cho câu hỏi vặt → hạ mức xuống, hoặc cứ để auto-routing lo. Việc khó mà câu trả lời về nhanh bất thường, hời hợt, bỏ sót ràng buộc → nâng mức nghĩ lên; nhưng trước đó hãy kiểm brief đã — thiếu bối cảnh thì mức nghĩ nào cũng không cứu được (Chương 3).

## Năm cái nút, một bàn trộn

5 nút này không đứng riêng — chúng bù trừ nhau như các nút trên bàn trộn âm thanh: đích càng rõ (N1) thì càng ít phải kê cách làm (N3); bối cảnh càng giàu (N4) thì càng dám trao quyền tự quyết (N5); quyền tự quyết càng rộng thì ranh giới càng phải sắc (N2). Vặn một nút mà quên các nút kia, âm thanh sẽ lệch — và giờ bạn đã có tai để nghe ra nó lệch kiểu gì.

Điều tôi muốn bạn mang ra khỏi chương này: cái gọi là "taste" khi làm việc với AI, thực chất là **bộ vị trí nút của riêng bạn** — thứ bạn dò ra dần qua vài lần giao việc thật, với loại việc thật và khẩu vị rủi ro thật của bạn. Vì thế không ai đưa được công thức cho bạn: họ không nấu bếp nhà bạn. Còn dò thế nào cho nhanh — giao, nếm, chỉnh qua nhiều vòng — là câu chuyện của Chương 8.

## Điều cốt lõi

- Không có vị trí nút "chuẩn" — chỉ có vị trí hợp với việc, và dấu hiệu trên output cho biết bạn đang vặn lệch nút nào.
- Chi tiết về đích gần như luôn đáng tiền; chi tiết về cách làm chỉ đáng khi quy trình là của công ty bạn, không phải của thế giới.
- Nói điều nên làm là mặc định; cấm đoán để dành cho ranh giới thật — thứ mà nếu xảy ra thì bạn phải đi giải trình.
- Bối cảnh đo bằng tín hiệu, không đo bằng số chữ: một file mẫu thật đáng giá hơn mười dòng mô tả.
- Quyền tự quyết vặn càng rộng, ranh giới càng phải sắc — và bộ vị trí 5 nút bạn dò ra qua thực tế chính là "taste" của bạn.
- Ngoài brief còn một cần gạt trên giao diện — mức suy nghĩ: việc sai-là-đau và nhiều tầng thì đáng vặn lên và đáng chờ; việc vặt cứ để mức mặc định.

# Chương 5 — Thực chiến: research và tổng hợp thông tin

*Trong chương này, chúng ta rời lý thuyết và bước vào loại việc mà dân văn phòng nhờ AI nhiều nhất: đi tìm và tổng hợp thông tin. Bạn sẽ thấy cùng một câu hỏi, ba cách giao khác nhau cho ra ba sản phẩm khác hẳn nhau — và quan trọng hơn, bạn sẽ có một bộ câu hỏi để tự biết mình đang cần cách nào.*

## Thí nghiệm mở màn: sếp hỏi lúc 4 giờ chiều

Tình huống này tôi tin nhiều bạn từng gặp. Bốn giờ chiều, sếp nhắn: "Mai họp với đối tác, em chuẩn bị cho anh nói khoảng 5 phút về thị trường văn phòng ảo ở Việt Nam nhé." Bạn mở AI ra. Vấn đề bây giờ không phải là AI có tìm được thông tin hay không — chắc chắn tìm được — mà là bạn sẽ *nói gì* với nó.

Thử ba cách giao, cùng một việc.

Cách thứ nhất, một câu trần trụi:

```text
Tìm hiểu về thị trường văn phòng ảo ở Việt Nam.
```

Cách thứ hai, giao kèm bối cảnh, mục đích, người nghe và tiêu chí nghiệm thu:

```text
Sếp tôi mai họp với một đối tác bất động sản, cần nói khoảng 5 phút
về thị trường văn phòng ảo ở Việt Nam. Người nghe là dân trong ngành,
không cần giải thích khái niệm cơ bản. Tôi cần: tối đa 5 ý chính,
mỗi ý có số liệu hoặc ví dụ cụ thể, ghi rõ nguồn và thời điểm của
số liệu để tôi kiểm lại trước khi đưa sếp. Chỗ nào thông tin mỏng
hoặc mâu thuẫn giữa các nguồn thì nói thẳng là mỏng.
```

Cách thứ ba, giao kiểu quy trình — chưa cho chạy vội:

```text
Tôi cần chuẩn bị nội dung 5 phút về thị trường văn phòng ảo Việt Nam
cho sếp họp đối tác ngày mai. Trước khi tìm sâu, hãy đề xuất cho tôi
một dàn ý research: bạn định tìm những mảng nào, ưu tiên loại nguồn
nào, và mảng nào bạn đoán là khó có số liệu tốt. Tôi duyệt dàn ý
xong rồi mới chạy.
```

Trước khi đọc tiếp, bạn thử đoán xem: ba cách này sẽ cho ra ba kiểu output khác nhau thế nào? Và cách nào "đúng"?

Câu trả lời làm nhiều học viên của tôi bất ngờ: cả ba đều đúng — mỗi cách đúng với một tình huống khác nhau.

Cách (a) sẽ cho bạn một bài tổng quan dàn trải: khái niệm văn phòng ảo là gì, ai đang cung cấp, xu hướng chung, vài nhận định rộng. Kiểu bài "đúng nhưng vô dụng cho cuộc họp 5 phút" — vì AI không hề biết có một cuộc họp 5 phút nào tồn tại. Nhưng khoan chê nó. Nếu bạn *mới nghe* đến văn phòng ảo lần đầu và chỉ muốn thăm dò xem địa hình này có gì, thì chính bài dàn trải đó lại là thứ bạn cần, và câu một dòng kia là cách giao nhanh gọn nhất. Cách ngắn nhất đôi khi là cách đúng nhất — miễn là nhu cầu của bạn thật sự chỉ có vậy.

Cách (b) sẽ cho bạn thứ gần với "đồ dùng được" nhất: một dàn ý 5 ý, có số liệu, có nguồn, có cả lời thú nhận chỗ nào dữ liệu mỏng. Không phải vì bạn viết prompt dài hơn — mà vì bạn đã chuyển giao đúng những thứ chỉ mình bạn biết: có cuộc họp, họp với ai, người nghe trình độ nào, "đạt" nghĩa là gì. Đây chính là tinh thần Chương 3 chạy bằng ví dụ thật: bối cảnh và tiêu chí nghiệm thu, không phải cách làm. Để ý là trong cả đoạn đó, bạn không hề dạy AI *cách* research.

Cách (c) chậm hơn một nhịp — bạn phải đọc và duyệt dàn ý trước khi nó chạy sâu. Nhưng với chủ đề bạn *lạ*, đây là cách an toàn nhất: bạn kiểm được hướng đi khi nó còn rẻ. Nếu dàn ý lệch — ví dụ nó định dành nửa thời lượng cho thị trường quốc tế trong khi sếp bạn chỉ quan tâm Việt Nam — bạn chỉnh một câu là xong. Còn nếu để nó chạy sâu rồi mới phát hiện lệch, bạn mất cả công nó lẫn công bạn đọc. Cái giá của một nhịp duyệt gần như luôn rẻ hơn cái giá của một bài research trật hướng.

## Bốn câu hỏi của mọi việc thông tin

Từ thí nghiệm trên, rút ra được một nguyên lý dùng cho mọi việc kiểu research: với việc *thông tin*, thứ quyết định chất lượng không phải là bạn mô tả chủ đề kỹ đến đâu, mà là bạn trả lời được bốn câu hỏi: **để làm gì, cho ai, sâu tới đâu, tin nguồn nào**.

"Để làm gì" quyết định hình hài output. Cùng chủ đề văn phòng ảo, nhưng "để sếp nói 5 phút", "để viết đề xuất đầu tư", "để tôi hiểu sơ bộ" là ba sản phẩm khác nhau hoàn toàn. Anthropic có một khuôn nói rất gọn cho việc này (tính đến 08/2026), trong tài liệu hướng dẫn chính chủ: "I'm working on [the larger task] for [who it's for]. They need [what the output enables]. With that in mind: [request]" — *tôi đang làm [việc lớn hơn] cho [ai đó]; họ cần [output này để làm gì]; với bối cảnh đó, hãy [yêu cầu]*. Không phải vì đây là câu thần chú, mà vì nó ép bạn nói ra đúng ba thứ AI không thể tự đoán.

"Cho ai" quyết định độ cao của bài viết. Dân trong ngành hay người ngoài? Sếp thích số hay thích câu chuyện? Bạn biết những điều này; AI thì không, và nó sẽ mặc định viết cho một độc giả trung bình không tồn tại.

"Sâu tới đâu" là nút chặn lãng phí. Việc thăm dò thì mươi phút là đủ; việc làm nền cho quyết định lớn thì đáng để chạy kỹ. Nói rõ ngay từ đầu, bạn tránh được cả hai kiểu phí: bài quá nông để dùng và bài quá sâu để đọc.

Còn "tin nguồn nào" — câu này quan trọng đến mức đáng cả một mục riêng.

## Kiểm chứng: model mới đỡ bịa hơn, nhưng không miễn nhiễm

Đây là chỗ tôi muốn nói thẳng nhất trong chương này. Model thế hệ mới bịa ít hơn hẳn thế hệ trước. Nhưng "đỡ hơn" không phải "miễn nhiễm". Một con số nghe rất trơn tru vẫn có thể sai, cũ, hoặc bị gán nhầm nguồn. Và người ký tên dưới bản báo cáo — trước sếp, trước khách hàng — vẫn là bạn, không phải model.

Vậy nên với việc research, hãy tập ba thói quen giao việc.

Một: yêu cầu nguồn kèm link, và yêu cầu *ngày* của số liệu. "Thị trường tăng trưởng 30%" là vô nghĩa nếu không biết 30% của năm nào, ai đo. Con số không có ngày tháng và xuất xứ thì chưa phải là số liệu — mới chỉ là một câu văn có chữ số ở trong.

Hai: dặn model nói rõ chỗ nó không chắc. Bạn thấy trong cách giao (b) ở trên có câu "chỗ nào thông tin mỏng hoặc mâu thuẫn giữa các nguồn thì nói thẳng là mỏng" — câu đó đáng giá hơn vẻ ngoài của nó nhiều. Model có xu hướng trình bày mọi thứ với độ tự tin đều tăm tắp; bạn phải chủ động mở cửa cho nó thú nhận. Và nên nói cả *lý do* bạn cần sự thú nhận đó — ví dụ "vì sếp tôi sẽ hỏi ngược tại cuộc họp" — vì theo tài liệu hướng dẫn của Anthropic, giải thích động cơ đằng sau yêu cầu giúp model hiểu mục tiêu của bạn và trả lời trúng hơn.

Ba: kiểm điểm tựa trước khi ký. Bạn không cần kiểm 100% — nhưng con số nào sẽ được nói to nhất trong cuộc họp, nguồn nào cả lập luận đứng lên trên, thì mở link ra xem tận mắt. Nghi ngờ nhất những số liệu quá đẹp, quá tròn, hoặc không dẫn được về đâu.

Nếu output về mà toàn nhận định không số, hoặc toàn số không nguồn — đó không hẳn là model tệ. Thường đó là dấu hiệu brief của bạn chưa nói rõ bạn cần loại bằng chứng nào. Quay lại chỉnh brief trước khi đổ lỗi cho máy — đúng phép đảo của Chương 3.

## Công cụ chuyên dụng: khi việc research đáng một cỗ máy riêng

Cả hai hệ đều có chế độ research chuyên dụng, mạnh hơn hẳn hỏi đáp thường cho việc tìm sâu (tính đến 08/2026). Phía ChatGPT là **Deep Research** — tạo báo cáo có trích nguồn, và điểm hay nhất với tinh thần chương này: nó đưa ra một kế hoạch research để bạn *duyệt và sửa được* trước khi chạy, tức là cách giao (c) được đóng sẵn vào sản phẩm; nó làm việc được với cả file bạn upload, web và các app dữ liệu bạn đã kết nối. Phía Claude là **Research mode** trên claude.ai — tìm kiếm trên web cùng Google Workspace và các integration (kết nối dữ liệu) bạn đã cho phép, trả về một báo cáo tương tác.

Điều đáng nhớ ở đây không phải danh sách tính năng — chi tiết từng bề mặt xin hẹn ở Chương 10 — mà là: công cụ chuyên dụng *không thay được* bốn câu hỏi ở mục trên. Một phiên Deep Research với brief "tìm hiểu về thị trường văn phòng ảo" vẫn sẽ cho ra một bài dàn trải, chỉ là dàn trải công phu hơn và kèm nhiều nguồn hơn. Cỗ máy khỏe hơn thì brief tốt càng được nhân lên — chứ không bù được brief thiếu.

## Ví dụ phụ: research không chỉ là tìm ngoài internet

Một nửa việc "tổng hợp thông tin" ở văn phòng chẳng dính gì đến internet: nó nằm trong 30 cái email, 4 biên bản họp và 2 file Excel của chính bạn. Đây là loại việc AI hiện nay làm rất tốt — với một điều kiện: đưa tài liệu *thật*, đừng kể lại.

Giả sử bạn cần nắm lại một thương vụ kéo dài ba tháng trước cuộc họp nội bộ. Đính kèm các email và biên bản (các bề mặt chat hiện đều nhận file trực tiếp), rồi giao kiểu:

```text
Đây là toàn bộ email và biên bản họp của dự án X từ tháng 5 đến nay.
Tôi cần một bản brief 1 trang cho cuộc họp nội bộ chiều nay: dòng
thời gian các mốc chính, những gì hai bên đã cam kết, những điểm
còn treo chưa ai chốt, và chỗ nào hai nguồn nói khác nhau thì
ghi chú lại kèm tên file.
```

Để ý cấu trúc quen thuộc: tài liệu thật + đầu ra nói rõ (1 trang, 4 hạng mục, dùng chiều nay) + một yêu cầu kiểm chứng cài sẵn (chỉ ra chỗ các nguồn vênh nhau, kèm vết để tra lại). Bạn sẽ nhận về kiểu bản brief có dòng thời gian và danh sách "điểm treo" — và kinh nghiệm của tôi là chính mục "hai nguồn nói khác nhau" mới hay cứu bạn nhất trong cuộc họp, vì đó là những chỗ con người đọc lướt 30 email sẽ bỏ sót. (Đây là mô tả pattern để bạn hình dung, không phải log thật — hãy chạy trên tài liệu của chính bạn.)

Với tài liệu nội bộ, bốn câu hỏi của việc thông tin vẫn nguyên giá trị, chỉ đổi vai: "tin nguồn nào" giờ thành "nguồn nào là bản mới nhất" — nhớ nói cho model biết file nào đã lỗi thời, nếu không nó sẽ trọng dụng đều tất cả.

## Điều cốt lõi

- Với việc research, cách giao ngắn - vừa - kỹ đều có đất dùng: thăm dò thì một câu là đủ, có đích cụ thể thì phải chuyển giao bối cảnh và tiêu chí, chủ đề lạ thì duyệt dàn ý trước khi cho chạy sâu.
- Bốn câu hỏi quyết định chất lượng một việc thông tin: để làm gì, cho ai, sâu tới đâu, tin nguồn nào.
- Luôn yêu cầu nguồn kèm link và ngày của số liệu, và chủ động mời model nói ra chỗ nó không chắc — nó sẽ không tự thú nếu bạn không hỏi.
- Model mới đỡ bịa hơn nhưng không miễn nhiễm; công cụ research chuyên dụng nhân sức mạnh của brief tốt chứ không bù được brief thiếu.
- Người ký tên dưới bản báo cáo vẫn là bạn — kiểm tận mắt những con số sẽ được nói to nhất.

# Chương 6 — Thực chiến: review, góp ý và phản biện văn bản

*Trong chương này, chúng ta đem tư duy "bối cảnh + tiêu chí" vào một việc rất đời: nhờ AI xem giúp một văn bản. Bạn sẽ thấy vì sao cùng một bản draft, ba cách nhờ khác nhau cho ra ba kiểu góp ý khác hẳn nhau — và vì sao ở riêng mảng review, chuyện "đóng vai" tưởng đã lỗi thời lại vẫn còn đất sống.*

## Thí nghiệm mở màn: một bản hợp đồng và ba cách nhờ xem

Tình huống thật, chắc bạn từng gặp phiên bản nào đó của nó. Bạn đang cầm bản draft hợp đồng dịch vụ mà bên đối tác vừa gửi sang — hoặc thay bằng bản kế hoạch truyền thông quý tới, tùy nghề của bạn. Chiều nay phải phản hồi. Bạn mở AI lên, đính kèm file, và giao việc.

Cách thứ nhất, kiểu ta vẫn hay làm khi vội:

```text
Xem giúp mình file hợp đồng này với.
```

Cách thứ hai, bạn dành hai phút để nói rõ mình cần loại ánh nhìn nào:

```text
Bạn đóng vai bên PHẢN BIỆN, đọc hợp đồng này với con mắt của người
đi tìm vấn đề, không phải người khen. Công ty mình là bên B (bên
cung cấp dịch vụ). Soi theo đúng 3 hướng: (1) rủi ro pháp lý cho
bên B, (2) số liệu hoặc mốc thời gian mâu thuẫn nhau giữa các điều
khoản, (3) những cam kết mơ hồ có thể bị diễn giải bất lợi cho mình.
Bỏ qua lỗi chính tả, câu chữ. Xếp các vấn đề theo mức nghiêm trọng.
Mình cần bị chê thẳng — bản này mà lọt lỗi thì người ký chịu trận
là mình, nên đừng ngại làm mình mất hứng.
```

Cách thứ ba, bạn không mô tả tiêu chí bằng lời nữa mà đưa luôn tiêu chí "vật chất": đính kèm thêm checklist rà soát hợp đồng của phòng pháp chế (hoặc style guide nội bộ, nếu là kế hoạch truyền thông) cùng một bản hợp đồng cũ đã được sếp duyệt, rồi giao:

```text
Đây là draft mới, kèm checklist rà soát nội bộ và một bản cũ đã
được duyệt. Đối chiếu draft mới với checklist từng mục một: mục nào
đạt, mục nào chưa, mục nào checklist không phủ tới nhưng bạn thấy
đáng lưu ý. Chỗ nào draft mới làm KHÁC bản đã duyệt thì chỉ ra và
nói khác đó có lợi hay bất lợi cho bên B.
```

Câu hỏi quen thuộc của các chương thực chiến: trước khi đọc tiếp, bạn đoán ba output này khác nhau thế nào?

Cách (a) thường cho về một bản nhận xét tổng quan, lịch sự, cân đối — kiểu "hợp đồng nhìn chung chặt chẽ, có vài điểm có thể cân nhắc thêm", khen trước chê sau, mỗi thứ một ít, từ chính tả đến bố cục. Không sai một chữ nào. Và nó có chỗ dùng thật: khi bạn cần một ánh nhìn nhanh xem văn bản có ổn đại thể không, hoặc khi chính bạn cũng chưa biết mình lo điều gì, một vòng quét rộng như vậy giúp bạn định vị. Vấn đề chỉ nảy sinh khi bạn cầm bản nhận xét đại thể đó đi trả lời một câu hỏi rất hẹp: "ký được chưa?"

Cách (b) cho về một thứ khác hẳn: một danh sách vấn đề có xếp hạng, tập trung đúng ba hướng bạn khoanh, và — vì bạn đã xin được chê — nó dám nói những câu khó nghe kiểu "điều khoản phạt ở mục X không có trần, bên B chịu rủi ro không giới hạn". Đây là minh họa pattern, không phải log thật, nhưng cái pattern thì rất ổn định: vai + phạm vi + khẩu vị rủi ro nói rõ đến đâu, góp ý sắc đến đó.

Cách (c) chậm hơn ở khâu chuẩn bị — bạn phải lục ra checklist và bản mẫu — nhưng nó cho thứ mà (b) không cho được: góp ý theo chuẩn của công ty bạn, chứ không phải theo chuẩn chung chung của một model giỏi. Nó hợp nhất khi văn bản thuộc loại có "luật chơi nội bộ" rõ ràng, và khi bạn sẽ còn review loại văn bản này nhiều lần nữa.

Ba cách, ba món đồ khác nhau, cho ba nhu cầu khác nhau. Nghệ thuật không nằm ở chỗ thuộc lòng cách (b) — mà ở chỗ biết chiều nay mình đang cần món nào.

## Vì sao review là đất diễn của vai, phạm vi và khẩu vị rủi ro

Ở Chương 2 ta đã "khai quật" mẹo đóng vai và kết luận: gán vai để tăng IQ cho model là việc thừa. Vậy sao cách (b) lại mở đầu bằng "bạn đóng vai bên phản biện"?

Vì ở đây vai không làm nhiệm vụ tăng IQ. Nó làm nhiệm vụ đổi góc nhìn — và với việc review, góc nhìn chính là một nửa cái brief. Cùng một bản hợp đồng, người của bên A đọc khác người của bên B, luật sư đọc khác kế toán, người sắp ký đọc khác người chỉ lướt qua cho biết. Một văn bản không có "lỗi" tuyệt đối; nó chỉ có lỗi đối với một góc nhìn và một mối lo cụ thể. Không nói cho model biết nó đang đứng ở đâu, nó sẽ đứng ở cái ghế trung lập dễ chịu nhất — và cho ra bản nhận xét trung lập dễ chịu tương ứng.

Mảnh thứ hai là phạm vi. Câu "bỏ qua lỗi chính tả" trong cách (b) nghe nhỏ mà đắt: nó giải phóng sự chú ý. Một người review giỏi được dặn "đừng lo câu chữ, lo giùm tôi rủi ro" sẽ đọc khác hẳn người được dặn "xem giúp toàn bộ". Với model cũng vậy — khoanh phạm vi không phải là trói nó lại, mà là dồn lực nó vào đúng chỗ bạn cần soi sâu. Ngược lại, có hôm bạn cần chính cái vòng quét rộng ấy; hôm đó thì đừng khoanh gì cả, và đừng phàn nàn khi góp ý dàn trải — dàn trải chính là thứ bạn đặt hàng.

Mảnh thứ ba, ít người nói rõ nhất: khẩu vị rủi ro. "Mình cần bị chê thẳng" và "bản này lọt lỗi thì mình chịu trận" không phải câu than thở cho vui — đó là thông tin nghiệm thu. Nó cho model biết cán cân giữa hai loại sai lầm: bỏ sót một vấn đề thật, và báo động nhầm một vấn đề không có. Với bản hợp đồng sắp ký, bạn thà nhận mười cảnh báo trong đó ba cái hơi quá tay, còn hơn một bản nhận xét êm ái bỏ sót đúng cái điều khoản chết người. Với bản tin nội bộ gửi chiều nay, cán cân ngược lại. Khẩu vị đó chỉ có bạn biết — nói ra thì model chỉnh theo được, không nói thì nó mặc định về mức an toàn, tức là mức lịch sự.

Và như Chương 3 đã bàn về chuyện giải thích lý do: nói kèm cả vì sao ("vì mình là người ký") giúp model hiểu ý định đằng sau yêu cầu, chứ không chỉ làm theo câu chữ. Anthropic viết trong hướng dẫn chính chủ (tính đến 08/2026): "Providing context or motivation behind your instructions... can help Claude better understand your goals and deliver more targeted responses" — cung cấp bối cảnh và động cơ đằng sau chỉ dẫn giúp model hiểu mục tiêu của bạn và trả lời trúng đích hơn. Với việc xin góp ý, cái "vì sao" thường chỉ tốn một mệnh đề, mà đổi được cả tông của bản review.

## Khi lời mô tả hết chữ: review theo tiêu chí của chính bạn

Cách (b) mạnh, nhưng nó có trần: bạn chỉ mô tả được những tiêu chí bạn gọi được tên. Trong khi đó, phần lớn "chuẩn" của một công ty không nằm trong lời — nó nằm trong những bản đã được duyệt, những checklist tích lũy qua các lần vấp, cái style guide mà ai đó dày công soạn rồi ít ai đọc lại.

Cách (c) là cách khai thác kho đó. Thay vì cố dịch chuẩn nội bộ ra thành lời dặn, bạn đưa thẳng vật chứng: checklist thật, bản mẫu từng được duyệt thật, và giao cho model việc đối chiếu. Model thế hệ này đọc tài liệu dài tốt, và việc "so văn bản A với chuẩn B rồi chỉ ra khoảng lệch" là đúng sở trường của nó.

Có hai cái lợi kín đáo ở đây. Một: góp ý trở nên cãi được. "Mục 4.2 chưa đạt tiêu chí số 7 trong checklist" là thứ bạn kiểm tra lại được trong ba mươi giây, khác hẳn "đoạn này cảm giác chưa chặt". Hai: chính bạn cũng học lại chuẩn của mình. Không ít lần nhờ model đối chiếu, bạn mới phát hiện checklist nội bộ có hai mục mâu thuẫn nhau, hoặc bản-được-duyệt năm ngoái thực ra đã phá chuẩn ở chỗ nào đó. Review bằng tiêu chí vật chất là con dao hai lưỡi theo nghĩa tốt: nó rà cả văn bản lẫn tiêu chí.

Dấu hiệu bạn nên chuyển từ (b) sang (c): bạn thấy mình gõ đi gõ lại cùng một đoạn mô tả tiêu chí ở lần review thứ ba trong tháng. Đó là lúc lời dặn nên được thay bằng file đính kèm — còn chuyện đóng gói hẳn thành quy trình dùng lại nhiều lần thì để Chương 8 kể.

## Kỹ thuật đảo chiều: bắt bản góp ý phải tự chứng minh

Nhận về một danh sách mười lăm góp ý, đừng vội coi đó là điểm kết thúc. Bản góp ý cũng là một output — và cũng nghiệm thu được. Có hai nước đi đảo chiều rất đáng tiền.

Nước thứ nhất: bắt model tự chấm bản góp ý của nó.

```text
Trong các góp ý trên, 3 góp ý nào đáng tiền nhất — tức là nếu mình
chỉ sửa được 3 chỗ trước deadline thì sửa chỗ nào? Và góp ý nào
thực ra chỉ là gãi ngứa, bỏ qua cũng không sao? Nói lý do xếp hạng.
```

Cái hay của câu này là nó ép phân loại. Model, cũng như người review tận tâm, có xu hướng liệt kê đủ; nhưng mười lăm góp ý ngang hàng nhau thì gần như vô dụng với người chỉ còn một buổi chiều. Buộc nó chia "đáng tiền" và "gãi ngứa" — kèm lý do — là bạn lấy được thứ quý nhất của một người review giỏi: khả năng ưu tiên, chứ không chỉ khả năng phát hiện.

Nước thứ hai: xin phản-đề.

```text
Giờ đổi phe: bạn là cố vấn của bên đối tác. Với từng điểm mình định
yêu cầu sửa, họ sẽ cãi lại thế nào, và điểm nào mình yếu lý nhất?
```

Nghe hơi ngược đời — vừa nhờ soi lỗi xong lại nhờ bênh phía bên kia — nhưng đây chính là chỗ "đổi góc nhìn" phát huy lần nữa. Bản phản-đề cho bạn thấy trước bàn đàm phán: yêu cầu sửa nào của bạn chắc lý, yêu cầu nào dễ bị bật lại, và bạn nên nhượng chỗ nào để giữ chỗ nào. Với kế hoạch truyền thông thì phản-đề là "sếp/khách hàng sẽ vặn gì trong buổi trình bày" — tập trận trước một mình, rẻ hơn nhiều so với vỡ trận trước đám đông.

Cả hai nước đi đều dựa trên một nguyên tắc chung: đừng chỉ tiêu thụ góp ý, hãy chất vấn nó. Người review — máy hay người — đều đáng được hỏi lại "vì sao chỗ này quan trọng?". Góp ý nào không sống sót qua câu hỏi đó thì bạn cũng đỡ tốn công sửa.

## Lời khen của model không phải là chứng nhận

Cần nói thẳng một sự thật về "tính cách" của các model hiện nay: chúng lịch sự. Đưa một văn bản và hỏi "thấy sao?", phản xạ mặc định của model là tìm điểm tốt để ghi nhận trước, chê thì nhẹ tay và kèm đệm êm. Điều này không phải lỗi — với đa số ngữ cảnh trò chuyện, lịch sự là hành vi đúng. Nhưng với việc review, lịch sự mặc định là nhiễu.

Hệ quả thực dụng: muốn bị chê, phải nói rõ mình muốn bị chê — và nói vì sao, như cách (b) đã làm. "Đừng khen, mình cần danh sách vấn đề, vì người chịu trách nhiệm cuối là mình" không phải câu làm màu; nó là công tắc chuyển model từ chế độ trò-chuyện-dễ-chịu sang chế độ phản-biện-có-ích. Và hệ quả ngược lại cũng đáng nhớ: khi model khen bản của bạn, đừng vội đem lời khen đó đi báo cáo. Lời khen không được "mua" bằng một yêu cầu phản biện tử tế thì gần với phép lịch sự hơn là với thẩm định.

Cuối cùng, nối lại sợi dây trách nhiệm đã giăng từ Chương 5: review máy không thay được người ký. Model có thể soi ra những thứ bạn bỏ sót lúc mắt đã mỏi, có thể đóng vai đối thủ tận tụy lúc ba giờ sáng, nhưng chữ ký dưới bản hợp đồng vẫn là của bạn, và người đứng ra giải trình khi kế hoạch truyền thông trượt vẫn là bạn. Cách dùng đúng là: để máy mở rộng tầm quét của bạn, rồi bạn tự mình đi qua từng điểm nó nêu và quyết. Điểm nào bạn không đủ hiểu để quyết — điều khoản pháp lý lạ, con số ngành bạn không nắm — thì đó là tín hiệu cần thêm một người thật có chuyên môn, không phải tín hiệu cần thêm một lượt chat.

Còn nếu điều bạn muốn không chỉ là cứu bản draft hôm nay, mà là qua từng lần bị chê để chính mình viết khá lên — kiểu "chỉ ra thói quen viết tôi nên bỏ" — thì đó là câu chuyện khác, và là câu chuyện của Chương 9.

## Điều cốt lõi

- Với việc review, ba mảnh brief quyết định chất lượng là: vai (đứng ở góc nhìn nào), phạm vi (soi gì, bỏ qua gì) và khẩu vị rủi ro (thà báo động nhầm hay thà bỏ sót).
- Đóng vai vẫn đáng dùng ở đây — để đổi góc nhìn, không phải để "tăng IQ" cho model.
- Khi lời mô tả hết chữ, đưa tiêu chí vật chất: checklist nội bộ, style guide, bản từng được duyệt — góp ý sẽ theo chuẩn của bạn và cãi được.
- Đừng chỉ nhận góp ý, hãy chất vấn nó: bắt model xếp hạng "đáng tiền vs gãi ngứa" và xin phản-đề từ phía bên kia.
- Model vốn lịch sự — muốn bị chê phải nói rõ và nói vì sao; lời khen mặc định của nó không phải chứng nhận, và người ký cuối cùng vẫn là bạn.
